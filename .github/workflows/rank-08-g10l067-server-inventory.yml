name: G10-L067 Windows network capability inventory
on:
  push:
    branches: [rank-08-g10l067-pwshwin-20261128]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check independent peer feasibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output ('ADMIN={0}' -f ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))
          Write-Output ('HYPERVISOR_PRESENT={0}' -f (Get-CimInstance Win32_ComputerSystem).HypervisorPresent)
          foreach ($name in @('Microsoft-Hyper-V-All','VirtualMachinePlatform','Microsoft-Windows-Subsystem-Linux','Containers')) {
            try {
              $feature = Get-WindowsOptionalFeature -Online -FeatureName $name -ErrorAction Stop
              Write-Output ('OPTIONAL_FEATURE={0};STATE={1}' -f $name,$feature.State)
            } catch { Write-Output ('OPTIONAL_FEATURE={0};STATE=UNAVAILABLE' -f $name) }
          }
          foreach ($name in @('wsl.exe','docker.exe','New-VMSwitch','New-ContainerNetwork')) {
            Write-Output ('COMMAND={0};EXISTS={1}' -f $name,[bool](Get-Command $name -ErrorAction SilentlyContinue))
          }
          $links = @(Get-NetIPAddress -AddressFamily IPv6 | Where-Object { $_.IPAddress -match '^fe80:' -and $_.AddressState -eq 'Preferred' } | Select-Object -ExpandProperty InterfaceIndex -Unique | Sort-Object)
          Write-Output ('PREFERRED_LINKLOCAL_INTERFACES={0}' -f $links.Count)
          foreach ($id in $links) {
            $iface = Get-NetIPInterface -InterfaceIndex $id -AddressFamily IPv6
            Write-Output ('INTERFACE_INDEX={0};METRIC={1};CONNECTION_STATE={2}' -f $id,$iface.InterfaceMetric,$iface.ConnectionState)
          }
          $distros = @(& wsl.exe --list --quiet 2>&1 | Where-Object { $_ -and $_ -notmatch 'no installed distributions' })
          Write-Output ('WSL_DISTRO_COUNT={0};EXIT={1}' -f $distros.Count,$LASTEXITCODE)
          try { $switches = @(Get-VMSwitch -ErrorAction Stop); Write-Output ('HYPERV_SWITCH_COUNT={0}' -f $switches.Count) } catch { Write-Output 'HYPERV_SWITCH_COUNT=UNAVAILABLE' }
          $dockerVersion = & docker.exe info --format '{{.ServerVersion}}' 2>&1
          Write-Output ('DOCKER_DAEMON_EXIT={0};VERSION={1}' -f $LASTEXITCODE,($dockerVersion -join ' '))
