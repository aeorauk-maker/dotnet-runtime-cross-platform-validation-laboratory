name: Hunter 0e9eff8b Linux native TLS observer
run-name: Hunter 0e9eff8b Linux native TLS observer
on:
  push:
    branches:
      - hunter-0e9eff8b-l24-tls
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Run owned loopback TLS controls
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info | head -25
          dotnet new console --framework net11.0 --no-restore --output l24
          cat > l24/Program.cs <<'CS'
          using System.Net;
          using System.Net.Sockets;
          using System.Net.Security;
          using System.Reflection;
          using System.Runtime.InteropServices;
          using System.Security.Authentication;
          using System.Security.Cryptography;
          using System.Security.Cryptography.X509Certificates;
          using System.Text.Json;
          
          var now = DateTimeOffset.UtcNow;
          using var rootAKey = RSA.Create(2048);
          using var rootBKey = RSA.Create(2048);
          using var leafKey = RSA.Create(2048);
          
          X509Certificate2 MakeRoot(string name, RSA key)
          {
              var request = new CertificateRequest($"CN={name}", key, HashAlgorithmName.SHA256, RSASignaturePadding.Pkcs1);
              request.CertificateExtensions.Add(new X509BasicConstraintsExtension(true, false, 0, true));
              request.CertificateExtensions.Add(new X509KeyUsageExtension(X509KeyUsageFlags.KeyCertSign, true));
              request.CertificateExtensions.Add(new X509SubjectKeyIdentifierExtension(request.PublicKey, false));
              return request.CreateSelfSigned(now.AddDays(-1), now.AddDays(30));
          }
          
          X509Certificate2 MakeLeaf(X509Certificate2 root, RSA key)
          {
              var request = new CertificateRequest("CN=api.example.test", key, HashAlgorithmName.SHA256, RSASignaturePadding.Pkcs1);
              request.CertificateExtensions.Add(new X509BasicConstraintsExtension(false, false, 0, true));
              request.CertificateExtensions.Add(new X509KeyUsageExtension(X509KeyUsageFlags.DigitalSignature, true));
              request.CertificateExtensions.Add(new X509EnhancedKeyUsageExtension(
                  new OidCollection { new Oid("1.3.6.1.5.5.7.3.1") }, false));
              var san = new SubjectAlternativeNameBuilder();
              san.AddDnsName("api.example.test");
              request.CertificateExtensions.Add(san.Build());
              using var issued = request.Create(root, now.AddHours(-1), now.AddDays(7), RandomNumberGenerator.GetBytes(16));
              return issued.CopyWithPrivateKey(key);
          }
          
          using var rootA = MakeRoot("Private Root A", rootAKey);
          using var rootB = MakeRoot("Private Root B", rootBKey);
          using var leafA = MakeLeaf(rootA, leafKey);
          
          bool? IsResumed(SslStream ssl)
          {
              if (!OperatingSystem.IsLinux()) return null;
              var field = typeof(SslStream).GetField("_securityContext", BindingFlags.Instance | BindingFlags.NonPublic);
              var handle = field?.GetValue(ssl) as SafeHandle;
              if (handle is null || handle.IsInvalid) return null;
              bool addRef = false;
              try
              {
                  handle.DangerousAddRef(ref addRef);
                  return NativeSsl.SessionReused(handle.DangerousGetHandle()) != 0;
              }
              catch (DllNotFoundException) { return null; }
              catch (EntryPointNotFoundException) { return null; }
              finally { if (addRef) handle.DangerousRelease(); }
          }
          
          async Task<object> ConnectionAsync(TcpListener listener, SslProtocols protocol,
              string name, X509Certificate2 trustedRoot, bool allowResume)
          {
              var serverTask = Task.Run(async () =>
              {
                  using var serverTcp = await listener.AcceptTcpClientAsync();
                  using var serverSsl = new SslStream(serverTcp.GetStream(), leaveInnerStreamOpen: false);
                  try
                  {
                      await serverSsl.AuthenticateAsServerAsync(new SslServerAuthenticationOptions
                      {
                          ServerCertificate = leafA,
                          EnabledSslProtocols = protocol,
                          AllowTlsResume = true,
                      });
                      await serverSsl.WriteAsync(new byte[] { 42 });
                      return new { success = true, error = (string?)null, resumed = IsResumed(serverSsl) };
                  }
                  catch (Exception ex)
                  {
                      return new { success = false, error = (string?)ex.GetType().Name, resumed = IsResumed(serverSsl) };
                  }
              });
              using var clientTcp = new TcpClient();
              await clientTcp.ConnectAsync(IPAddress.Loopback, ((IPEndPoint)listener.LocalEndpoint).Port);
              using var clientSsl = new SslStream(clientTcp.GetStream(), leaveInnerStreamOpen: false);
              var policy = new X509ChainPolicy
              {
                  TrustMode = X509ChainTrustMode.CustomRootTrust,
                  RevocationMode = X509RevocationMode.NoCheck,
              };
              policy.CustomTrustStore.Add(trustedRoot);
              policy.ExtraStore.Add(rootA);
              bool clientSuccess;
              string? clientError = null;
              bool? clientResumed = null;
              try
              {
                  await clientSsl.AuthenticateAsClientAsync(new SslClientAuthenticationOptions
                  {
                      TargetHost = "api.example.test",
                      CertificateChainPolicy = policy,
                      EnabledSslProtocols = protocol,
                      AllowTlsResume = allowResume,
                  });
                  var byteValue = new byte[1];
                  await clientSsl.ReadExactlyAsync(byteValue);
                  clientSuccess = clientSsl.IsAuthenticated && byteValue[0] == 42;
                  clientResumed = IsResumed(clientSsl);
              }
              catch (Exception ex)
              {
                  clientSuccess = false;
                  clientError = ex.GetType().Name;
                  clientResumed = IsResumed(clientSsl);
              }
              clientSsl.Dispose();
              clientTcp.Dispose();
              var server = await serverTask.WaitAsync(TimeSpan.FromSeconds(5));
              return new { name, protocol = protocol.ToString(), trust = trustedRoot.Subject,
                  allowResume, clientSuccess, clientError, clientResumed, server };
          }
          
          foreach (var protocol in new[] { SslProtocols.Tls12, SslProtocols.Tls13 })
          {
              using var listener = new TcpListener(IPAddress.Loopback, 0);
              listener.Start();
              Console.WriteLine(JsonSerializer.Serialize(await ConnectionAsync(listener, protocol, "cold_B_to_A", rootB, true)));
              for (int i = 0; i < 3; i++)
              {
                  Console.WriteLine(JsonSerializer.Serialize(await ConnectionAsync(listener, protocol, $"warm_A_{i}", rootA, true)));
              }
              Console.WriteLine(JsonSerializer.Serialize(await ConnectionAsync(listener, protocol, "warm_B_to_A_resume_allowed", rootB, true)));
              Console.WriteLine(JsonSerializer.Serialize(await ConnectionAsync(listener, protocol, "warm_B_to_A_resume_disabled", rootB, false)));
          }
          
          internal static class NativeSsl
          {
              [DllImport("System.Security.Cryptography.Native.OpenSsl", EntryPoint = "CryptoNative_SslSessionReused")]
              internal static extern int SessionReused(IntPtr ssl);
          }
          CS
          dotnet run --project l24/l24.csproj --configuration Release
