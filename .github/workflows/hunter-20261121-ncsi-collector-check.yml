name: Hunter NCSI collector syntax and telemetry check

on:
  push:
    branches: [hunter-20261121-canary-rce-inventory]
    paths:
      - .github/workflows/collect-ncsi-wpad.ps1
      - .github/workflows/hunter-20261121-ncsi-collector-check.yml

permissions:
  contents: read

jobs:
  collector-check:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse and run inert collector
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path '.github/workflows/collect-ncsi-wpad.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            throw "Collector parse errors: $($parseErrors.Count)"
          }
          Write-Output 'Collector parser: PASS'
          $out = Join-Path $env:RUNNER_TEMP 'ncsi-collector'
          & $script -OutputDirectory $out -Seconds 10
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Collector exit: $LASTEXITCODE" }
          foreach ($name in 'baseline.json','trace-start.txt','trace-stop.txt','window.txt') {
            $path = Join-Path $out $name
            if (-not (Test-Path $path)) { throw "Missing collector output: $name" }
            $length = (Get-Item $path).Length
            Write-Output "$name bytes=$length"
            if ($length -lt 20) { throw "Empty or truncated collector output: $name" }
          }
          $baseline = Get-Content (Join-Path $out 'baseline.json') -Raw | ConvertFrom-Json -ErrorAction Stop
          if (-not $baseline.Build.CurrentBuildNumber -or -not $baseline.OS.Version) { throw 'Missing OS/build identity' }
          $receiverFiles = @($baseline.Files | Where-Object { $_.SHA256 -match '^[0-9A-Fa-f]{64}$' })
          if ($receiverFiles.Count -lt 2) { throw 'Missing receiver file hashes' }
          Write-Output "Runner build=$($baseline.Build.CurrentBuildNumber).$($baseline.Build.UBR)"
          Write-Output "Receiver files with SHA-256=$($receiverFiles.Count)"
          $selfToken = [LabTokenReader]::Describe($PID)
          Write-Output "Token query for collector process=$selfToken"
          if ($selfToken -match 'query-error|open-.*-error') { Write-Warning 'At least one token information class was unavailable; preserve the explicit code and use an independent token witness on Canary.' }
          if (Test-Path (Join-Path $out 'collector-errors.txt')) {
            $collectorErrors = @(Get-Content (Join-Path $out 'collector-errors.txt'))
            $collectorErrors | ForEach-Object { Write-Output "Collector error: $_" }
            if ($collectorErrors.Count -gt 0) { throw 'Collector instrumentation error' }
          }
          Write-Output 'Collector runtime: PASS (standard Windows runner only)'
