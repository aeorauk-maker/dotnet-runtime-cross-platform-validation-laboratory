name: G09-L012 rank-33 AD CS issuer discriminator
on:
  push:
    branches: [g09-l012-rank33-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adcs-issuer:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Issue applicant CSRs with constrained standalone AD CS CA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path lab -Force | Out-Null
          [IO.File]::WriteAllBytes('lab/constrained-ca.pfx', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/rsa-root.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/rsa-ca.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/allowed.csr.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/forbidden.csr.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/duplicate.csr.der', [Convert]::FromBase64String(''))
          $meta = [ordered]@{
            runnerOS = $env:RUNNER_OS
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            os = [Environment]::OSVersion.VersionString
            featureBefore = $null
            installSuccess = $false
            caConfig = $null
            defaultRequestDisposition = $null
            cases = @()
          }
          try {
            $feature = Get-WindowsFeature ADCS-Cert-Authority
            $meta.featureBefore = $feature.InstallState.ToString()
            $installed = Install-WindowsFeature ADCS-Cert-Authority -IncludeManagementTools
            $meta.installSuccess = [bool]$installed.Success
            if (-not $installed.Success) { throw 'AD CS role installation failed' }
            $password = ConvertTo-SecureString 'INERT-R33-ADCS' -AsPlainText -Force
            Install-AdcsCertificationAuthority -CAType StandaloneSubordinateCA -CertFile (Resolve-Path 'lab/constrained-ca.pfx').Path -CertFilePassword $password -Force | Out-String | Set-Content lab/install.txt
            Start-Service CertSvc
            $config = "$env:COMPUTERNAME\Rank33 allowed.test delegated CA"
            $meta.caConfig = $config
            $meta.defaultRequestDisposition = ((certutil.exe -getreg Policy\RequestDisposition 2>&1) | Out-String)
            foreach ($name in @('allowed', 'forbidden', 'duplicate')) {
              $case = [ordered]@{ name=$name; submitExit=$null; submitText=$null; requestId=$null; resubmitExit=$null; retrieveExit=$null; issued=$false; sanExtensionCount=$null; derSha256=$null; error=$null }
              try {
                $submit = certreq.exe -submit -binary -config $config "lab/$name.csr.der" "lab/$name.der" 2>&1
                $case.submitExit = $LASTEXITCODE
                $case.submitText = ($submit | Out-String)
                $m = [regex]::Match($case.submitText, 'RequestId:\s*(\d+)', 'IgnoreCase')
                if ($m.Success) { $case.requestId = [int]$m.Groups[1].Value }
                if (-not (Test-Path "lab/$name.der") -and $case.requestId) {
                  $resubmit = certutil.exe -config $config -resubmit $case.requestId 2>&1
                  $case.resubmitExit = $LASTEXITCODE
                  ($resubmit | Out-String) | Set-Content "lab/$name.resubmit.txt"
                  $retrieve = certreq.exe -retrieve -binary -config $config $case.requestId "lab/$name.der" 2>&1
                  $case.retrieveExit = $LASTEXITCODE
                  ($retrieve | Out-String) | Set-Content "lab/$name.retrieve.txt"
                }
                if (Test-Path "lab/$name.der") {
                  $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2((Resolve-Path "lab/$name.der").Path)
                  $case.issued = $true
                  $case.sanExtensionCount = @($cert.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.17' }).Count
                  $case.derSha256 = (Get-FileHash "lab/$name.der" -Algorithm SHA256).Hash
                  (certutil.exe -dump "lab/$name.der" 2>&1 | Out-String) | Set-Content "lab/$name.dump.txt"
                }
              } catch {
                $case.error = $_.Exception.Message
              }
              $meta.cases += $case
            }
          } catch {
            $meta.fatal = $_.Exception.Message
          } finally {
            $meta | ConvertTo-Json -Depth 8 | Set-Content lab/results.json
            Get-Content lab/results.json
          }
      - name: Retain exact issued DER and control receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g09-l012-rank33-adcs-issuer
          path: lab/*
          if-no-files-found: warn
