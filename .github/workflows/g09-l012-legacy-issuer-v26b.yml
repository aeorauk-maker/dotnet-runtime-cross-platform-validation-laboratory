          OLFhfBfYkk4wDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAQEAfPLM
          8ywI6agq8O23cSK0Cp6WYwGE4/TW7jakNsh9L/opZMXyl2CHODutGclfthkOj8A/
          J9H7ylPRsVs1iPmu5jEImGmDSg3KF675UelPdqzEXYPMv1dge65rQUWUBhsbNJ5F
          itXAJLwuI5kLSR2fmB4x8fknXbE3LwmxD/ATqGdH9nC0nxiVhJqVUfWvy9qGyV0W
          c6pKbsy35xzCM2P4oChrEXnHV6/7JGnlFANetvHXqN4LXktm3ewtoRsuF33046fZ
          D1+WAMkSoJlC/jcEBaTmV/tk9I6p0ewd8K4M3vGWWXfhLk4m4hsdC0DDSgIKDfvY
          RxDKWww5jSzDRk4xDA==
          -----END CERTIFICATE-----
          RECEIVER_CERT
          cmp <(openssl x509 -in certs/ca_signing.crt -outform DER) <(openssl x509 -in issued/dogtag-ca-original.pem -outform DER)
          openssl x509 -in issued/dogtag-ca-original.pem -noout -subject -issuer -ext nameConstraints
          openssl verify -CAfile issued/bridge-root.pem issued/dogtag-ca-original.pem
          for label in allowed-cep duplicate-cep duplicate-client forbidden-cep reversed-cep; do
            set +e
            openssl verify -CAfile issued/bridge-root.pem -untrusted issued/dogtag-ca-original.pem "issued/$label-0.pem" >"issued/$label-constrained-verify.txt" 2>&1
            verify_rc=$?
            set -e
            echo "$label constrained_verify=$verify_rc"
            sed -n '1,3p' "issued/$label-constrained-verify.txt" | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g'
          done
          openssl cms -encrypt -aes256 -binary \
            -in private/leaf.key -out issued/applicant-leaf.key.cms \
            -outform DER recipient.pem
          test -s issued/applicant-leaf.key.cms

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g09-l012-dogtag-agentdiag-v26b
          path: |
            issued/
          if-no-files-found: ignore
          retention-days: 3

      - name: Dispose isolated CA and directory
        if: always()
        shell: bash
        run: |
          docker rm -f ca-g09l012 ds-g09l012 >/dev/null 2>&1 || true
          docker network rm g09l012 >/dev/null 2>&1 || true
