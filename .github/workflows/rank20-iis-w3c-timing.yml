name: Rank 20 IIS W3C timing discriminator

on:
  push:
    branches:
      - rank20-iis-w3c-timing-20261128

permissions:
  contents: read

jobs:
  iis-default-log:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Test default query logging and post-response visibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $features = @(Get-WindowsFeature -Name Web-Server,Web-Scripting-Tools,Web-Http-Logging)
          $missing = @($features | Where-Object { -not $_.Installed } | ForEach-Object { $_.Name })
          if ($missing.Count -gt 0) {
            $install = Install-WindowsFeature -Name $missing -IncludeManagementTools
            if (-not $install.Success -or $install.RestartNeeded -ne 'No') {
              throw "IIS feature installation did not complete without restart"
            }
          }
          Write-Host "http_logging_role_installed=$((Get-WindowsFeature -Name Web-Http-Logging).Installed)"
          Import-Module WebAdministration
          $siteName = 'Rank20IisW3cTiming'
          $port = 38421
          $root = Join-Path $env:RUNNER_TEMP 'rank20-iis-w3c-timing'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Set-Content -Path (Join-Path $root 'index.html') -Value 'owned inert IIS log timing fixture'
          New-Website -Name $siteName -PhysicalPath $root -Port $port -IPAddress '127.0.0.1' | Out-Null
          $site = Get-Website -Name $siteName
          $siteId = [int]$site.Id
          $logDir = "C:\inetpub\logs\LogFiles\W3SVC$siteId"
          Write-Host "site_id=$siteId"
          $defaultLog = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter 'system.applicationHost/sites/siteDefaults/logFile' -Name '.'
          $siteLog = Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter "system.applicationHost/sites/site[@name='$siteName']/logFile" -Name '.'
          $flags = [string]$defaultLog.logExtFileFlags
          Write-Host "default_logging_enabled=$($defaultLog.enabled)"
          Write-Host "default_query_field=$($flags -match 'UriQuery')"
          Write-Host "default_cookie_field=$($flags -match 'Cookie')"
          Write-Host "site_logging_enabled=$($siteLog.enabled)"
          Write-Host "site_query_field=$(([string]$siteLog.logExtFileFlags) -match 'UriQuery')"
          Write-Host "site_log_directory=$($siteLog.directory)"
          $token = ('A' * 284)
          $query = "access_token=$token"
          $url = "http://127.0.0.1:$port/index.html?$query"
          $start = [System.Diagnostics.Stopwatch]::StartNew()
          $response = Invoke-WebRequest -Uri $url -UseBasicParsing
          Write-Host "victim_status=$([int]$response.StatusCode)"
          $visible = $false
          $full = $false
          $elapsedMs = -1
          for ($i = 0; $i -lt 150; $i++) {
            $files = @(Get-ChildItem -Path $logDir -Filter '*.log' -File -ErrorAction SilentlyContinue)
            foreach ($file in $files) {
              $lines = @(Get-Content -Path $file.FullName -ErrorAction SilentlyContinue)
              if ($lines -match 'index\.html') {
                $visible = $true
                if ($lines -match [regex]::Escape($query)) {
                  $full = $true
                  $elapsedMs = $start.ElapsedMilliseconds
                  break
                }
              }
            }
            if ($full) { break }
            Start-Sleep -Milliseconds 200
          }
          Write-Host "row_visible_within_30s=$visible"
          Write-Host "full_query_visible_within_30s=$full"
          Write-Host "full_query_elapsed_ms=$elapsedMs"
          # Continue the traffic and actor controls even when the first row flushes early.
          if ($true) {
            $client = [System.Net.Http.HttpClient]::new()
            $seenAtRequest = -1
            $seenAtMs = -1
            try {
              for ($j = 1; $j -le 600; $j++) {
                $response2 = $client.GetAsync("http://127.0.0.1:$port/index.html?probe=$j").GetAwaiter().GetResult()
                if ([int]$response2.StatusCode -ne 200) { throw "Flush request failed" }
                $response2.Dispose()
                if ($j % 25 -eq 0) {
                  $files = @(Get-ChildItem -Path "$env:SystemDrive\inetpub\logs\LogFiles" -Recurse -Filter '*.log' -File -ErrorAction SilentlyContinue)
                  foreach ($file in $files) {
                    $lines = @(Get-Content -Path $file.FullName -ErrorAction SilentlyContinue)
                    if ($lines -match [regex]::Escape($query)) {
                      $seenAtRequest = $j
                      $seenAtMs = $start.ElapsedMilliseconds
                      break
                    }
                  }
                  if ($seenAtRequest -gt 0) { break }
                }
              }
            } finally { $client.Dispose() }
            Write-Host "victim_row_visible_after_generated_traffic=$($seenAtRequest -gt 0)"
            Write-Host "first_seen_after_request_count=$seenAtRequest"
            Write-Host "first_seen_elapsed_ms=$seenAtMs"
            Write-Host "log_file_count=$(@(Get-ChildItem -Path "$env:SystemDrive\inetpub\logs\LogFiles" -Recurse -Filter '*.log' -File -ErrorAction SilentlyContinue).Count)"
            $naturalFull = $false
            $naturalElapsedMs = -1
            for ($k = 0; $k -lt 150; $k++) {
              $files = @(Get-ChildItem -Path "$env:SystemDrive\inetpub\logs\LogFiles" -Recurse -Filter '*.log' -File -ErrorAction SilentlyContinue)
              foreach ($file in $files) {
                $lines = @(Get-Content -Path $file.FullName -ErrorAction SilentlyContinue)
                if ($lines -match [regex]::Escape($query)) {
                  $naturalFull = $true
                  $naturalElapsedMs = $start.ElapsedMilliseconds
                  break
                }
              }
              if ($naturalFull) { break }
              Start-Sleep -Seconds 1
            }
            Write-Host "full_query_visible_without_site_stop=$naturalFull"
            Write-Host "natural_full_query_elapsed_ms=$naturalElapsedMs"
            if ($naturalFull) {
              $readerName = 'rank20reader'
              $readerPassword = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
              $securePassword = ConvertTo-SecureString $readerPassword -AsPlainText -Force
              New-LocalUser -Name $readerName -Password $securePassword | Out-Null
              $credential = [pscredential]::new(".\$readerName", $securePassword)
              $actorScript = 'C:\Users\Public\Documents\rank20-reader.ps1'
              $actorOutput = 'C:\Users\Public\Documents\rank20-reader.out'
              @'
          $ErrorActionPreference = 'Stop'
          $q = 'access_token=' + ('A' * 284)
          $found = $false
          $isAdmin = ([Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "actor_is_admin=$isAdmin"
          $dirExists = $false
          try { $dirExists = Test-Path -Path 'C:\inetpub\logs\LogFiles' -ErrorAction Stop }
          catch { Write-Output "actor_dir_error_type=$($_.Exception.GetType().Name)" }
          Write-Output "actor_log_dir_exists=$dirExists"
          $fs = @()
          try { $fs = @(Get-ChildItem -Path 'C:\inetpub\logs\LogFiles' -Recurse -Filter '*.log' -File -ErrorAction Stop) }
          catch { Write-Output "actor_enum_error_type=$($_.Exception.GetType().Name)" }
          Write-Output "actor_file_count=$($fs.Count)"
          foreach ($f in $fs) {
            try {
              $ls = @(Get-Content -Path $f.FullName -ErrorAction Stop)
              if ($ls -match [regex]::Escape($q)) { $found = $true; break }
            } catch { Write-Output "actor_read_error_type=$($_.Exception.GetType().Name)" }
          }
          Write-Output "actor_full_query_visible=$found"
          '@ | Set-Content -Path $actorScript
              try {
                $actor = Start-Process -FilePath "$PSHOME\pwsh.exe" -ArgumentList @('-NoProfile','-File',$actorScript) -Credential $credential -Wait -PassThru -RedirectStandardOutput $actorOutput
                Write-Host "actor_exit_code=$($actor.ExitCode)"
                $actorLines = @(Get-Content -Path $actorOutput -ErrorAction SilentlyContinue)
                foreach ($line in $actorLines) {
                  if ($line -match '^actor_(is_admin|dir_error_type|log_dir_exists|file_count|enum_error_type|read_error_type|full_query_visible)=') { Write-Host $line }
                }
              } catch { Write-Host "actor_start_error_type=$($_.Exception.GetType().Name)" }
            }
            Stop-Website -Name $siteName
            Start-Sleep -Seconds 3
            $files = @(Get-ChildItem -Path "$env:SystemDrive\inetpub\logs\LogFiles" -Recurse -Filter '*.log' -File -ErrorAction SilentlyContinue)
            $afterStop = $false
            foreach ($file in $files) {
              $lines = @(Get-Content -Path $file.FullName -ErrorAction SilentlyContinue)
              if ($lines -match [regex]::Escape($query)) { $afterStop = $true; break }
            }
            Write-Host "full_query_after_site_stop=$afterStop"
          }
          if ([int]$response.StatusCode -ne 200) { throw "Static victim request failed" }
          if (-not ($flags -match 'UriQuery')) { throw "Default query field was absent" }
