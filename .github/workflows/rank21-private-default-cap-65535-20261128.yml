name: Rank 21 default-cap discriminator

on:
  push:
    branches:
      - pa30-rank21-l054-fd-capacity-20261128
    paths:
      - .github/workflows/rank21-private-default-cap-65535-20261128.yml
      - rank21-lab-v35-cap-65535-20261128.enc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Clean-extract private cap fixture
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.PA30_R21_LAB_KEY }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY"
          mkdir -p "$RUNNER_TEMP/c2-l054-v35-cap"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$GITHUB_WORKSPACE/rank21-lab-v35-cap-65535-20261128.enc" -out "$RUNNER_TEMP/c2-l054-v35-cap/MSRC_C2-L054_PoC.zip" -pass env:PRIVATE_KEY
          printf '%s  %s\n' '9cbabf91c3e88d32a43fe3a17f40af46602fdf00efdc01f8880daffe766498b4' "$RUNNER_TEMP/c2-l054-v35-cap/MSRC_C2-L054_PoC.zip" | sha256sum -c - >/dev/null
          unzip -t "$RUNNER_TEMP/c2-l054-v35-cap/MSRC_C2-L054_PoC.zip" >/dev/null
          mkdir "$RUNNER_TEMP/c2-l054-v35-cap/fresh"
          unzip -q "$RUNNER_TEMP/c2-l054-v35-cap/MSRC_C2-L054_PoC.zip" -d "$RUNNER_TEMP/c2-l054-v35-cap/fresh"
          cd "$RUNNER_TEMP/c2-l054-v35-cap/fresh"
          sha256sum -c manifest.sha256 >/dev/null
      - name: Run cap discriminator and controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/c2-l054-v35-cap/fresh"
          bash run.sh > replay.stdout 2>&1
      - name: Seal cap-discriminator evidence
        if: always()
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.PA30_R21_LAB_KEY }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/c2-l054-v35-cap/fresh"
          tar -czf "$RUNNER_TEMP/c2-l054-v35-cap/replay-evidence.tar.gz" --ignore-failed-read replay.stdout run-preflight.txt poc/status.txt poc/build.log poc/run.stdout poc/socket_evidence poc/evidence 2>/dev/null || true
          test -s "$RUNNER_TEMP/c2-l054-v35-cap/replay-evidence.tar.gz"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/c2-l054-v35-cap/replay-evidence.tar.gz" -out "$GITHUB_WORKSPACE/c2-l054-v35-cap-replay.enc" -pass env:PRIVATE_KEY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-l054-v35-cap-replay-sealed
          path: c2-l054-v35-cap-replay.enc
          retention-days: 1
