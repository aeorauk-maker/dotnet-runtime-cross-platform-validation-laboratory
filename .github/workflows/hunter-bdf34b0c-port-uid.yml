name: Hunter bdf34b0c Linux UID port control
on:
  push:
    branches:
      - hunter-bdf34b0c-port-uid
    paths:
      - .github/workflows/hunter-bdf34b0c-port-uid.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separate-user-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify separate users can bind separate high ports on one host
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/bdf34b0c-port-control.py <<'PY'
          import http.server
          import os
          import sys
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = f"euid={os.geteuid()} port={self.server.server_port}\n".encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), Handler).serve_forever()
          PY
          cd /tmp
          python3 bdf34b0c-port-control.py 50981 >bdf34b0c-high.log 2>&1 &
          high=$!
          sudo -u nobody python3 bdf34b0c-port-control.py 44444 >bdf34b0c-low.log 2>&1 &
          low=$!
          trap 'kill "$high" "$low" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --noproxy '*' -fsS http://127.0.0.1:50981/ -o /tmp/bdf34b0c-high.txt && curl --noproxy '*' -fsS http://127.0.0.1:44444/ -o /tmp/bdf34b0c-low.txt; then break; fi
            sleep 1
          done
          test "$(id -u)" != "$(id -u nobody)"
          test "$(cat /tmp/bdf34b0c-high.txt)" = "euid=$(id -u) port=50981" || { cat bdf34b0c-high.log; exit 1; }
          test "$(cat /tmp/bdf34b0c-low.txt)" = "euid=$(id -u nobody) port=44444" || { cat bdf34b0c-low.log; exit 1; }
          echo 'HIGH='"$(cat /tmp/bdf34b0c-high.txt)"
          echo 'LOW='"$(cat /tmp/bdf34b0c-low.txt)"
