name: Hunter 9a7b2b21 MSBuild pipe preflight
on:
  push:
    branches: [hunter-20261127-9a7b2b21-msbuild-il]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare high and restricted medium pipe clients
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -LiteralPath 'global.json' -Value '{"sdk":{"version":"11.0.100"}}'
          dotnet build MicPipeProbe.csproj -v:q
          if ($LASTEXITCODE -ne 0) { throw 'probe build failed' }
          $lab = Join-Path $env:RUNNER_TEMP 'hunter-9a7b2b21-victim'
          New-Item -ItemType Directory -Path $lab -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $lab 'global.json') -Value '{"sdk":{"version":"11.0.100"}}'
          Set-Content -LiteralPath (Join-Path $lab 'L38.csproj') -Value '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net11.0</TargetFramework></PropertyGroup></Project>'
          Push-Location $lab
          try {
            $env:DOTNET_CLI_USE_MSBUILD_SERVER = '1'
            dotnet build -v:diag *> build.log
            if ($LASTEXITCODE -ne 0) { Get-Content build.log -Tail 60; throw 'victim build failed' }
            Get-Content build.log | Select-String 'MSBuild Server node' | Select-Object -First 2
            $pipes = @(Get-ChildItem -LiteralPath '\\.\pipe\' -ErrorAction Stop | Where-Object { $_.Name -match 'MSBuildServer-' })
            Write-Output "PIPE_COUNT=$($pipes.Count)"
            if ($pipes.Count -ne 1) { throw 'ambiguous MSBuild server pipe count' }
            Write-Output "PIPE=$($pipes[0].Name)"
            $resultDir = Join-Path $env:PUBLIC 'Documents\hunter-9a7b2b21-L38'
            New-Item -ItemType Directory -Path $resultDir -Force | Out-Null
            icacls $resultDir /setintegritylevel '(OI)(CI)M'
            if ($LASTEXITCODE -ne 0) { throw 'result directory label failed' }
            $result = Join-Path $resultDir 'medium-client.txt'
            $probe = Join-Path $env:GITHUB_WORKSPACE 'bin\Debug\net11.0\MicPipeProbe.dll'
            dotnet $probe parent $pipes[0].Name $result
            if ($LASTEXITCODE -ne 0) { throw 'medium child setup failed' }
          } finally { Pop-Location }
