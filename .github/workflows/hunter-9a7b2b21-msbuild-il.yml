name: Hunter 9a7b2b21 MSBuild pipe preflight
on:
  push:
    branches: [hunter-20261127-9a7b2b21-msbuild-il]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Inspect token and MSBuild server pipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          whoami /groups | Select-String 'Mandatory Label|Administrators'
          dotnet --list-sdks | Select-String '10.0.404|11.0.100'
          $lab = Join-Path $env:RUNNER_TEMP 'hunter-9a7b2b21-msbuild'
          New-Item -ItemType Directory -Path $lab -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $lab 'global.json') -Value '{"sdk":{"version":"11.0.100"}}'
          Set-Content -LiteralPath (Join-Path $lab 'L38.csproj') -Value '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net11.0</TargetFramework></PropertyGroup></Project>'
          Push-Location $lab
          try {
            $env:DOTNET_CLI_USE_MSBUILD_SERVER = '1'
            dotnet build -v:diag *> build.log
            if ($LASTEXITCODE -ne 0) { Get-Content build.log -Tail 60; throw 'build failed' }
            Get-Content build.log | Select-String 'MSBuild Server node|MSBuildServer' | Select-Object -First 8
            $pipes = @(Get-ChildItem -LiteralPath '\\.\pipe\' -ErrorAction Stop | Where-Object { $_.Name -match 'MSBuildServer-' })
            Write-Output "PIPE_COUNT=$($pipes.Count)"
            foreach ($pipe in $pipes) {
              Write-Output "PIPE=$($pipe.FullName)"
              try { $acl = Get-Acl -LiteralPath $pipe.FullName -ErrorAction Stop; Write-Output "PIPE_SDDL=$($acl.Sddl)" } catch { Write-Output "PIPE_ACL_ERROR=$($_.Exception.GetType().Name)" }
            }
          } finally { Pop-Location }
