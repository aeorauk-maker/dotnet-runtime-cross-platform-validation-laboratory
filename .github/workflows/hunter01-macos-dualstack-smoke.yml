name: Hunter01 macOS dual-stack principal smoke
on:
  push:
    branches: [hunter-20261121-eop-rce-01]
    paths: [.github/workflows/hunter01-macos-dualstack-smoke.yml]
  workflow_dispatch:
jobs:
  loopback-principals:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check loopback address ownership across users
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hunter01-dualstack.py <<'PY'
          import os, socket, sys
          mode = sys.argv[1]
          if mode == 'v4':
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.bind(('127.0.0.1', 0))
              s.listen(1)
              with open(sys.argv[2], 'w') as f:
                  f.write(str(s.getsockname()[1]))
              print(f'v4_uid={os.getuid()} port={s.getsockname()[1]}', flush=True)
              conn, _ = s.accept()
              conn.sendall(b'IPV4')
              conn.close()
          elif mode == 'v6':
              s = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
              s.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
              s.bind(('::1', int(sys.argv[2])))
              s.listen(1)
              with open(sys.argv[3], 'w') as f:
                  f.write('ready')
              print(f'v6_uid={os.getuid()} port={sys.argv[2]}', flush=True)
              conn, _ = s.accept()
              conn.sendall(b'IPV6')
              conn.close()
          elif mode == 'client':
              s = socket.create_connection(('localhost', int(sys.argv[2])), timeout=5)
              print(f'client_uid={os.getuid()} family={s.family} peer={s.recv(8).decode()}', flush=True)
              s.close()
          PY
          chmod 644 /tmp/hunter01-dualstack.py
          port_file="$RUNNER_TEMP/hunter01-port"
          ready_file="/tmp/hunter01-ready-$GITHUB_RUN_ID"
          python3 /tmp/hunter01-dualstack.py v4 "$port_file" &
          v4_pid=$!
          v6_pid=0
          trap 'kill "$v4_pid" "$v6_pid" 2>/dev/null || true; sudo -n rm -f "$ready_file"; rm -f /tmp/hunter01-dualstack.py' EXIT
          for i in {1..100}; do test -s "$port_file" && break; sleep 0.05; done
          port="$(cat "$port_file")"
          sudo -n -u nobody python3 /tmp/hunter01-dualstack.py v6 "$port" "$ready_file" &
          v6_pid=$!
          for i in {1..100}; do test -s "$ready_file" && break; sleep 0.05; done
          test -s "$ready_file"
          python3 /tmp/hunter01-dualstack.py client "$port"
