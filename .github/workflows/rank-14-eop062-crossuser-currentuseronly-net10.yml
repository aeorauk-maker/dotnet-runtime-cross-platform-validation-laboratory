name: Rank 14 EOP062 cross-user pipe ownership control

on:
  push:
    branches:
      - rank-14-eop062-pa30-20261128
    paths:
      - eop062-crossuser-currentuseronly-net10.ps1
      - .github/workflows/rank-14-eop062-crossuser-currentuseronly-net10.yml

permissions:
  contents: read

jobs:
  windows-crossuser-pipe-ownership:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Test released runtime pipe owner guard
        shell: pwsh
        run: |
          '{"sdk":{"version":"10.0.404","rollForward":"disable"}}' | Set-Content global.json
          .\eop062-crossuser-currentuseronly-net10.ps1
