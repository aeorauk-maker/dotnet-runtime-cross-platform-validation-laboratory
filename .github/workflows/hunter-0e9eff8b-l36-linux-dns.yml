name: Hunter 0e9eff8b Linux resolver control

on:
  push:
    branches:
      - hunter-0e9eff8b-l36-dns-20261127
    paths:
      - .github/workflows/hunter-0e9eff8b-l36-linux-dns.yml

permissions: {}

jobs:
  resolver:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Resolve and connect loopback spellings
        shell: bash
        run: |
          python - <<'PY'
          import json
          import socket

          listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          listener.bind(('0.0.0.0', 0))
          listener.listen(3)
          port = listener.getsockname()[1]
          for host in ('127.0.0.1', '127.0.0.1.', '127.1.0.1.'):
              result = {'host': host}
              try:
                  infos = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
                  result['addresses'] = sorted(set(item[4][0] for item in infos))
                  with socket.create_connection((host, port), timeout=2) as client:
                      accepted, peer = listener.accept()
                      with accepted:
                          result['connected'] = True
                          result['peer'] = peer[0]
              except Exception as error:
                  result['connected'] = False
                  result['error'] = type(error).__name__ + ': ' + str(error)
              print(json.dumps(result, sort_keys=True))
          listener.close()
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Probe stock .NET loopback client
        shell: bash
        run: |
          mkdir -p probe
          cat > probe/probe.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFrameworks>net10.0;net11.0</TargetFrameworks></PropertyGroup></Project>
          XML
          cat > probe/Program.cs <<'CS'
          using System;
          using System.Net;
          using System.Net.Http;
          using System.Net.Sockets;
          using System.Text;
          using System.Text.Json;
          using System.Threading;
          using System.Threading.Tasks;
          var listener = new TcpListener(IPAddress.Any, 0);
          listener.Start();
          var port = ((IPEndPoint)listener.LocalEndpoint).Port;
          foreach (var host in new[] { "127.0.0.1", "127.0.0.1.", "127.1.0.1." }) {
              var reached = false;
              using var gate = new CancellationTokenSource(TimeSpan.FromSeconds(5));
              var server = Task.Run(async () => {
                  try {
                      using var peer = await listener.AcceptTcpClientAsync(gate.Token);
                      reached = true;
                      using var stream = peer.GetStream();
                      var buffer = new byte[4096];
                      await stream.ReadAsync(buffer, gate.Token);
                      await stream.WriteAsync(Encoding.ASCII.GetBytes("HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok"), gate.Token);
                  } catch (OperationCanceledException) { }
              });
              using var client = new HttpClient(new SocketsHttpHandler { UseProxy = false, ConnectTimeout = TimeSpan.FromSeconds(2) }) { Timeout = TimeSpan.FromSeconds(4) };
              string result;
              try { result = ((int)(await client.GetAsync($"http://{host}:{port}/")).StatusCode).ToString(); }
              catch (Exception error) { result = error.GetType().Name + ": " + error.Message; }
              gate.Cancel();
              await server;
              Console.WriteLine(JsonSerializer.Serialize(new { runtime = Environment.Version.ToString(), host, reached, result }));
          }
          listener.Stop();
          CS
          for framework in net10.0 net11.0; do dotnet run --project probe/probe.csproj --framework "$framework" --no-launch-profile; done
