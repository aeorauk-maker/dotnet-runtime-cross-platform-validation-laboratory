          EOP046_LAB_BASE64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record toolchain and install Android workload
        shell: bash
        working-directory: labs/eop046
        run: |
          dotnet --info
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sudo -H env -u XDG_RUNTIME_DIR ANDROID_HOME="$ANDROID_HOME" DOTNET_CLI_HOME="$RUNNER_TEMP/eop046-root-dotnet" "$(command -v dotnet)" workload install android --version 11.0.100.1
          dotnet workload list
      - name: Install emulator image and build controlled app
        shell: bash
        working-directory: labs/eop046
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --install 'system-images;android-35;google_apis;x86_64' 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          set -o pipefail
          test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          dotnet build android/android046.csproj -c Debug --nologo
          dotnet build peer/peer046.csproj -c Debug --nologo
          AVD_HOME="$RUNNER_TEMP/eop046-avds"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          echo no | ANDROID_AVD_HOME="$AVD_HOME" "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n eop046_android35 -k 'system-images;android-35;google_apis;x86_64' -p "$AVD_HOME/eop046_android35.avd" --force
          test -f "$AVD_HOME/eop046_android35.ini"
      - name: Boot owned Android 35 emulator
        shell: bash
        run: |
          test -e /dev/kvm
          test -f "$ANDROID_AVD_HOME/eop046_android35.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          sudo chown "$USER" /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" -avd eop046_android35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/eop046-emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          for attempt in $(seq 1 150); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && adb -s emulator-5554 shell cmd package list packages -3 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5554 shell cmd package list packages -3
      - name: Test unrelated Android app UID and device loopback
        shell: bash
        run: |
          mapfile -t peer_apks < <(find labs/eop046/peer/bin/Debug/net11.0-android -maxdepth 1 -type f -name "*-Signed.apk" -print)
          if [ "${#peer_apks[@]}" -eq 0 ]; then
            mapfile -t peer_apks < <(find labs/eop046/peer/bin/Debug/net11.0-android -maxdepth 1 -type f -name "*.apk" -print)
          fi
          test "${#peer_apks[@]}" -eq 1
          adb -s emulator-5554 install -r "${peer_apks[0]}"
          python3 labs/eop046/check_android_crossapp_environment.py
      - name: Preserve controlled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eop046-release-crossapp-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            labs/eop046/release-crossapp-environment.json
            ${{ runner.temp }}/eop046-emulator.log
