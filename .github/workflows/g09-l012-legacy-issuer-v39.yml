name: G09-L012 CSR-carried AIA applicant denial v39

on:
  push:
    branches:
      - pa30-rank11-g09l012-csraia-20261128-1651
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g09-l012-dogtag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SHARED: /tmp/workdir/pki
    steps:
      - name: Create isolated test CA and directory
        shell: bash
        run: |
          set -euo pipefail
          DS_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$DS_PASSWORD"
          echo "DS_PASSWORD=$DS_PASSWORD" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/dogtagpki/pki.git /tmp/pki-src
          docker network create g09l012
          /tmp/pki-src/tests/bin/ds-create.sh \
            --image=quay.io/389ds/dirsrv:latest \
            --hostname=ds.example.com \
            --network=g09l012 \
            --network-alias=ds.example.com \
            --password="$DS_PASSWORD" \
            ds-g09l012 >/tmp/ds-setup.log 2>&1 || { tail -n 60 /tmp/ds-setup.log | sed "s/$DS_PASSWORD/[masked]/g"; exit 1; }
          mkdir -p certs conf logs private issued
          # Use the official image's documented /certs/server.p12 import path.
          # The CA signing certificate has the constraint BEFORE Dogtag starts
          # and before any applicant CSR is submitted. All keys stay on runner.
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout private/bridge-root.key -out issued/bridge-root.pem -days 3 \
            -subj '/CN=G09-L012 Inert Constrained Root' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout private/issuer.key -out private/issuer.csr \
            -subj '/CN=CA Signing Certificate' >/dev/null 2>&1
          cp private/issuer.csr certs/ca_signing.csr
          cat > issuer.cnf <<'ISSUER_CONFIG'
          [v3_ca]
          basicConstraints=critical,CA:TRUE,pathlen:0
          keyUsage=critical,keyCertSign,cRLSign
          nameConstraints=critical,permitted;DNS:allowed.test
          subjectKeyIdentifier=hash
          authorityKeyIdentifier=keyid,issuer
          ISSUER_CONFIG
          openssl x509 -req -in private/issuer.csr \
            -CA issued/bridge-root.pem -CAkey private/bridge-root.key \
            -days 2 -extfile issuer.cnf -extensions v3_ca \
            -out certs/ca_signing.crt >/dev/null 2>&1
          openssl pkcs12 -export -inkey private/issuer.key \
            -in certs/ca_signing.crt -certfile issued/bridge-root.pem \
            -name ca_signing -caname bridge-root \
            -passout pass:Secret.123 -out certs/server.p12
          cp issued/bridge-root.pem certs/bridge-root.pem
          # Dogtag external-CA installer imports this chain into its validating NSS DB.
          # Patch only the two supported pkispawn options in a copy of the
          # official entry point; preserve its certificate generation and startup.
          python3 - <<'PYENTRY'
          from pathlib import Path
          src=Path('/tmp/pki-src/base/ca/bin/pki-ca-run').read_text()
          needle='OPTIONS+=(-D pki_import_system_certs=False)'+chr(10)
          assert src.count(needle)==1
          extra=('OPTIONS+=(-D pki_external=True)'+chr(10)
                 +'OPTIONS+=(-D pki_cert_chain_path=/certs/bridge-root.pem)'+chr(10)
                 +'OPTIONS+=(-D pki_cert_chain_nickname=bridge-root)'+chr(10))
          text=src.replace(needle,needle+extra)
          csr_option='OPTIONS+=(-D pki_ca_signing_csr_path=/conf/certs/ca_signing.csr)'
          assert text.count(csr_option)==1
          text=text.replace(csr_option, 'OPTIONS+=(-D pki_ca_signing_csr_path=/certs/ca_signing.csr)')
          csr_anchor='if [ -f /certs/ca_signing.csr ]'+chr(10)
          assert text.count(csr_anchor)==1
          trust='''echo "INFO: Establishing external root trust in /conf/alias"
          if pki -d /conf/alias -f /conf/password.conf nss-cert-show bridge-root > /dev/null 2>&1; then
              certutil -M -d /conf/alias -f /conf/password.conf -n bridge-root -t CT,C,C
          else
              pki -d /conf/alias -f /conf/password.conf nss-cert-import --cert /certs/bridge-root.pem --trust CT,C,C bridge-root
          fi
          pki -d /conf/alias -f /conf/password.conf nss-cert-verify --cert-usage SSLCA ca_signing
          '''
          # Complete external CA installation through the documented second
          # pkispawn step, before serving any applicant request.
          anchor='pkispawn "${OPTIONS[@]}"'+chr(10)
          assert text.count(anchor)==1
          second=(anchor
                  +'OPTIONS+=(-D pki_external_step_two=True)'+chr(10)
                  +'OPTIONS+=(-D pki_ca_signing_cert_path=/certs/ca_signing.crt)'+chr(10)
                  +'pkispawn "${OPTIONS[@]}"'+chr(10))
          text=text.replace(anchor,second)
          Path('certs/g09-ca-run').write_text(text.replace(csr_anchor,trust+csr_anchor))
          PYENTRY
          echo "Official source entry SHA256=$(sha256sum /tmp/pki-src/base/ca/bin/pki-ca-run | cut -d' ' -f1)"
          echo "External-chain entry point SHA256=$(sha256sum certs/g09-ca-run | cut -d' ' -f1)"
          openssl x509 -in certs/ca_signing.crt -noout -subject -issuer -ext nameConstraints
          docker run --detach \
            --name ca-g09l012 \
            --hostname allowed.test \
            --network g09l012 \
            --network-alias allowed.test \
            -p 127.0.0.1:18443:8443 \
            -v "$PWD/certs:/certs" \
            -v "$PWD/conf:/conf" \
            -v "$PWD/logs:/logs" \
            -e PKI_DS_URL=ldap://ds.example.com:3389 \
            -e PKI_DS_PASSWORD="$DS_PASSWORD" \
            quay.io/dogtagpki/pki-ca:latest \
            /bin/sh -ec 'echo Image-entry-SHA256=$(sha256sum /usr/share/pki/ca/bin/pki-ca-run | cut -d" " -f1); exec /bin/sh -e /certs/g09-ca-run' >/dev/null
          ready=false
          for i in $(seq 1 45); do
            if curl -ksS --max-time 2 -o /dev/null https://127.0.0.1:18443/ca/; then ready=true; break; fi
            state="$(docker inspect -f '{{.State.Status}}' ca-g09l012 2>/dev/null || true)"
            if [ "$state" = exited ] || [ "$state" = dead ]; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "CA startup status: $(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' ca-g09l012 2>/dev/null || true)"
            docker logs --tail 180 ca-g09l012 2>&1 \
              | sed "s/$DS_PASSWORD/[masked]/g" \
              | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' \
              | grep -Ei 'error|fail|exception|invalid|import|pkcs|cert|nss|trust|pkispawn|password|Image-entry-SHA256' \
              | tail -n 65 || true
            docker cp ca-g09l012:/tmp/sslserver.crt /tmp/g09-sslserver.crt >/dev/null 2>&1 || true
            if [ -s /tmp/g09-sslserver.crt ]; then
              openssl x509 -in /tmp/g09-sslserver.crt -noout -subject -issuer -ext subjectAltName
              openssl verify -CAfile issued/bridge-root.pem -untrusted certs/ca_signing.crt /tmp/g09-sslserver.crt || true
            fi
            exit 2
          fi
          docker exec ca-g09l012 sha256sum /usr/share/pki/ca/bin/pki-ca-run
          echo "Copied entry-point second-stage call:"
          docker exec ca-g09l012 sh -c "grep -n -E 'pki_external|pki_ca_signing_cert_path|pkispawn' /certs/g09-ca-run | tail -n 12"
          echo "External installer branch markers:"
          docker logs ca-g09l012 2>&1 \
            | sed "s/$DS_PASSWORD/[masked]/g" \
            | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' \
            | grep -Ei 'skipping configuration|configuring subsystem|configuration complete|finalizing subsystem|skipping installation|external step|importing CA signing cert|importing system certs|starting CA server' \
            | tail -n 75 || true
          echo "Copied entry-point header and syntax before first restart:"
          docker exec ca-g09l012 sh -c "sed -n '1,8p' /certs/g09-ca-run; sh -n /certs/g09-ca-run; sha256sum /certs/g09-ca-run"
          echo "Installer log file inventory:"
          docker exec ca-g09l012 find /logs -maxdepth 4 -type f -printf '%p %s bytes\n' | head -n 35
          echo "Installer first CA signing-unit messages:"
          docker exec ca-g09l012 sh -c "find /logs -maxdepth 4 -type f -print0 | xargs -0 -r grep -h -E 'CertificateAuthority: Initializing cert signing unit|CASigningUnit.init|SigningUnit: Loading|SigningUnit: cert chain|CA signing key and cert not|CMSCORE_CA_SIGNING|Certificate not found|Private key not found|certificate chain|buildCertificateChain' 2>/dev/null | head -n 100" \
            | sed "s/$DS_PASSWORD/[masked]/g" \
            | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' || true
          set +e
          docker exec ca-g09l012 pki -d /conf/alias -f /conf/password.conf nss-cert-verify --cert-usage SSLCA ca_signing
          signer_verify_rc=$?
          set -e
          echo "Installer NSS signer verify rc=$signer_verify_rc"
          docker exec ca-g09l012 pki -d /conf/alias -f /conf/password.conf nss-key-find --nickname ca_signing --output-format json > /tmp/g09-keyfind-before.json
          python3 - <<'PYKEY1'
          import json
          j=json.load(open('/tmp/g09-keyfind-before.json'))
          print('Installer NSS key association total=',j.get('total'),'fields=',sorted(j))
          PYKEY1
          docker exec ca-g09l012 sh -c "grep -E '^ca.signing.(nickname|certnickname|tokenname|defaultSigningAlgorithm|cert)=' /conf/ca/CS.cfg | sed -E 's/(^ca.signing.cert=).*/\1[public-cert-redacted]/'" || true
          docker exec ca-g09l012 pki-server ca-db-init -v >/tmp/ca-db-init.log 2>&1
          docker exec ca-g09l012 pki-server ca-db-index-add -v >/tmp/ca-index.log 2>&1
          docker exec ca-g09l012 pki-server ca-db-index-rebuild -v >/tmp/ca-rebuild.log 2>&1
          docker exec ca-g09l012 pki-server cert-export --cert-file /conf/certs/ca_signing.crt ca_signing
          mkdir -p issued
          sudo install -m 0644 conf/certs/ca_signing.crt issued/dogtag-ca-original.pem
          openssl x509 -in issued/dogtag-ca-original.pem -noout -subject -issuer
          docker exec ca-g09l012 pki-server ca-cert-import \
            --cert /conf/certs/ca_signing.crt \
            --csr /conf/certs/ca_signing.csr \
            --profile /usr/share/pki/ca/conf/caCert.profile >/tmp/ca-import.log 2>&1
          echo "CA import bootstrap diagnostics:"
          sed -n '1,22p' /tmp/ca-import.log | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g'
          echo "CA initialized; legacy policy before change:"
          docker exec ca-g09l012 grep '^ca.Policy.enable=' /conf/ca/CS.cfg
          docker exec ca-g09l012 pki-server ca-config-set ca.Policy.enable true
          # Keep default ManualAuthentication; the separate agent must approve.
          # The distributed deprecated-policy configuration still names its
          # pre-move Java packages. Repoint registrations to the unmodified
          # packaged policy classes; preserve all rules and predicates.
          docker exec ca-g09l012 sed -i \
            -e 's/com\.netscape\.cms\.policy\.constraints\./org.dogtagpki.legacy.server.policy.constraints./g' \
            -e 's/com\.netscape\.cms\.policy\.extensions\./org.dogtagpki.legacy.server.policy.extensions./g' \
            /conf/ca/CS.cfg
          # Only repair the missing static legacy response page. Use the
          # current official source checkout; preserve signer and policies.
          template=/tmp/pki-src/base/ca/shared/webapps/ca/ee/ca/EnrollSuccess.template
          test -s "$template"
          docker exec ca-g09l012 mkdir -p /usr/share/pki/ca/webapps/ca/ca
          docker cp "$template" ca-g09l012:/usr/share/pki/ca/webapps/ca/ca/EnrollSuccess.template
          echo "Repaired legacy static template SHA256=$(sha256sum "$template" | cut -d' ' -f1)"
          agent_template=/tmp/pki-src/base/ca/shared/webapps/ca/agent/ca/processCertReq.template
          test -s "$agent_template"
          docker cp "$agent_template" ca-g09l012:/usr/share/pki/ca/webapps/ca/ca/processCertReq.template
          echo "Repaired agent response template SHA256=$(sha256sum "$agent_template" | cut -d' ' -f1)"
          echo "CA operational state after documented external step two:"
          docker exec ca-g09l012 grep '^cs.state=' /conf/ca/CS.cfg
          docker restart ca-g09l012 >/dev/null
          for i in $(seq 1 90); do
            if curl -ksS --max-time 2 -o /dev/null https://127.0.0.1:18443/ca/; then break; fi
            sleep 2
          done
          echo "Copied entry-point header after restart:"
          docker exec ca-g09l012 sh -c "sed -n '1,8p' /certs/g09-ca-run; sh -n /certs/g09-ca-run; sha256sum /certs/g09-ca-run"
          echo "Post-restart log file inventory:"
          docker exec ca-g09l012 find /logs -maxdepth 4 -type f -printf '%p %s bytes\n' | head -n 35
          echo "Post-restart first CA signing-unit messages:"
          docker exec ca-g09l012 sh -c "find /logs -maxdepth 4 -type f -print0 | xargs -0 -r grep -h -E 'CertificateAuthority: Initializing cert signing unit|CASigningUnit.init|SigningUnit: Loading|SigningUnit: cert chain|CA signing key and cert not|CMSCORE_CA_SIGNING|Certificate not found|Private key not found|certificate chain|buildCertificateChain' 2>/dev/null | head -n 150" \
            | sed "s/$DS_PASSWORD/[masked]/g" \
            | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' || true
          echo "Post-restart startup console first CA messages:"
          docker logs ca-g09l012 2>&1 \
            | sed "s/$DS_PASSWORD/[masked]/g" \
            | grep -Ei 'CertificateAuthority: Initializing|CASigningUnit.init|SigningUnit: Loading|SigningUnit: cert chain|CA signing key and cert not|CMSCORE_CA_SIGNING|Certificate not found|Private key not found|certificate chain|buildCertificateChain|g09-ca-run: line' \
            | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' \
            | head -n 140 || true
          echo "Sanitized startup log slices (first/last relevant lines):"
          docker exec ca-g09l012 sh -c 'cat /logs/ca/debug.*.log' > /tmp/g09-ca-debug.log
          python3 - <<'PYLOG'
          import pathlib,re,os
          secret=os.environ.get('DS_PASSWORD','')
          paths=[pathlib.Path('/tmp/g09-ca-debug.log')]+sorted(pathlib.Path('logs/pki').glob('debug*.log'))
          for p in paths:
              lines=p.read_text(errors='replace').splitlines()
              hits=[(i,x) for i,x in enumerate(lines,1) if re.search(r'(?i)warn|error|exception|sign|chain|cert|init|CAEngine|SecurityDomain|pre-op',x)]
              chosen=[(i,x) for i,x in enumerate(lines,1) if 340 <= i <= 475] if p.name=='g09-ca-debug.log' else hits[:12]
              print('LOG',p,'line_count',len(lines),'matched',len(hits))
              seen=set()
              for i,line in chosen:
                  if i in seen: continue
                  seen.add(i)
                  if re.search(r'(?i)password|secret|private.key|credential',line):
                      line='[sensitive line redacted]'
                  if secret: line=line.replace(secret,'[masked]')
                  line=re.sub(r'[A-Za-z0-9+/=]{80,}','[long-value-redacted]',line)
                  print(f'{i}: {line[:450]}')
          PYLOG
          echo "Post-restart CA operational state and service startup:"
          docker exec ca-g09l012 grep '^cs.state=' /conf/ca/CS.cfg
          docker exec ca-g09l012 sh -c "grep -h 'CAEngine: Starting CA services' /logs/ca/debug* 2>/dev/null | tail -n 3" || true
          echo "Post-restart signer configuration:"
          docker exec ca-g09l012 sh -c "grep -E '^ca.signing.(nickname|certnickname|tokenname|defaultSigningAlgorithm|cert)=' /conf/ca/CS.cfg | sed -E 's/(^ca.signing.cert=).*/\1[public-cert-redacted]/'" || true
          set +e
          docker exec ca-g09l012 pki -d /conf/alias -f /conf/password.conf nss-cert-verify --cert-usage SSLCA ca_signing
          signer_post_rc=$?
          set -e
          echo "Post-restart NSS signer verify rc=$signer_post_rc"
          docker exec ca-g09l012 pki -d /conf/alias -f /conf/password.conf nss-key-find --nickname ca_signing --output-format json > /tmp/g09-keyfind-after.json
          python3 - <<'PYKEY2'
          import json
          j=json.load(open('/tmp/g09-keyfind-after.json'))
          print('Post-restart NSS key association total=',j.get('total'),'fields=',sorted(j))
          PYKEY2
          echo "Legacy policy after change:"
          docker exec ca-g09l012 grep -E '^ca.Policy.enable=|^ca.Policy.systemPolicies.enable=|^ca.Policy.rule.SubjectAltNameExt.predicate=' /conf/ca/CS.cfg
          docker exec ca-g09l012 grep '^ca.Policy.impl.AttributePresentConstraints.class=' /conf/ca/CS.cfg
          echo "Source and image versions:"
          git -C /tmp/pki-src rev-parse HEAD
          docker image inspect quay.io/dogtagpki/pki-ca:latest --format '{{.Id}}'

      - name: Generate signed, inert CSR controls
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --silent node-forge@1.3.1
          mkdir -p private
          cat > /tmp/make-csrs.js <<'JS'
          const forge = require(process.cwd() + '/node_modules/node-forge');
          const fs = require('fs');
          const pki = forge.pki;
          const keys = pki.rsa.generateKeyPair(2048);
          fs.writeFileSync('private/leaf.key',pki.privateKeyToPem(keys.privateKey));
          function aiaExtension() {
            const asn1 = forge.asn1;
            const access = asn1.create(asn1.Class.UNIVERSAL, asn1.Type.SEQUENCE, true, [
              asn1.create(asn1.Class.UNIVERSAL, asn1.Type.SEQUENCE, true, [
                asn1.create(asn1.Class.UNIVERSAL, asn1.Type.OID, false,
                  asn1.oidToDer('1.3.6.1.5.5.7.48.1').getBytes()),
                asn1.create(asn1.Class.CONTEXT_SPECIFIC, 6, false,
                  'http://127.0.0.1:18181/ocsp')
              ])
            ]);
            return {id:'1.3.6.1.5.5.7.1.1', value:asn1.toDer(access).getBytes()};
          }
          function make(label, names) {
            const csr = pki.createCertificationRequest();
            csr.publicKey = keys.publicKey;
            csr.setSubject([{name:'commonName',value:'allowed.test'}]);
            const exts = names.map(n => ({name:'subjectAltName',altNames:[{type:2,value:n}]}));
            exts.push(aiaExtension());
            csr.setAttributes([{name:'extensionRequest',extensions:exts}]);
            csr.sign(keys.privateKey,forge.md.sha256.create());
            if (!csr.verify()) throw new Error('CSR signature invalid');
            fs.writeFileSync('private/' + label + '.pem',pki.certificationRequestToPem(csr));
          }
          make('duplicate-first',['forbidden.test','allowed.test']);
          make('duplicate-reversed',['allowed.test','forbidden.test']);
          make('allowed-single',['allowed.test']);
          make('forbidden-single',['forbidden.test']);
          JS
          node /tmp/make-csrs.js
          for csr in private/*.pem; do
            openssl req -in "$csr" -verify -noout
            openssl req -in "$csr" -noout -text | grep -q 'Authority Information Access'
          done
          echo "All five signed CSR controls carry the inert OCSP AIA extension."
          echo "Signed controls created locally on disposable runner; keys and CSR bodies withheld from logs."

      - name: Submit through applicant-facing legacy endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p responses
          submit() {
            label="$1"; type="$2"; csr="$3"
            code="$(curl -ksS --max-time 30 -o "responses/$label.html" -w '%{http_code}' \
              --data-urlencode "certType=$type" \
              --data-urlencode "pkcs10Request@private/$csr.pem" \
              https://127.0.0.1:18443/ca/enrollment || true)"
            echo "$label HTTP=$code bytes=$(wc -c <"responses/$label.html")"
          }
          submit duplicate-cep CEP-Request duplicate-first
          submit duplicate-client client duplicate-first
          submit reversed-cep CEP-Request duplicate-reversed
          submit allowed-cep CEP-Request allowed-single
          submit forbidden-cep CEP-Request forbidden-single
          python3 - <<'PY'
          import html,re,pathlib
          for path in sorted(pathlib.Path('responses').glob('*.html')):
              s=html.unescape(path.read_text(errors='replace'))
              ids=sorted(set(re.findall(r'(?i)(?:request\s*id|requestId)[^0-9]{0,30}(\d{1,64})',s)))
              state=sorted(set(re.findall(r'(?i)\b(?:pending|complete|rejected|failed|error|approved)\b',s)))
              certs=len(re.findall(r'BEGIN CERTIFICATE',s))
              print(f'{path.stem}: request_ids={ids} states={state} pem_certificates={certs}')
          PY

      - name: Approve pending legacy requests through the real agent servlet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pending approval private
          python3 - <<'PYIDS' > /tmp/g09-request-ids.tsv
          import html,pathlib,re
          for path in sorted(pathlib.Path('responses').glob('*.html')):
              s=html.unescape(path.read_text(errors='replace'))
              ids=set(re.findall(r'(?i)(?:request\s*id|requestId)[^0-9]{0,30}(\d{1,64})',s))
              if len(ids)!=1 or 'pending' not in s.lower():
                  raise SystemExit(f'{path.stem}: expected one pending request, found {len(ids)} IDs')
              print(path.stem, ids.pop(), sep='\t')
          PYIDS
          cp responses/*.html pending/
          openssl req -newkey rsa:2048 -nodes -keyout private/agent.key -out private/agent.csr \
            -subj '/CN=G09 Agent' >/dev/null 2>&1
          docker cp private/agent.csr ca-g09l012:/tmp/agent.csr
          docker exec ca-g09l012 pki-server ca-cert-create \
            --csr /tmp/agent.csr \
            --profile /usr/share/pki/ca/conf/rsaAdminCert.profile \
            --cert /tmp/agent.crt --import-cert >/tmp/g09-agent-create.log 2>&1
          docker cp ca-g09l012:/tmp/agent.crt private/agent.crt
          docker exec ca-g09l012 pki-server ca-user-add \
            --full-name "G09 Agent" --type agentType \
            --cert /tmp/agent.crt agent >/tmp/g09-agent-user.log 2>&1
          docker exec ca-g09l012 pki-server ca-user-role-add agent 'Certificate Manager Agents' >/dev/null
          # The shipped legacy servlet names resourceID=param-name. Grant only
          # the existing CA agent role the same execute right as the shipped
          # cert-request ACL; retain manual approval and distinct applicant key.
          base_dn="$(docker exec ca-g09l012 sh -c "sed -n 's/^internaldb.basedn=//p' /conf/ca/CS.cfg" | tr -d '\r')"
          test -n "$base_dn"
          cat >private/legacy-agent-acl.ldif <<EOF_ACL
          dn: cn=aclResources,$base_dn
          changetype: modify
          add: resourceACLS
          resourceACLS: param-name:execute:allow (execute) group="Certificate Manager Agents":CA agents may execute the legacy cert-request approval servlet
          EOF_ACL
          docker exec -i ds-g09l012 ldapmodify -x -H ldap://127.0.0.1:3389 \
            -D 'cn=Directory Manager' -w "$DS_PASSWORD" \
            <private/legacy-agent-acl.ldif >/tmp/g09-agent-acl-mod.log 2>&1 || { sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' /tmp/g09-agent-acl-mod.log; exit 1; }
          echo 'Configured agent-only execute ACL for legacy servlet resource'
          docker restart ca-g09l012 >/dev/null
          ready=false
          for i in $(seq 1 30); do
            if curl -ksS --max-time 2 -o /dev/null https://127.0.0.1:18443/ca/; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          # Applicant has no agent certificate or role. Its identical approval
          # request must neither issue a cert nor make one publicly discoverable.
          applicant_id="$(awk -F '\t' '$1=="duplicate-cep" { print $2 }' /tmp/g09-request-ids.tsv)"
          test -n "$applicant_id"
          unauth_http="$(curl -ksS --max-time 30 -o pending/no-agent-approval.html -w '%{http_code}' \
            --data-urlencode "seqNum=$applicant_id" --data-urlencode 'toDo=accept' \
            --data-urlencode 'signatureAlgorithm=SHA256withRSA' \
            --data-urlencode 'notValidBefore=' --data-urlencode 'notValidAfter=' \
            https://127.0.0.1:18443/ca/agent/ca/processCertReq || true)"
          python3 - "$unauth_http" <<'PYDENY'
          import html,json,pathlib,re,ssl,sys,urllib.parse,urllib.request,xml.etree.ElementTree as ET
          page=html.unescape(pathlib.Path('pending/no-agent-approval.html').read_text(errors='replace'))
          pre=page.split('<BODY',1)[0]
          no_serial=not bool(re.search(r'^\s*header\.serialNumber\s*=',pre,re.M))
          no_accept=not bool(re.search(r'^\s*header\.toDo\s*=\s*"accept"',pre,re.M))
          ctx=ssl._create_unverified_context()
          query=urllib.parse.urlencode({'xml':'true','subjectInUse':'on','commonName':'allowed.test','match':'exact','maxResults':'20'})
          with urllib.request.urlopen('https://127.0.0.1:18443/ca/ee/ca/srchCerts?'+query,context=ctx,timeout=30) as response:
              search_http=response.status
              root=ET.fromstring(response.read())
          records=root.findall('.//records/record')
          result={'unauth_approval_http':sys.argv[1],'unauth_response_bytes':len(page),'no_issued_serial':no_serial,'no_accept_field':no_accept,'public_search_http':search_http,'public_record_count_before_agent':len(records)}
          pathlib.Path('issued/no-agent-control.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print('NO-AGENT CONTROL',json.dumps(result,sort_keys=True))
          if not (no_serial and no_accept and len(records)==0):
              raise SystemExit('Applicant-only approval produced issuance evidence')
          PYDENY
          while IFS=$'\t' read -r label id; do
            code="$(curl -ksS --max-time 30 --cert private/agent.crt --key private/agent.key \
              -o "approval/$label.html" -w '%{http_code}' \
              --data-urlencode "seqNum=$id" --data-urlencode 'toDo=accept' \
              --data-urlencode 'signatureAlgorithm=SHA256withRSA' \
              --data-urlencode 'notValidBefore=' --data-urlencode 'notValidAfter=' \
              https://127.0.0.1:18443/ca/agent/ca/processCertReq || true)"
            echo "$label agent-approval HTTP=$code bytes=$(wc -c <"approval/$label.html")"
            if [ "$label" = allowed-cep ]; then
              docker exec ca-g09l012 sh -c 'for f in /logs/ca/signedAudit/ca_audit* /var/lib/pki/pki-tomcat/logs/ca/signedAudit/ca_audit*; do test -f "$f" && tail -n 300 "$f"; done' >private/allowed-audit.log 2>/dev/null || true
              docker exec ca-g09l012 sh -c 'for f in /logs/ca/debug* /var/lib/pki/pki-tomcat/logs/ca/debug*; do test -f "$f" && tail -n 700 "$f"; done' >private/allowed-debug.log 2>/dev/null || true
              python3 - <<'PYAUDIT'
          import json,pathlib,re
          a=pathlib.Path('private/allowed-audit.log').read_text(errors='replace')
          d=pathlib.Path('private/allowed-debug.log').read_text(errors='replace')
          rows=[]
          for line in a.splitlines():
              fields=dict(re.findall(r'\[([A-Za-z][A-Za-z0-9]*)=([^\]]*)\]',line))
              event=fields.get('AuditEvent')
              if event not in ('AUTH','AUTHZ'): continue
              rows.append({'event':event, **{k:fields[k].strip()[:90] for k in ('Outcome','AuthMgr','aclResource','Op') if k in fields}})
          result={'audit_bytes':len(a),'audit_events':rows[-12:],
                  'debug_bytes':len(d),
                  'debug_client_cert_observed':bool(re.search(r'certUID=',d)),
                  'debug_userid_observed':bool(re.search(r'CMSServlet: userid=',d)),
                  'debug_missing_client_cert':bool(re.search(r'no client certificate found|did not provide a valid certificate',d,re.I)),
                  'debug_authorize_seen':bool(re.search(r'CMSServlet\.authorize\(',d)),
                  'debug_auth_manager_seen':bool(re.search(r'AuthMgrName: certUserDBAuthMgr',d))}
          pathlib.Path('issued/allowed-agent-diagnostic.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print('ALLOWED AGENT DIAGNOSTIC',json.dumps(result,sort_keys=True))
          PYAUDIT
            fi
            serial="$(python3 - "$label" <<'PYSERIAL'
          import html,pathlib,re,sys
          s=html.unescape(pathlib.Path('approval',sys.argv[1]+'.html').read_text(errors='replace'))
          m=re.search(r'^\s*header\.serialNumber\s*=\s*"([0-9a-fA-F]+)"',s,re.M)
          if not m: raise SystemExit('No issued serial in agent response')
          print(m.group(1))
          PYSERIAL
            )"
            fetch="$(curl -ksS --max-time 30 -o "responses/$label.html" -w '%{http_code}' \
              "https://127.0.0.1:18443/ca/ee/ca/getBySerial?serialNumber=$serial" || true)"
            echo "$label public-serial-fetch HTTP=$fetch bytes=$(wc -c <"responses/$label.html")"
          done </tmp/g09-request-ids.tsv
          python3 - <<'PYSTATUS'
          import html,pathlib,re
          for path in sorted(pathlib.Path('approval').glob('*.html')):
              s=html.unescape(path.read_text(errors='replace'))
              print(path.stem,'approval-markers=',sorted(set(re.findall(r'(?i)\b(?:accepted|approved|complete|pending|unauthorized|error)\b',s))))
          for path in sorted(pathlib.Path('responses').glob('*.html')):
              s=html.unescape(path.read_text(errors='replace'))
              print(path.stem,'fetch-markers=',sorted(set(re.findall(r'(?i)\b(?:issued|complete|pending|error|base64Cert)\b',s))))
          PYSTATUS
          python3 - <<'PYERROR'
          import html,pathlib,re
          for name in ('approval/allowed-cep.html','responses/allowed-cep.html'):
              s=html.unescape(pathlib.Path(name).read_text(errors='replace'))
              s=re.sub(r'(?i)(password|token|secret)\s*[:=]\s*[^\s,;]+',r'\1=[redacted]',s)
              s=re.sub(r'[A-Za-z0-9+/=]{80,}','[long-value-redacted]',s)
              print(name,'bounded-tail=',repr(s[-1700:]))
          PYERROR
          python3 - <<'PYFIELDS'
          import html,pathlib,re
          s=html.unescape(pathlib.Path('approval/allowed-cep.html').read_text(errors='replace'))
          start=s.find('</head>')
          end=s.find('<BODY',start)
          if start>=0 and end>start:
              fragment=s[start+len('</head>'):end]
              fragment=re.sub(r'\b[0-9]{12,}\b','[request-id]',fragment)
              fragment=re.sub(r'[A-Za-z0-9+/=]{80,}','[long-value-redacted]',fragment)
              print('AGENT TEMPLATE DATA',repr(fragment[:1400]))
          for line in s.splitlines():
              if re.search(r'(?i)^\s*(?:header|fixed)\.(?:status|requestStatus|error|errors|unexpectedError|toDo|seqNum|assignedTo|callerName|serialNumber|authorityName)\s*=',line):
                  line=re.sub(r'[A-Za-z0-9+/=]{80,}','[long-value-redacted]',line)
                  line=re.sub(r'(?i)(password|token|secret)\s*[:=]\s*[^\s,;]+',r'\1=[redacted]',line)
                  print('AGENT FIELD',line[:420])
          PYFIELDS
          docker exec ca-g09l012 sh -c "grep -h -i -E 'processCertReq|GetCertFromRequest|template.*not found|not find template|resource not found|invalid request id|authz.*denied|certificate request.*approved' /logs/ca/debug* /logs/pki/debug* 2>/dev/null | tail -n 35" \
            | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' || true

      - name: Record redacted error class and CA diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PYDIAG'
          import html,pathlib,re
          for path in sorted(pathlib.Path('responses').glob('*.html')):
              s=html.unescape(path.read_text(errors='replace'))
              lines=[line for line in s.splitlines() if 'errorDetails' in line or 'errorDescription' in line]
              safe=[]
              for line in lines[:4]:
                  line=re.sub(r'[A-Za-z0-9+/=]{80,}','[long-value-redacted]',line)
                  line=re.sub(r'(?i)(password|token|secret)\s*[:=]\s*[^\s,;]+',r'\1=[redacted]',line)
                  safe.append(line[:350])
              print(path.stem,'error-fields:',safe)
              short=re.sub(r'[A-Za-z0-9+/=]{80,}','[long-value-redacted]',s)
              short=re.sub(r'(?i)(password|token|secret)\s*[:=]\s*[^\s,;]+',r'\1=[redacted]',short)
              print(path.stem,'response:',short[:650])
          PYDIAG
          docker exec ca-g09l012 sh -c "grep -h -E 'CertificateAuthority:|CAMissing|SigningUnit:|CASigningUnit|CMSCORE_CA_SIGNING|not.*present|cert.*not found|key.*not found' /var/lib/pki/pki-tomcat/logs/ca/debug* 2>/dev/null | head -n 110" \
            | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' || true
          docker logs --tail 650 ca-g09l012 2>&1 \
            | sed "s/$DS_PASSWORD/[masked]/g" \
            | grep -Ei 'CertificateAuthority:|CAMissing|SigningUnit:|CASigningUnit|signing key|signing cert|private key|not.*present|cert.*not found|key.*not found' \
            | sed -E 's/[A-Za-z0-9+\/=]{80,}/[long-value-redacted]/g' \
            | head -n 90 || true

      - name: Extract auto-issued DER without logging CSR or key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issued
          python3 - <<'PYEXTRACT'
          import html,json,pathlib,re,subprocess,hashlib
          rows={}
          for path in sorted(pathlib.Path('responses').glob('*.html')):
              s=html.unescape(path.read_text(errors='replace'))
              normalized=s.replace('\\n','\n').replace('\\r','\r').replace('\\/','/')
              matches=re.findall(r'-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----',normalized)
              row={'response_bytes':path.stat().st_size,'complete':bool(matches),'pem_count':len(matches)}
              for i,pem in enumerate(matches):
                  label=f'{path.stem}-{i}'
                  target=pathlib.Path('issued')/f'{label}.pem'
                  target.write_text(pem+'\n')
                  der=pathlib.Path('issued')/f'{label}.der'
                  subprocess.run(['openssl','x509','-in',str(target),'-outform','DER','-out',str(der)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  row.setdefault('der_sha256',[]).append(hashlib.sha256(der.read_bytes()).hexdigest())
                  output=subprocess.run(['openssl','x509','-in',str(target),'-noout','-text'],check=True,capture_output=True,text=True).stdout
                  row.setdefault('san_extension_count',[]).append(output.count('X509v3 Subject Alternative Name:'))
                  san_lines=[line.strip() for line in output.splitlines() if 'DNS:' in line]
                  row.setdefault('san_lines',[]).append(san_lines)
                  asn1=subprocess.run(['openssl','asn1parse','-inform','DER','-in',str(der)],check=True,capture_output=True,text=True).stdout
                  row.setdefault('san_oid_count',[]).append(asn1.count('X509v3 Subject Alternative Name'))
              rows[path.stem]=row
          pathlib.Path('issued/summary.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          for label,row in rows.items(): print(label,row)
          for label,row in rows.items():
              if row['pem_count'] != 1: continue
              pem=pathlib.Path('issued')/(label+'-0.pem')
              csr_label={'duplicate-cep':'duplicate-first','duplicate-client':'duplicate-first','reversed-cep':'duplicate-reversed','allowed-cep':'allowed-single','forbidden-cep':'forbidden-single'}[label]
              csr=pathlib.Path('private')/(csr_label+'.pem')
              def run(*args):
                  return subprocess.run(args,check=True,capture_output=True).stdout
              cert_key=run('openssl','x509','-in',str(pem),'-pubkey','-noout')
              csr_key=run('openssl','req','-in',str(csr),'-pubkey','-noout')
              row['csr_spki_match']=cert_key==csr_key
              verify=subprocess.run(['openssl','verify','-CAfile','issued/dogtag-ca-original.pem',str(pem)],capture_output=True,text=True)
              row['ca_signature_valid']=verify.returncode==0
              print(label,'csr_spki_match=',row['csr_spki_match'],'ca_signature_valid=',row['ca_signature_valid'])
              print(label,'SAN lines:',[line.strip() for line in run('openssl','x509','-in',str(pem),'-noout','-text').decode().splitlines() if 'Subject Alternative Name' in line or 'DNS:' in line])
          pathlib.Path('issued/summary.json').write_text(json.dumps(rows,indent=2,sort_keys=True))
          if not all(row['complete'] and row['pem_count']==1 and row.get('csr_spki_match') for row in rows.values()):
              raise SystemExit('One or more controls did not yield exactly one issued certificate')
          PYEXTRACT

      - name: Discover issued leaf through unauthenticated applicant search
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDISCOVER'
          import hashlib,html,json,pathlib,re,ssl,urllib.parse,urllib.request,xml.etree.ElementTree as ET
          ctx=ssl._create_unverified_context()  # isolated throwaway CA, no public trust
          base='https://127.0.0.1:18443/ca/ee/ca/'
          query=urllib.parse.urlencode({'xml':'true','subjectInUse':'on','commonName':'allowed.test','match':'exact','maxResults':'20'})
          with urllib.request.urlopen(base+'srchCerts?'+query,context=ctx,timeout=30) as response:
              status=response.status
              body=response.read()
          root=ET.fromstring(body)
          serials=[(item.findtext('serialNumber') or '').strip() for item in root.findall('.//records/record')]
          if not serials or len(serials)>20 or any(not re.fullmatch(r'[0-9a-fA-F]+',s) for s in serials):
              raise SystemExit('Public applicant search did not return a bounded serial list')
          found=[]
          for serial in serials:
              url=base+'getBySerial?'+urllib.parse.urlencode({'serialNumber':serial})
              with urllib.request.urlopen(url,context=ctx,timeout=30) as response:
                  fetch_status=response.status
                  page=html.unescape(response.read().decode(errors='replace'))
              page=page.replace('\\n','\n').replace('\\r','\r').replace('\\/','/')
              pems=re.findall(r'-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----',page)
              for pem in pems:
                  der=ssl.PEM_cert_to_DER_cert(pem)
                  found.append({'serial':serial,'fetch_status':fetch_status,'der_sha256':hashlib.sha256(der).hexdigest()})
          expected={p.stem.rsplit('-',1)[0]:hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('issued').glob('*-0.der')}
          found_hashes={row['der_sha256'] for row in found}
          matched=sorted(label for label,digest in expected.items() if digest in found_hashes)
          result={'search_http':status,'record_count':len(serials),'fetch_count':len(found),'matched_labels':matched,'all_five_matched':len(matched)==5,'found':found}
          pathlib.Path('issued/public-discovery.json').write_text(json.dumps(result,indent=2,sort_keys=True))
          print('PUBLIC APPLICANT DISCOVERY',json.dumps({'search_http':status,'record_count':len(serials),'fetch_count':len(found),'matched_labels':matched,'all_five_matched':len(matched)==5},sort_keys=True))
          if not result['all_five_matched']:
              raise SystemExit('Public applicant discovery did not recover all exact issued leaves')
          PYDISCOVER

