name: Hunter 02d94105 SMTP pickup preflight
run-name: Hunter 02d94105 Windows SMTP pickup preflight
on:
  push:
    branches:
      - hunter-02d94105-l042-pickup
  workflow_dispatch:
permissions: {}
jobs:
  smtp-preflight:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Inspect and install Windows SMTP Server feature
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output ('OS=' + [Environment]::OSVersion.VersionString)
          Write-Output ('Identity=' + [Security.Principal.WindowsIdentity]::GetCurrent().Name)
          $feature = Get-WindowsFeature -Name SMTP-Server
          if ($null -eq $feature) { throw 'SMTP-Server feature absent' }
          Write-Output ('FeatureBefore=' + $feature.InstallState)
          if (-not $feature.Installed) {
            $result = Install-WindowsFeature -Name SMTP-Server -IncludeManagementTools
            Write-Output ('InstallSuccess=' + $result.Success)
            Write-Output ('RestartNeeded=' + $result.RestartNeeded)
          }
          $feature = Get-WindowsFeature -Name SMTP-Server
          Write-Output ('FeatureAfter=' + $feature.InstallState)
          Get-Service -Name SMTPSVC,IISADMIN -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-Table -AutoSize
          Write-Output ('DefaultPickupExists=' + (Test-Path 'C:/inetpub/mailroot/Pickup'))
          if (-not $feature.Installed) { throw 'SMTP-Server feature not installed' }
      - name: Exercise local Pickup with ordinary folded Bcc
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-NetFirewallRule -DisplayName hunter-02d94105-block-smtp-egress -Direction Outbound -Action Block -Protocol TCP -RemotePort 25 | Out-Null
          $root = 'C:/inetpub/mailroot'
          $domain = $env:COMPUTERNAME.ToLowerInvariant()
          $from = "sender@$domain"
          $victim = "victim@$domain"
          $observer = "observer@$domain"
          $baseline = @("From: $from", "To: $victim", "Subject: ordinary baseline", "", "BASELINE-SENTINEL") -join "`r`n"
          $bcc = @("From: $from", "To: $victim", "Bcc:", " $observer", "Subject: folded Bcc control", "", "BCC-SENTINEL") -join "`r`n"
          [IO.File]::WriteAllText((Join-Path $root 'Pickup/baseline.eml'), $baseline, [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText((Join-Path $root 'Pickup/bcc.eml'), $bcc, [Text.Encoding]::ASCII)
          Start-Sleep -Seconds 20
          foreach ($folder in @('Pickup','Queue','Drop','Badmail')) {
            $path = Join-Path $root $folder
            $files = @(Get-ChildItem $path -File -ErrorAction SilentlyContinue)
            Write-Output ("Folder=$folder Count=" + $files.Count)
            foreach ($file in $files) {
              Write-Output ("File=" + $file.Name)
              Write-Output (Get-Content -Raw $file.FullName)
            }
          }


      - name: Check redundant recipient headers in local Pickup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:/inetpub/mailroot'
          $domain = $env:COMPUTERNAME.ToLowerInvariant()
          $from = "sender@$domain"
          $victim = "victim@$domain"
          $observer = "observer@$domain"
          $mail = @(
            "X-Sender: $from",
            "X-Receiver: $victim",
            "Bcc:",
            " $observer",
            "X-Lab: ordinary",
            "MIME-Version: 1.0",
            "From: $from",
            "To: $victim",
            "Bcc:",
            " $observer",
            "Subject: redundant recipient control",
            "Content-Type: text/plain; charset=us-ascii",
            "",
            "MULTI-SENTINEL"
          ) -join "`r`n"
          [IO.File]::WriteAllText((Join-Path $root 'Pickup/multi.eml'), $mail, [Text.Encoding]::ASCII)
          Start-Sleep -Seconds 20
          foreach ($folder in @('Pickup','Queue','Drop','Badmail')) {
            $path = Join-Path $root $folder
            $files = @(Get-ChildItem $path -File -ErrorAction SilentlyContinue)
            Write-Output ("Folder=$folder Count=" + $files.Count)
            foreach ($file in $files) {
              if ((Get-Content -Raw $file.FullName) -match 'MULTI-SENTINEL') {
                Write-Output ("MultiFile=" + $file.Name)
                Write-Output (Get-Content -Raw $file.FullName)
              }
            }
          }
