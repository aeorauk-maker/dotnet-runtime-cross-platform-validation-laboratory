name: Hunter 02d94105 SMTP pickup preflight
run-name: Hunter 02d94105 Windows SMTP pickup preflight
on:
  push:
    branches:
      - hunter-02d94105-l042-pickup
  workflow_dispatch:
permissions: {}
jobs:
  smtp-preflight:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Inspect and install Windows SMTP Server feature
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output ('OS=' + [Environment]::OSVersion.VersionString)
          Write-Output ('Identity=' + [Security.Principal.WindowsIdentity]::GetCurrent().Name)
          $feature = Get-WindowsFeature -Name SMTP-Server
          if ($null -eq $feature) { throw 'SMTP-Server feature absent' }
          Write-Output ('FeatureBefore=' + $feature.InstallState)
          if (-not $feature.Installed) {
            $result = Install-WindowsFeature -Name SMTP-Server -IncludeManagementTools
            Write-Output ('InstallSuccess=' + $result.Success)
            Write-Output ('RestartNeeded=' + $result.RestartNeeded)
          }
          $feature = Get-WindowsFeature -Name SMTP-Server
          Write-Output ('FeatureAfter=' + $feature.InstallState)
          Get-Service -Name SMTPSVC,IISADMIN -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-Table -AutoSize
          Write-Output ('DefaultPickupExists=' + (Test-Path 'C:/inetpub/mailroot/Pickup'))
          if (-not $feature.Installed) { throw 'SMTP-Server feature not installed' }
      - name: Exercise local Pickup with ordinary folded Bcc
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-NetFirewallRule -DisplayName hunter-02d94105-block-smtp-egress -Direction Outbound -Action Block -Protocol TCP -RemotePort 25 | Out-Null
          $root = 'C:/inetpub/mailroot'
          $domain = $env:COMPUTERNAME.ToLowerInvariant()
          $from = "sender@$domain"
          $victim = "victim@$domain"
          $observer = "observer@$domain"
          $baseline = @("From: $from", "To: $victim", "Subject: ordinary baseline", "", "BASELINE-SENTINEL") -join "`r`n"
          $bcc = @("From: $from", "To: $victim", "Bcc:", " $observer", "Subject: folded Bcc control", "", "BCC-SENTINEL") -join "`r`n"
          [IO.File]::WriteAllText((Join-Path $root 'Pickup/baseline.eml'), $baseline, [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText((Join-Path $root 'Pickup/bcc.eml'), $bcc, [Text.Encoding]::ASCII)
          Start-Sleep -Seconds 20
          foreach ($folder in @('Pickup','Queue','Drop','Badmail')) {
            $path = Join-Path $root $folder
            $files = @(Get-ChildItem $path -File -ErrorAction SilentlyContinue)
            Write-Output ("Folder=$folder Count=" + $files.Count)
            foreach ($file in $files) {
              Write-Output ("File=" + $file.Name)
              Write-Output (Get-Content -Raw $file.FullName)
            }
          }


      - name: Check redundant recipient headers in local Pickup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:/inetpub/mailroot'
          $domain = $env:COMPUTERNAME.ToLowerInvariant()
          $from = "sender@$domain"
          $victim = "victim@$domain"
          $observer = "observer@$domain"
          $mail = @(
            "X-Sender: $from",
            "X-Receiver: $victim",
            "Bcc:",
            " $observer",
            "X-Lab: ordinary",
            "MIME-Version: 1.0",
            "From: $from",
            "To: $victim",
            "Bcc:",
            " $observer",
            "Subject: redundant recipient control",
            "Content-Type: text/plain; charset=us-ascii",
            "",
            "MULTI-SENTINEL"
          ) -join "`r`n"
          [IO.File]::WriteAllText((Join-Path $root 'Pickup/multi.eml'), $mail, [Text.Encoding]::ASCII)
          Start-Sleep -Seconds 20
          foreach ($folder in @('Pickup','Queue','Drop','Badmail')) {
            $path = Join-Path $root $folder
            $files = @(Get-ChildItem $path -File -ErrorAction SilentlyContinue)
            Write-Output ("Folder=$folder Count=" + $files.Count)
            foreach ($file in $files) {
              if ((Get-Content -Raw $file.FullName) -match 'MULTI-SENTINEL') {
                Write-Output ("MultiFile=" + $file.Name)
                Write-Output (Get-Content -Raw $file.FullName)
              }
            }
          }

      - name: Check two ordinary receiver fields in local Pickup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $hostName = $env:COMPUTERNAME.ToLowerInvariant()
          $pickup = 'C:/inetpub/mailroot/Pickup'
          $drop = 'C:/inetpub/mailroot/Drop'
          $badmail = 'C:/inetpub/mailroot/Badmail'
          $lines = @(
            "X-Sender: sender@$hostName",
            "X-Receiver: victim@$hostName",
            "X-Receiver:",
            " observer@$hostName",
            "From: sender@$hostName",
            "To: victim@$hostName",
            'Subject: two ordinary receiver fields',
            'Content-Type: text/plain; charset=us-ascii',
            '',
            'DUAL-SENTINEL'
          )
          $mail = $lines -join "`r`n"
          $path = Join-Path $pickup ('dual-' + [guid]::NewGuid().ToString('N') + '.eml')
          [IO.File]::WriteAllText($path, $mail, [Text.Encoding]::ASCII)
          Start-Sleep -Seconds 12
          foreach ($folder in @($pickup, 'C:/inetpub/mailroot/Queue', $drop, $badmail)) {
            Write-Output ('Folder=' + (Split-Path $folder -Leaf) + ' Count=' + @(Get-ChildItem $folder -File -ErrorAction SilentlyContinue).Count)
          }
          $match = Get-ChildItem $drop -File | Where-Object { (Get-Content $_.FullName -Raw) -like '*DUAL-SENTINEL*' } | Select-Object -First 1
          if ($null -eq $match) { throw 'No Drop file for dual receiver control' }
          Write-Output ('DualFile=' + $match.Name)
          Get-Content $match.FullName | Select-String -Pattern '^(x-receiver|X-Receiver|To|Subject):|^ observer@|DUAL-SENTINEL$' | ForEach-Object { Write-Output $_.Line }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Observe released .NET pickup routing with private inert fixture
        shell: powershell
        env:
          L042_DISPLAY_B64: ${{ secrets.HUNTER_02D94105_L042_DISPLAY_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:L042_DISPLAY_B64)) { throw 'Private fixture absent' }
          $lab = Join-Path $env:RUNNER_TEMP 'hunter-02d94105-l042-dotnet'
          dotnet new console -n L042 -o $lab --framework net10.0 --no-restore | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create .NET 10 lab' }
          $source = @'
          using System.Net.Mail;
          using System.Runtime.InteropServices;
          using System.Security.Cryptography;
          using System.Text;
          var domain = Environment.GetEnvironmentVariable("COMPUTERNAME")!.ToLowerInvariant();
          var encoded = Environment.GetEnvironmentVariable("L042_DISPLAY_B64") ?? throw new Exception("Fixture absent");
          var mode = args[0];
          var name = mode == "mutation" ? Encoding.UTF8.GetString(Convert.FromBase64String(encoded)).Replace("{HOST}", domain) : "Victim Display";
          var output = args[1];
          Directory.CreateDirectory(output);
          var assembly = typeof(MailAddress).Assembly;
          Console.WriteLine("Runtime=" + RuntimeInformation.FrameworkDescription);
          Console.WriteLine("MailAssemblySha=" + Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(assembly.Location))).ToLowerInvariant());
          using var message = new MailMessage();
          message.From = new MailAddress("sender@" + domain);
          message.To.Add(new MailAddress("victim@" + domain, name));
          message.Subject = "Inert local mail";
          message.Body = "INERT-L042-SENTINEL";
          using var client = new SmtpClient { DeliveryMethod = SmtpDeliveryMethod.SpecifiedPickupDirectory, PickupDirectoryLocation = output, DeliveryFormat = SmtpDeliveryFormat.International };
          client.Send(message);
          '@
          [IO.File]::WriteAllText((Join-Path $lab 'Program.cs'), $source, [Text.Encoding]::UTF8)
          $pickup = 'C:/inetpub/mailroot/Pickup'
          $drop = 'C:/inetpub/mailroot/Drop'
          function Invoke-Case([string] $mode) {
            $stage = Join-Path $lab $mode
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            dotnet run --project $lab -- $mode $stage | ForEach-Object { Write-Output $_ }
            if ($LASTEXITCODE -ne 0) { throw ('Generator failed: ' + $mode) }
            $generated = @(Get-ChildItem $stage -Filter '*.eml' -File)
            if ($generated.Count -ne 1) { throw ('Unexpected pickup file count: ' + $mode) }
            $sha = (Get-FileHash $generated[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $before = @(Get-ChildItem $drop -File | ForEach-Object { $_.FullName })
            $destination = Join-Path $pickup ($mode + '-' + [guid]::NewGuid().ToString('N') + '.eml')
            Copy-Item $generated[0].FullName $destination
            Start-Sleep -Seconds 15
            $newFiles = @(Get-ChildItem $drop -File | Where-Object { $before -notcontains $_.FullName })
            Write-Output ('Mode=' + $mode + ' PickupSha=' + $sha + ' DropFiles=' + $newFiles.Count)
            foreach ($file in $newFiles) {
              $raw = Get-Content $file.FullName -Raw
              $receivers = @(Get-Content $file.FullName | Where-Object { $_ -match '^x-receiver:' })
              Write-Output ('ReceiverCount=' + $receivers.Count)
              $receivers | ForEach-Object { Write-Output $_ }
              Write-Output ('SentinelPresent=' + $raw.Contains('INERT-L042-SENTINEL'))
            }
            Write-Output ('PickupCount=' + @(Get-ChildItem $pickup -File).Count)
            Write-Output ('QueueCount=' + @(Get-ChildItem 'C:/inetpub/mailroot/Queue' -File).Count)
            Write-Output ('BadmailCount=' + @(Get-ChildItem 'C:/inetpub/mailroot/Badmail' -File).Count)
          }
          Invoke-Case 'baseline'
          Invoke-Case 'mutation'
