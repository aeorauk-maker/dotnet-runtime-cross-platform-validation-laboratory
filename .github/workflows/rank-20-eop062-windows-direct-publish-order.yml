name: Rank 20 EOP062 Windows direct publish order control

on:
  push:
    branches:
      - rank-20-eop062-windows-20261127
    paths:
      - eop062-roslyn-windows-direct-publish-order.ps1
      - .github/workflows/rank-20-eop062-windows-direct-publish-order.yml

permissions:
  contents: read

jobs:
  windows-direct-publish-order:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Test builder-first and attacker-first Web publish order
        shell: pwsh
        run: .\eop062-roslyn-windows-direct-publish-order.ps1
