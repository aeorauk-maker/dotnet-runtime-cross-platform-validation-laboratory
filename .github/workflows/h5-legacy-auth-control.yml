name: H5 Legacy Auth Control
run-name: H5 Legacy Auth Control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-framework:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Compare supported cookie-handler controls
        shell: pwsh
        env:
          H5_URL_B64: ${{ secrets.H5_44419F3F_URL_B64 }}
          H5_LAB_B64: ${{ secrets.H5_44419F3F_LAB_B64 }}
        run: |
          $lab = Join-Path $env:RUNNER_TEMP 'h5-lab'
          New-Item -ItemType Directory -Path $lab | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'h5-lab.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($env:H5_LAB_B64))
          Expand-Archive -Path $archive -DestinationPath $lab
          dotnet run --project (Join-Path $lab 'cookie23-net48.csproj') -c Release
