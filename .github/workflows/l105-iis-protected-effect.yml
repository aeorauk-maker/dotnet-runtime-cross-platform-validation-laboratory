name: Rank21 L105 IIS natural protected effect
on:
  push:
    branches: [rank-21-l105-prebind-20261127]
    paths:
      - .github/workflows/l105-iis-protected-effect.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Test natural IIS worker interval and lower service prebind
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'Rank21L105IIS'
          $server = Join-Path $root 'rank21server'
          $project = Join-Path $root 'web'
          $published = Join-Path $root 'published'
          $protected = Join-Path $root 'protected'
          $sentinel = Join-Path $protected 'owner-only.txt'
          New-Item -ItemType Directory -Force -Path $root,$server,$project,$published,$protected | Out-Null
          Set-Content -Path $sentinel -Value 'R21-owned-inert-sentinel' -NoNewline
          dotnet --info | Select-Object -First 30
          $feature = Get-WindowsOptionalFeature -Online -FeatureName IIS-URLAuthorization
          if ($feature.State -ne 'Enabled') { Enable-WindowsOptionalFeature -Online -FeatureName IIS-URLAuthorization -All -NoRestart | Out-Null }
          $installer = Join-Path $root 'dotnet-hosting-11.0.0-win.exe'
          Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/11.0.0/dotnet-hosting-11.0.0-win.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Official Hosting Bundle signature invalid' }
          Write-Host "HOSTING_BUNDLE_SHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"
          $install = Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "Hosting Bundle exit $($install.ExitCode)" }
          net stop was /y | Out-Host
          net start w3svc | Out-Host
          $module = Join-Path $env:ProgramFiles 'IIS/Asp.Net Core Module/V2/aspnetcorev2.dll'
          if (-not (Test-Path $module)) { throw 'ANCM module missing' }
          Write-Host "ANCM_SHA256=$((Get-FileHash $module -Algorithm SHA256).Hash)"
          dotnet tool install dotnet-trace --tool-path (Join-Path $root 'tools') --version 10.0.750501
          $tool = Join-Path $root 'tools/dotnet-trace.exe'
          & $tool --version
          dotnet new web -n Rank21Web -f net11.0 -o $project --no-restore | Out-Host
          @'
          var app = WebApplication.Create();
          app.MapGet("/", () => $"PID={Environment.ProcessId}");
          app.Run();
          '@ | Set-Content -Path (Join-Path $project 'Program.cs') -Encoding utf8
          dotnet publish (Join-Path $project 'Rank21Web.csproj') -c Release -o $published | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Web app publish failed' }
          if (-not (Select-String -Path (Join-Path $published 'web.config') -Pattern 'hostingModel="inprocess"' -Quiet)) { throw 'Published app not configured for in-process IIS' }
          $appcmd = Join-Path $env:windir 'System32/inetsrv/appcmd.exe'
          & $appcmd add apppool /name:Rank21Pool | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not add app pool' }
          & $appcmd set apppool Rank21Pool /managedRuntimeVersion:"" /startMode:AlwaysRunning | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure app pool' }
          & $appcmd add site /name:Rank21Site /bindings:http/127.0.0.1:8897: "/physicalPath:$published" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not add site' }
          & $appcmd set app 'Rank21Site/' /applicationPool:Rank21Pool /preloadEnabled:false | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure site app' }
          $siteState = & $appcmd list site Rank21Site /text:state
          if ($siteState -ne 'Started') { & $appcmd start site Rank21Site | Out-Host }
          function Test-Listed([int]$processId) {
            $listing = & $tool ps | Out-String
            if ($LASTEXITCODE -ne 0) { throw 'dotnet-trace ps failed' }
            return [bool]($listing -match "(?m)^\s*$processId\s")
          }
          $normal = Invoke-WebRequest 'http://127.0.0.1:8897/' -UseBasicParsing -TimeoutSec 20
          $normalMatch = [regex]::Match([string]$normal.Content, '^PID=(\d+)$')
          if ($normal.StatusCode -ne 200 -or -not $normalMatch.Success) { throw 'Normal IIS request failed' }
          $normalProcessId = [int]$normalMatch.Groups[1].Value
          $normalListed = Test-Listed $normalProcessId
          Write-Host "NORMAL_WORKER_PID=$normalProcessId NORMAL_LISTED=$normalListed"
          if (-not $normalListed) { throw 'Normal diagnostics endpoint baseline failed' }
          $validTracePath = Join-Path $root 'valid.nettrace'
          $validTrace = Start-Process -FilePath $tool -ArgumentList @('collect','--process-id',$normalProcessId,'--duration','00:00:03','--output',$validTracePath) -Wait -PassThru -RedirectStandardOutput (Join-Path $root 'valid.out') -RedirectStandardError (Join-Path $root 'valid.err')
          $validBytes = if (Test-Path $validTracePath) { (Get-Item $validTracePath).Length } else { 0 }
          Write-Host "VALID_TRACE_EXIT=$($validTrace.ExitCode) VALID_TRACE_BYTES=$validBytes"
          if ($validTrace.ExitCode -ne 0 -or $validBytes -le 0) { throw 'Genuine IIS diagnostics attach failed' }
          & $appcmd stop apppool /apppool.name:Rank21Pool | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not stop normal app pool' }
          for ($i=0; $i -lt 30 -and (Get-Process -Id $normalProcessId -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          if (Get-Process -Id $normalProcessId -ErrorAction SilentlyContinue) { throw 'Normal worker did not stop' }
          & $appcmd start apppool /apppool.name:Rank21Pool | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not start attack app pool' }
          $idleWorker = $null
          for ($i=0; $i -lt 30; $i++) {
            $workers = @(Get-CimInstance Win32_Process -Filter "Name='w3wp.exe'" | Where-Object { $_.CommandLine -like '*Rank21Pool*' })
            if ($workers.Count -eq 1) { $idleWorker = $workers[0]; break }
            Start-Sleep -Milliseconds 500
          }
          if ($null -eq $idleWorker) { throw "No single idle w3wp worker after AlwaysRunning pool start; found=$($workers.Count)" }
          $idleProcessId = [int]$idleWorker.ProcessId
          $modules = @(Get-Process -Id $idleProcessId -Module | ForEach-Object ModuleName)
          $coreclrBefore = $modules -contains 'coreclr.dll'
          $idleListed = Test-Listed $idleProcessId
          Write-Host "IDLE_WORKER_PID=$idleProcessId CORECLR_BEFORE=$coreclrBefore IDLE_LISTED=$idleListed"
          Write-Host "::notice title=R21 IIS idle state::PID=$idleProcessId CORECLR_BEFORE=$coreclrBefore IDLE_LISTED=$idleListed"
          if ($coreclrBefore -or $idleListed) { throw 'IIS worker loaded CLR or diagnostics before first request' }
          $noFake = Start-Process -FilePath $tool -ArgumentList @('collect','--name','w3wp','--duration','00:00:03','--output',(Join-Path $root 'no-fake.nettrace')) -PassThru -RedirectStandardOutput (Join-Path $root 'no-fake.out') -RedirectStandardError (Join-Path $root 'no-fake.err')
          $noFakeCompleted = $noFake.WaitForExit(8000)
          if (-not $noFakeCompleted) { Stop-Process -Id $noFake.Id -Force; if (-not $noFake.WaitForExit(5000)) { throw 'No-fake control failed to stop' } }
          Write-Host "NO_FAKE_NAME_COMPLETED=$noFakeCompleted NO_FAKE_NAME_EXIT=$(if ($noFakeCompleted) { $noFake.ExitCode } else { 'bounded-wait' })"
          if ($noFakeCompleted -and $noFake.ExitCode -eq 0) { throw 'No-fake name attach unexpectedly succeeded' }
          dotnet new console --framework net11.0 --output $server --no-restore
          @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.IO.Pipes;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          using System.Threading;
          
          var trace = new StreamWriter(new FileStream(args[0], FileMode.Create, FileAccess.Write, FileShare.ReadWrite)) { AutoFlush = true };
          Console.SetOut(trace);
          ServiceHost.Run(() =>
          {
              Console.WriteLine($"SERVICE_SID={WindowsIdentity.GetCurrent().User?.Value}");
              try { Console.WriteLine($"DIRECT_MATCH={File.ReadAllText(args[1]) == "R21-owned-inert-sentinel"}"); }
              catch (Exception ex) { Console.WriteLine($"DIRECT_DENIED={ex is UnauthorizedAccessException} TYPE={ex.GetType().Name}"); }
              var found = Process.GetProcessesByName("w3wp");
              Console.WriteLine($"DISCOVERY_COUNT={found.Length}");
              foreach (var p in found) Console.WriteLine($"DISCOVERED_PID={p.Id}");
              if (found.Length != 1) throw new InvalidOperationException("Expected one live target by name");
              using var pipe = new NamedPipeServerStream($"dotnet-diagnostic-{found[0].Id}", PipeDirection.InOut, 1);
              Console.WriteLine($"PIPE_BOUND=True PID={found[0].Id}");
              pipe.WaitForConnection();
              int first = pipe.ReadByte();
              Console.WriteLine($"FIRST_BYTE={first}");
              bool matched = false;
              try
              {
                  pipe.RunAsClient(() =>
                  {
                      Console.WriteLine($"IMPERSONATED_SID={WindowsIdentity.GetCurrent().User?.Value}");
                      Console.WriteLine($"IMPERSONATION_LEVEL={WindowsIdentity.GetCurrent().ImpersonationLevel}");
                      matched = File.ReadAllText(args[1]) == "R21-owned-inert-sentinel";
                  });
                  Console.WriteLine($"PROTECTED_MATCH={matched}");
              }
              catch (Exception ex) { Console.WriteLine($"RUNAS_FAILURE={ex.GetType().Name} HRESULT={ex.HResult}"); }
          });
          
          static class ServiceHost
          {
              private const uint Own = 0x10, StartPending = 2, Running = 4, Stopped = 1;
              private static Action? action;
              private static IntPtr statusHandle;
              private static ServiceMainDelegate? mainDelegate;
              private static ServiceControlDelegate? controlDelegate;
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              private struct ServiceEntry { public string? Name; public ServiceMainDelegate? Main; }
              [StructLayout(LayoutKind.Sequential)]
              private struct ServiceStatus { public uint ServiceType, CurrentState, ControlsAccepted, Win32ExitCode, ServiceSpecificExitCode, CheckPoint, WaitHint; }
              private delegate void ServiceMainDelegate(uint count, IntPtr args);
              private delegate void ServiceControlDelegate(uint control);
              [DllImport("advapi32.dll", EntryPoint = "StartServiceCtrlDispatcherW", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern bool StartServiceCtrlDispatcher(ServiceEntry[] table);
              [DllImport("advapi32.dll", EntryPoint = "RegisterServiceCtrlHandlerW", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern IntPtr RegisterServiceCtrlHandler(string name, ServiceControlDelegate handler);
              [DllImport("advapi32.dll", SetLastError = true)]
              private static extern bool SetServiceStatus(IntPtr handle, ref ServiceStatus status);
              private static void Status(uint state)
              {
                  var value = new ServiceStatus { ServiceType = Own, CurrentState = state };
                  if (!SetServiceStatus(statusHandle, ref value)) Console.WriteLine($"STATUS_ERROR={Marshal.GetLastWin32Error()}");
              }
              private static void Main(uint count, IntPtr args)
              {
                  controlDelegate = _ => {};
                  statusHandle = RegisterServiceCtrlHandler("Rank21L105Service", controlDelegate);
                  if (statusHandle == IntPtr.Zero) { Console.WriteLine($"REGISTER_ERROR={Marshal.GetLastWin32Error()}"); return; }
                  Status(StartPending);
                  Status(Running);
                  Console.WriteLine("SERVICE_RUNNING=True");
                  try { action!(); }
                  catch (Exception ex) { Console.WriteLine($"SERVICE_EXCEPTION={ex.GetType().Name} MESSAGE={ex.Message}"); }
                  finally { Status(Stopped); Console.WriteLine("SERVICE_STOPPED=True"); }
              }
              public static void Run(Action callback)
              {
                  action = callback;
                  mainDelegate = Main;
                  var table = new[] { new ServiceEntry { Name = "Rank21L105Service", Main = mainDelegate }, new ServiceEntry() };
                  if (!StartServiceCtrlDispatcher(table)) Console.WriteLine($"DISPATCH_ERROR={Marshal.GetLastWin32Error()}");
              }
          }
          '@ | Set-Content -Path "$server\Program.cs" -Encoding utf8
          dotnet build $server --configuration Release --verbosity quiet
          icacls $root /grant '*S-1-5-20:(OI)(CI)M' | Out-Null
          icacls $protected /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" 'SYSTEM:(OI)(CI)F' 'Administrators:(OI)(CI)F' | Out-Null
          icacls $sentinel /inheritance:r /grant:r "$($env:USERNAME):R" 'SYSTEM:F' 'Administrators:F' | Out-Null
          $adminIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $adminSid = $adminIdentity.User.Value
          $isAdmin = [System.Security.Principal.WindowsPrincipal]::new($adminIdentity).IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)
          $adminRead = [System.IO.File]::ReadAllText($sentinel) -eq 'R21-owned-inert-sentinel'
          Write-Host "ADMIN_SID=$adminSid ADMIN_ROLE=$isAdmin ADMIN_READ=$adminRead"
          if (-not $isAdmin -or -not $adminRead) { throw 'Elevated administrator baseline failed' }
          $serviceExe = Join-Path $server 'bin/Release/net11.0/rank21server.exe'
          $trace = Join-Path $root 'service.trace'
          $serviceBin = '"' + $serviceExe + '" "' + $trace + '" "' + $sentinel + '"'
          sc.exe create Rank21L105Service binPath= $serviceBin obj= 'NT AUTHORITY\NetworkService' type= own start= demand | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'SCM service create failed' }
          try {
            sc.exe start Rank21L105Service | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'SCM service start failed' }
            $serviceTrace = ''
            for ($i=0; $i -lt 150; $i++) {
              if (Test-Path $trace) {
                $serviceTrace = Get-Content $trace -Raw
                if ($serviceTrace -match 'PIPE_BOUND=True' -or $serviceTrace -match 'SERVICE_EXCEPTION=') { break }
              }
              Start-Sleep -Milliseconds 100
            }
            Write-Host "SERVICE_TRACE=$($serviceTrace.Replace("`r"," ").Replace("`n"," | "))"
            $serviceSidOk = $serviceTrace -match 'SERVICE_SID=S-1-5-20'
            $bound = $serviceTrace -match 'PIPE_BOUND=True' -and $serviceTrace -match "PID=$idleProcessId"
            Write-Host "SERVICE_SID_OK=$serviceSidOk AUTONOMOUS_BOUND=$bound"
            $directDenied = $serviceTrace -match 'DIRECT_DENIED=True'
            Write-Host "DIRECT_DENIED=$directDenied"
            if (-not $serviceSidOk -or -not $bound -or -not $directDenied) { throw 'NetworkService did not independently bind or deny direct read' }
            $first = Invoke-WebRequest 'http://127.0.0.1:8897/' -UseBasicParsing -TimeoutSec 30
            $sameWorker = $first.StatusCode -eq 200 -and $first.Content -eq "PID=$idleProcessId"
            $workerAlive = [bool](Get-Process -Id $idleProcessId -ErrorAction SilentlyContinue)
            $listedWhileBound = Test-Listed $idleProcessId
            Write-Host "FIRST_REQUEST_SAME_WORKER=$sameWorker WORKER_ALIVE=$workerAlive PS_WHILE_BOUND=$listedWhileBound"
            if (-not $sameWorker -or -not $workerAlive -or -not $listedWhileBound) { throw 'First request or fake pipe listing failed' }
            $namedTrace = Start-Process -FilePath $tool -ArgumentList @('collect','--name','w3wp','--duration','00:00:03','--output',(Join-Path $root 'named.nettrace')) -PassThru -RedirectStandardOutput (Join-Path $root 'named.out') -RedirectStandardError (Join-Path $root 'named.err')
            $nameCompleted = $namedTrace.WaitForExit(15000)
            if (-not $nameCompleted) { Stop-Process -Id $namedTrace.Id -Force }
            Write-Host "NAME_COLLECT_COMPLETED=$nameCompleted NAME_COLLECT_EXIT=$(if ($nameCompleted) { $namedTrace.ExitCode } else { 'bounded-wait' })"
            $stopped = $false
            for ($i=0; $i -lt 100; $i++) {
              if ((Test-Path $trace) -and ((Get-Content $trace -Raw) -match 'SERVICE_STOPPED=True')) { $stopped=$true; break }
              Start-Sleep -Milliseconds 100
            }
            $finalTrace = Get-Content $trace -Raw
            $firstByteOk = $finalTrace -match 'FIRST_BYTE=68'
            $impersonatedSidOk = $finalTrace -match ([regex]::Escape("IMPERSONATED_SID=$adminSid"))
            $levelOk = $finalTrace -match 'IMPERSONATION_LEVEL=Impersonation'
            $protectedMatch = $finalTrace -match 'PROTECTED_MATCH=True'
            Write-Host "FIRST_BYTE_OK=$firstByteOk IMPERSONATED_ADMIN_SID=$impersonatedSidOk IMPERSONATION_LEVEL_OK=$levelOk PROTECTED_MATCH=$protectedMatch"
            Start-Sleep -Seconds 2
            $aliveAfter = [bool](Get-Process -Id $idleProcessId -ErrorAction SilentlyContinue)
            $listedAfter = Test-Listed $idleProcessId
            Write-Host "SERVICE_STOPPED=$stopped WORKER_ALIVE_AFTER=$aliveAfter PS_AFTER_RELEASE=$listedAfter"
            Write-Host "::notice title=R21 IIS effect::SAME_WORKER=$sameWorker LISTED_BOUND=$listedWhileBound ALIVE_AFTER=$aliveAfter LISTED_AFTER=$listedAfter"
            if (-not $stopped -or -not $firstByteOk -or -not $impersonatedSidOk -or -not $levelOk -or -not $protectedMatch -or -not $aliveAfter -or $listedAfter) { throw 'Natural IIS protected effect or release control failed' }
            Write-Host 'R21_IIS_NATURAL_PROTECTED_EFFECT_ALL_ASSERTIONS_PASSED=True'
          } finally {
            sc.exe delete Rank21L105Service | Out-Host
          }
