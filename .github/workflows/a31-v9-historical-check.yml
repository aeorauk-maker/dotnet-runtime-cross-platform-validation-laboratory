name: G09-L016 macOS v9 historical check
on:
  push:
    branches: [pa30-rank10-g09l016-v9lineage-20261128-j2]
jobs:
  historical:
    if: github.event.head_commit.message == 'Run G09 v9 historical comparison'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.308
      - name: Replay exact issued leaf against released v9 SslStream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile, zipfile
          expected='1589383828348e4fb2f7152b627d74c1148adb74e7b01debd717ce0c2960a319'
          archive=pathlib.Path('MSRC_G09-L016_PoC.zip')
          raw=archive.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==expected
          print('A31_ZIP_SHA256='+expected)
          print('A31_SDK='+subprocess.check_output(['dotnet','--version'],text=True).strip())
          print('A31_RUNTIMES='+repr([x for x in subprocess.check_output(['dotnet','--list-runtimes'],text=True).splitlines() if '9.0.11' in x]))
          with tempfile.TemporaryDirectory(prefix='g09-v9-historical-') as tmp:
              root=pathlib.Path(tmp)
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  z.extractall(root)
              harness=root/'a31_policy_transparent.py'
              script=harness.read_text()
              assert "<TargetFramework>net11.0</TargetFramework>" in script
              assert "assert process.returncode == 0" in script
              script=script.replace('net11.0','net9.0').replace('11.0.0','9.0.11')
              old='        assert process.returncode == 0'
              new='''        safe = {"exit": process.returncode, "steps": [r.get("step") for r in rows],
                "auth_baselines": [{k: r.get(k) for k in ("no_cookie_status", "no_owner_proof_status", "valid_status", "writes")} for r in rows if r.get("step") == "auth_baselines"],
                "intercepts": [{"certificate": r.get("certificate"), "victim_status": r.get("victim_status"), "captured_cookie": bool(r.get("captured_cookie")), "writes": r.get("writes")} for r in rows if r.get("step") == "intercept"],
                "raw_log_sha256": hashlib.sha256(raw.read_bytes()).hexdigest()}
                  print("A31_V9_SAFE_RESULT=" + json.dumps(safe, sort_keys=True), flush=True)
                  raise SystemExit(0)'''
              assert script.count(old)==1
              harness.write_text(script.replace(old,new))
              result=subprocess.run(['python3',str(harness)],cwd=root,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=180)
              print(result.stdout)
              if result.returncode:
                  print('A31_V9_HARNESS_EXIT='+str(result.returncode))
                  print('A31_V9_STDERR_SHA256='+hashlib.sha256(result.stderr.encode()).hexdigest())
                  print('A31_V9_SAFE_ERROR='+repr([x for x in result.stderr.splitlines() if any(y in x for y in ('RuntimeError','AssertionError','TimeoutExpired'))][-4:]))
                  raise SystemExit(1)
              assert 'A31_V9_SAFE_RESULT=' in result.stdout
              line=[x for x in result.stdout.splitlines() if x.startswith('A31_V9_SAFE_RESULT=')][0]
              proof=json.loads(line.split('=',1)[1])
              assert proof['exit'] == 1, 'v9 app should return the failed attack verdict'
              attacks=[x for x in proof['intercepts'] if x['certificate']=='attack_no_san_forbidden_cn']
              assert len(attacks)==2
              assert all(x['victim_status']==0 and not x['captured_cookie'] and x['writes']==1 for x in attacks)
              assert all(x['victim_status']==0 and not x['captured_cookie'] for x in proof['intercepts'])
              assert subprocess.run(['security','find-certificate','-c','A31 owned root','/Library/Keychains/System.keychain'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode != 0
              print('A31_RELEASED_V9_NATIVE_HOSTNAME_DENIAL_PASS')
          PY
