name: G09-L016 strict issuer autoapproval differential and cookie authorization
on:
  push:
    branches: [pa30-rank10-g09l016-strict-auto-20261128-g7]
  workflow_dispatch:
jobs:
  issuer:
    strategy:
      fail-fast: false
      matrix:
        autoapproval: ['true', 'false']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      AUTOAPPROVAL: ${{ matrix.autoapproval }}
    steps:
      - uses: helm/kind-action@v1.15.2
      - name: Prove scoped actor issuance in owned cluster
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          lab_dir="${RUNNER_TEMP}/a31-request-only"
          mkdir -p "$lab_dir"
          cd "$lab_dir"
          
          helm version --short
          kubectl version --client
          disable_auto=true
          if [ "$AUTOAPPROVAL" = true ]; then disable_auto=false; fi
          helm install cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --version v1.21.1 --namespace cert-manager --create-namespace \
            --set crds.enabled=true --set disableAutoApproval="$disable_auto" --wait --timeout 6m
          echo "A31_DEFAULT_AUTOAPPROVAL_${AUTOAPPROVAL}"
          
          helm install a31-approver oci://quay.io/jetstack/charts/cert-manager-approver-policy \
            --version v0.27.0 --namespace cert-manager --wait --timeout 6m
          openssl ecparam -name prime256v1 -genkey -noout -out root.key
          openssl req -x509 -new -sha256 -key root.key -subj '/CN=A31 owned root' \
            -days 2 -out root.pem \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl ecparam -name prime256v1 -genkey -noout -out issuer.key
          openssl req -new -sha256 -key issuer.key -subj '/CN=A31 constrained issuer' -out issuer.csr
          cat > issuer.ext <<'EOF'
          basicConstraints=critical,CA:TRUE,pathlen:0
          keyUsage=critical,keyCertSign,cRLSign
          nameConstraints=critical,permitted;DNS:allowed.test
          EOF
          openssl x509 -req -sha256 -in issuer.csr -CA root.pem -CAkey root.key \
            -CAcreateserial -days 2 -out issuer.pem -extfile issuer.ext
          openssl verify -CAfile root.pem issuer.pem
          cat issuer.pem root.pem > issuer-chain.pem
          
          kubectl -n cert-manager create secret tls a31-ca-key \
            --cert=issuer-chain.pem --key=issuer.key
          cat > clusterissuer.yaml <<'EOF'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: a31-constrained
          spec:
            ca:
              secretName: a31-ca-key
          EOF
          kubectl apply -f clusterissuer.yaml
          kubectl wait --for=condition=Ready clusterissuer/a31-constrained --timeout=180s
          
          kubectl create namespace a31-tenant
          kubectl -n a31-tenant create serviceaccount actor
          cat > actor-cr-only.yaml <<'EOF'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: a31-cr-only
            namespace: a31-tenant
          rules:
            - apiGroups: [cert-manager.io]
              resources: [certificaterequests]
              verbs: [create, get]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: a31-cr-only
            namespace: a31-tenant
          subjects:
            - kind: ServiceAccount
              name: actor
              namespace: a31-tenant
          roleRef:
            kind: Role
            name: a31-cr-only
            apiGroup: rbac.authorization.k8s.io
          EOF
          kubectl apply -f actor-cr-only.yaml
          cat > policy.yaml <<'EOF'
          apiVersion: policy.cert-manager.io/v1alpha1
          kind: CertificateRequestPolicy
          metadata:
            name: a31-split-name-policy
          spec:
            selector:
              namespace:
                matchNames: [a31-tenant]
              issuerRef:
                name: a31-constrained
                kind: ClusterIssuer
                group: cert-manager.io
            allowed:
              commonName:
                value: "allowed.test"
              dnsNames:
                values: [allowed.test]
              isCA: false
              usages: [digital signature, server auth]
          EOF
          for attempt in $(seq 1 12); do
            if kubectl apply -f policy.yaml; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo 'A31_POLICY_WEBHOOK_NOT_READY'
              exit 1
            fi
            sleep 2
          done
          kubectl wait --for=condition=Ready \
            certificaterequestpolicy/a31-split-name-policy --timeout=180s
          cat > policy-use.yaml <<'EOF'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: a31-policy-use
            namespace: a31-tenant
          rules:
            - apiGroups: [policy.cert-manager.io]
              resources: [certificaterequestpolicies]
              resourceNames: [a31-split-name-policy]
              verbs: [use]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: a31-policy-use
            namespace: a31-tenant
          subjects:
            - kind: ServiceAccount
              name: actor
              namespace: a31-tenant
          roleRef:
            kind: Role
            name: a31-policy-use
            apiGroup: rbac.authorization.k8s.io
          EOF
          kubectl apply -f policy-use.yaml
          actor_token="$(kubectl -n a31-tenant create token actor --duration=15m)"
          test -n "$actor_token"
          actor_kubectl() { local ca_file="$PWD/actor-ca.pem"; kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > "$ca_file"; kubectl --kubeconfig=/dev/null --server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" --certificate-authority="$ca_file" --token="$actor_token" "$@"; }
          actor_identity="$(actor_kubectl auth whoami -o jsonpath='{.status.userInfo.username}')"; echo "A31_ACTOR_IDENTITY=$actor_identity"; test "$actor_identity" = 'system:serviceaccount:a31-tenant:actor'
          test "$(actor_kubectl auth can-i create certificaterequests.cert-manager.io -n a31-tenant)" = yes
          test "$(actor_kubectl auth can-i get certificaterequests.cert-manager.io -n a31-tenant)" = yes
          test "$(actor_kubectl auth can-i get secret/a31-ca-key -n cert-manager)" = no
          test "$(actor_kubectl auth can-i create certificaterequestpolicies.policy.cert-manager.io)" = no
          test "$(actor_kubectl auth can-i use certificaterequestpolicies.policy.cert-manager.io/a31-split-name-policy -n a31-tenant)" = yes
          if actor_kubectl -n cert-manager get secret a31-ca-key -o name >/dev/null 2>&1; then
            echo 'A31_UNEXPECTED_CA_SECRET_ACCESS'
            exit 1
          fi
          echo 'A31_ACTUAL_SERVICEACCOUNT_TOKEN_SCOPED'

          openssl ecparam -name prime256v1 -genkey -noout -out actor-leaf.key
          make_request() {
            label="$1"
            cn="$2"
            san="$3"
            expect="$4"
            if [ -n "$san" ]; then
              openssl req -new -sha256 -key actor-leaf.key -subj "/CN=$cn" \
                -addext "subjectAltName=DNS:$san" -out "$label.csr"
            else
              openssl req -new -sha256 -key actor-leaf.key -subj "/CN=$cn" -out "$label.csr"
            fi
            csr_b64="$(base64 -w0 < "$label.csr")"
            cat > "$label-request.yaml" <<EOF
          apiVersion: cert-manager.io/v1
          kind: CertificateRequest
          metadata:
            name: a31-$label
            namespace: a31-tenant
          spec:
            request: $csr_b64
            issuerRef:
              group: cert-manager.io
              kind: ClusterIssuer
              name: a31-constrained
            usages:
              - digital signature
              - server auth
          EOF
            actor_kubectl -n a31-tenant create -f "$label-request.yaml"; if [ "$expect" = CreatedOnly ]; then return 0; fi
            if [ "$expect" = Denied ]; then
              kubectl -n a31-tenant wait --for=condition=Denied \
                "certificaterequest/a31-$label" --timeout=180s
              test -z "$(kubectl -n a31-tenant get certificaterequest "a31-$label" \
                -o jsonpath='{.status.certificate}')"
              echo "A31_POLICY_DENIED_${label}"
            else
              kubectl -n a31-tenant wait --for=condition=Approved \
                "certificaterequest/a31-$label" --timeout=180s
              kubectl -n a31-tenant wait --for=condition=Ready \
                "certificaterequest/a31-$label" --timeout=180s
              actor_kubectl -n a31-tenant get certificaterequest "a31-$label" \
                -o jsonpath='{.status.certificate}' | base64 -d > "$label-issued.pem"
              test -s "$label-issued.pem"
              openssl x509 -in "$label-issued.pem" -noout -subject -fingerprint -sha256
              echo "A31_POLICY_ISSUED_${label}"
            fi
          }

          make_request allowed allowed.test allowed.test Approved
          if [ "$AUTOAPPROVAL" = true ]; then
            for n in $(seq 1 24); do make_request "attack-$n" forbidden.test '' CreatedOnly; done
            for poll in $(seq 1 12); do
              for n in $(seq 1 24); do
                cert_b64="$(actor_kubectl -n a31-tenant get certificaterequest "a31-attack-$n" -o jsonpath='{.status.certificate}')"
                if [ -n "$cert_b64" ]; then
                  printf '%s' "$cert_b64" | base64 -d > attack-issued.pem
                  echo "A31_AUTO_APPROVED_ATTACK_INDEX=$n"
                  break 2
                fi
              done
              sleep 1
            done
            test -s attack-issued.pem
            openssl x509 -in attack-issued.pem -noout -subject -fingerprint -sha256
            echo 'A31_POLICY_ISSUED_attack'
            openssl req -new -sha256 -key actor-leaf.key -subj '/CN=forbidden.test' -addext 'subjectAltName=DNS:forbidden.test' -out denied.csr; openssl x509 -req -sha256 -in denied.csr -CA issuer.pem -CAkey issuer.key -CAcreateserial -days 2 -out denied-issued.pem -extfile <(echo 'basicConstraints=critical,CA:FALSE'; echo 'keyUsage=critical,digitalSignature'; echo 'extendedKeyUsage=serverAuth'; echo 'subjectAltName=DNS:forbidden.test'); echo 'A31_ADMIN_SIGNED_FORBIDDEN_SAN_TLS_NEGATIVE'

          else
            make_request attack forbidden.test '' Denied
            make_request denied forbidden.test forbidden.test Denied
            echo 'A31_STRICT_POLICY_DEFAULT_APPROVER_OFF_DENIAL_PASS'
          fi

          openssl verify -CAfile root.pem -untrusted issuer.pem allowed-issued.pem
          if [ "$AUTOAPPROVAL" = true ]; then
          if openssl verify -CAfile root.pem -untrusted issuer.pem attack-issued.pem; then
            echo 'A31_LINUX_OPENSSL_ATTACK_CHAIN_ACCEPTED'
          else
            echo 'A31_LINUX_OPENSSL_ATTACK_CHAIN_DENIED'
          fi
          if openssl verify -CAfile root.pem -untrusted issuer.pem denied-issued.pem; then
            echo 'A31_UNEXPECTED_FORBIDDEN_SAN_CHAIN_VALID'
            exit 1
          fi
          echo 'A31_LINUX_OPENSSL_FORBIDDEN_SAN_CHAIN_DENIED'
          if openssl x509 -in attack-issued.pem -noout -text | grep -q 'X509v3 Subject Alternative Name'; then
            echo 'A31_UNEXPECTED_ATTACK_SAN'
            exit 1
          fi
          openssl x509 -in denied-issued.pem -noout -text | grep -q 'DNS:forbidden.test'
          openssl ecparam -name prime256v1 -genkey -noout -out direct-root.key
          openssl req -new -sha256 -key direct-root.key -subj '/CN=forbidden.test' \
            -addext 'subjectAltName=DNS:forbidden.test' -out direct-root.csr
          cat > direct-root.ext <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:forbidden.test
          EOF
          openssl x509 -req -sha256 -in direct-root.csr -CA root.pem -CAkey root.key \
            -CAcreateserial -days 2 -out direct-root.cert.pem -extfile direct-root.ext
          openssl verify -CAfile root.pem direct-root.cert.pem
          mkdir -p "${RUNNER_TEMP}/a31-public-fixture"
          cp root.pem issuer.pem actor-leaf.key allowed-issued.pem attack-issued.pem denied-issued.pem \
            direct-root.cert.pem direct-root.key "${RUNNER_TEMP}/a31-public-fixture/"
          fi
          echo "A31_STRICT_AUTO_${AUTOAPPROVAL}_ISSUER_MATRIX_PASS"
      - name: Export short-lived owned test fixture
        if: matrix.autoapproval == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a31-policy-test-fixture
          path: ${{ runner.temp }}/a31-public-fixture/
          retention-days: 1
  exact_transparent:
    needs: issuer
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100
      - uses: actions/download-artifact@v4
        with:
          name: a31-policy-test-fixture
          path: fixture
      - name: Prove stock client through transparent owned route
        shell: bash
        run: python3 a31_policy_transparent.py
