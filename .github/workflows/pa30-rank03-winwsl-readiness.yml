name: Rank03 Windows WSL Samba readiness
on:
  push:
    branches: [pa30-rank03-winwsl-20261128]
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - name: Install official Ubuntu WSL distro
        timeout-minutes: 7
        shell: pwsh
        run: |
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch --web-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec sh -lc 'printf "WSL_BOOTED=1\n"; uname -r; id -u'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and provision disposable Samba domain
        shell: pwsh
        run: |
          $install = 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq >/tmp/rank03-apt-update.log 2>&1 && apt-get install -y -qq samba-ad-dc winbind krb5-user dnsutils tcpdump >/tmp/rank03-apt-install.log 2>&1; rc=$?; echo "APT_EXIT=$rc"; test $rc -eq 0; command -v samba-tool'
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc $install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $provision = 'set -eu; rm -f /etc/samba/smb.conf; pass="Aa1!$(openssl rand -hex 20)"; printf "%s" "$pass" >/root/.rank03-admin-pass; chmod 600 /root/.rank03-admin-pass; if samba-tool domain provision --realm=LAB.EXAMPLE --domain=LAB --server-role=dc --dns-backend=SAMBA_INTERNAL --adminpass="$pass" >/tmp/rank03-provision.log 2>&1; then echo PROVISION=OK; else echo PROVISION=FAILED; grep -Ei "error|exception|failed|traceback" /tmp/rank03-provision.log | tail -8 | sed -E "s/[[:xdigit:]]{32,}/[redacted]/g"; exit 19; fi; sed -i "/^\[global\]/a interfaces = lo eth0" /etc/samba/smb.conf; sed -i "/^\[global\]/a bind interfaces only = yes" /etc/samba/smb.conf; sed -i "/^\[global\]/a server services = -dns, -s3fs, -winbindd" /etc/samba/smb.conf; printf "127.0.0.1 dc.lab.example\n" >>/etc/hosts; printf "[libdefaults]\n default_realm = LAB.EXAMPLE\n dns_lookup_kdc = false\n[realms]\n LAB.EXAMPLE = {\n  kdc = 127.0.0.1\n }\n" >/root/.rank03-krb5.conf; chmod 600 /root/.rank03-krb5.conf; echo BIND_CONFIG=OK; echo POST_PROVISION=YES'
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc $provision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start Samba without port 53 and verify guest KDC
        shell: pwsh
        run: |
          $start = 'nohup samba -i -d 2 >/tmp/rank03-samba-start.log 2>&1 </dev/null & spid=$!; sleep 6; if kill -0 "$spid" 2>/dev/null; then echo "SAMBA_PROC=LIVE"; else echo "SAMBA_PROC=EXITED"; wait "$spid" 2>/dev/null; echo "SAMBA_EXIT=$?"; fi; echo "SAMBA_LOG_BYTES=$(wc -c </tmp/rank03-samba-start.log)"; sed -n "1,45p" /tmp/rank03-samba-start.log | sed -E "s/[[:xdigit:]]{32,}/[redacted]/g"; ip -4 -brief addr; testparm -s 2>/dev/null | grep -E "interfaces|bind interfaces only|server role|server services" | head -8 || true; ss -lnt | grep -E ":(88|389|53)[[:space:]]" || true; pass=$(cat /root/.rank03-admin-pass); printf "%s\n" "$pass" | KRB5_CONFIG=/root/.rank03-krb5.conf kinit Administrator@LAB.EXAMPLE >/tmp/rank03-kinit.log 2>&1; rc=$?; echo "GUEST_ADMIN_KINIT_EXIT=$rc"; sed -n "1,8p" /tmp/rank03-kinit.log | sed -E "s/[[:xdigit:]]{32,}/[redacted]/g"; exit $rc'
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc $start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure Windows to WSL service reachability
        shell: pwsh
        run: |
          foreach ($port in @(88,389)) {
            $ok = Test-NetConnection -ComputerName 127.0.0.1 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
            Write-Host "LOOPBACK_PORT_${port}=$ok"
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Test released Windows Kerberos LDAP bind to live Samba DC
        shell: pwsh
        run: |
          dotnet new console -n bindprobe -f net10.0 -o bindprobe --no-restore
          dotnet add bindprobe/bindprobe.csproj package System.DirectoryServices.Protocols --version 10.0.15
          @'
          using System;
          using System.DirectoryServices.Protocols;
          using System.IO;
          using System.Net;
          using System.Net.Sockets;
          using System.Text;
          using System.Threading;
          using System.Threading.Tasks;

          string host = Environment.GetEnvironmentVariable("PA30_DC_HOST")!;
          string password = Environment.GetEnvironmentVariable("PA30_BIND_PASS")!;
          using var stop = new CancellationTokenSource(TimeSpan.FromSeconds(30));
          using var dns = new UdpClient(new IPEndPoint(IPAddress.Loopback, 53));
          var server = Task.Run(async () => {
              try {
                  while (!stop.IsCancellationRequested) {
                      var query = await dns.ReceiveAsync(stop.Token);
                      byte[] answer = Reply(query.Buffer, host);
                      if (answer.Length != 0) await dns.SendAsync(answer, query.RemoteEndPoint, stop.Token);
                  }
              } catch (Exception ex) when (ex is OperationCanceledException or ObjectDisposedException) { }
          });
          foreach (var variant in new[]{
              ("KERB_UPN", new NetworkCredential("Administrator@LAB.EXAMPLE", password), AuthType.Kerberos),
              ("KERB_NETBIOS", new NetworkCredential("Administrator", password, "LAB"), AuthType.Kerberos),
              ("NEG_UPN", new NetworkCredential("Administrator@LAB.EXAMPLE", password), AuthType.Negotiate),
              ("NEG_NETBIOS", new NetworkCredential("Administrator", password, "LAB"), AuthType.Negotiate)
          }) {
              using var ldap = new LdapConnection(new LdapDirectoryIdentifier(host, true, false), variant.Item2, variant.Item3);
              ldap.SessionOptions.ProtocolVersion = 3;
              ldap.Timeout = TimeSpan.FromSeconds(10);
              try {
                  ldap.Bind();
                  Console.WriteLine($"WINDOWS_BIND_{variant.Item1}=SUCCESS");
              } catch (LdapException ex) {
                  Console.WriteLine($"WINDOWS_BIND_{variant.Item1}=LDAP_ERROR_{ex.ErrorCode}");
              } catch (Exception ex) {
                  Console.WriteLine($"WINDOWS_BIND_{variant.Item1}=CLASS_{ex.GetType().Name}");
              }
              try { Console.WriteLine($"WINDOWS_LDAP_HOST_{variant.Item1}={ldap.SessionOptions.HostName}"); } catch { }
          }
          stop.Cancel();
          try { await server; } catch { }

          static byte[] Name(string n) {
              using var m = new MemoryStream();
              foreach (string label in n.Split('.')) { var b = Encoding.ASCII.GetBytes(label); m.WriteByte((byte)b.Length); m.Write(b); }
              m.WriteByte(0); return m.ToArray();
          }
          static void W16(Stream s, int n) { s.WriteByte((byte)(n >> 8)); s.WriteByte((byte)n); }
          static void W32(Stream s, int n) { W16(s, n >> 16); W16(s, n); }
          static byte[] Reply(byte[] q, string host) {
              if (q.Length < 17) return Array.Empty<byte>();
              int p = 12; var labels = new System.Collections.Generic.List<string>();
              while (p < q.Length && q[p] != 0) {
                  int len = q[p++]; if (len > 63 || p + len >= q.Length) return Array.Empty<byte>();
                  labels.Add(Encoding.ASCII.GetString(q, p, len)); p += len;
              }
              if (p + 5 > q.Length) return Array.Empty<byte>();
              string name = string.Join('.', labels).ToLowerInvariant();
              int type = (q[p+1] << 8) | q[p+2], end = p+5;
              if (name.EndsWith("lab.example")) Console.WriteLine($"WINDOWS_DNS_QUERY={name} TYPE={type}");
              bool a = type == 1 && (name == host || name == "lab.example");
              bool srv = type == 33 && (name == "_kerberos._tcp.lab.example" || name == "_kerberos._udp.lab.example" || name == "_kerberos._tcp.dc._msdcs.lab.example" || name == "_ldap._tcp.lab.example");
              using var m = new MemoryStream();
              m.Write(q, 0, 2); W16(m, 0x8180); W16(m, 1); W16(m, a || srv ? 1 : 0); W16(m, 0); W16(m, 0);
              m.Write(q, 12, end-12);
              if (a) {
                  m.WriteByte(0xC0); m.WriteByte(0x0C); W16(m, 1); W16(m, 1); W32(m, 5); W16(m, 4); m.Write(new byte[]{127,0,0,1});
              }
              if (srv) {
                  byte[] target = Name(host);
                  m.WriteByte(0xC0); m.WriteByte(0x0C); W16(m, 33); W16(m, 1); W32(m, 5); W16(m, 6+target.Length);
                  W16(m, 0); W16(m, 0); W16(m, name.StartsWith("_ldap") ? 389 : 88); m.Write(target);
              }
              return m.ToArray();
          }
          '@ | Set-Content -Path bindprobe/Program.cs -Encoding utf8
          dotnet build bindprobe/bindprobe.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dcName = (& wsl.exe --distribution Ubuntu-24.04 --user root --exec hostname).Trim().ToLowerInvariant() + '.lab.example'
          $pass = (& wsl.exe --distribution Ubuntu-24.04 --user root --exec cat /root/.rank03-admin-pass).Trim()
          Write-Host "::add-mask::$pass"
          $env:PA30_DC_HOST = $dcName
          $env:PA30_BIND_PASS = $pass
          Write-Host "WINDOWS_DC_HOST=$dcName"
          $client = @(Get-DnsClientServerAddress -AddressFamily IPv4) | Where-Object { $_.ServerAddresses.Count -gt 0 -and $_.InterfaceAlias -notmatch 'Loopback' } | Select-Object -First 1
          if ($null -eq $client) { Write-Host 'WINDOWS_DNS_FIXTURE=NO_CLIENT'; exit 2 }
          $saved = @($client.ServerAddresses)
          $traceKey = 'HKLM:\SYSTEM\CurrentControlSet\Services\ldap\Tracing\bindprobe.exe'
          New-Item -Path $traceKey -Force | Out-Null
          $etl = Join-Path $env:RUNNER_TEMP 'eop090-kerb.etl'
          $txt = Join-Path $env:RUNNER_TEMP 'eop090-kerb.txt'
          logman create trace eop090-kerb -ow -o $etl -p 'Microsoft-Windows-LDAP-Client' 0x18180380 0xff -ets | Out-Null
          try {
            Set-DnsClientServerAddress -InterfaceIndex $client.InterfaceIndex -ServerAddresses @('127.0.0.1')
            ipconfig /flushdns | Out-Null
            $capStart = 'nohup tcpdump -i any -s 0 -w /tmp/rank03-ldap.pcap tcp port 389 >/tmp/rank03-tcpdump.log 2>&1 </dev/null & echo $! >/tmp/rank03-tcpdump.pid; sleep 1; if kill -0 $(cat /tmp/rank03-tcpdump.pid) 2>/dev/null; then echo LDAP_CAPTURE=LIVE; else echo LDAP_CAPTURE=FAILED; fi'
            wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc $capStart
            & './bindprobe/bin/Release/net10.0/bindprobe.exe'
          } finally {
            $capStop = 'if test -f /tmp/rank03-tcpdump.pid; then kill $(cat /tmp/rank03-tcpdump.pid) 2>/dev/null || true; fi; sleep 1'
            wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc $capStop
            $capReport = @'
          """Summarize LDAP bind auth tags from a private pcap; never print packet contents."""
          
          from collections import Counter
          from pathlib import Path
          import struct
          
          
          def tlv(data, offset):
              if offset + 2 > len(data):
                  raise ValueError("short tag")
              tag = data[offset]
              first = data[offset + 1]
              offset += 2
              if first & 0x80:
                  count = first & 0x7F
                  if count == 0 or count > 4 or offset + count > len(data):
                      raise ValueError("invalid length")
                  length = int.from_bytes(data[offset : offset + count], "big")
                  offset += count
              else:
                  length = first
              end = offset + length
              if end > len(data):
                  raise ValueError("truncated value")
              return tag, offset, end, end
          
          
          def ldap_bind_auth(payload):
              tag, start, end, _ = tlv(payload, 0)
              if tag != 0x30:
                  return None
              _, _, _, pos = tlv(payload, start)  # messageID
              tag, inner, _, _ = tlv(payload, pos)
              if tag != 0x60:
                  return None
              _, _, _, pos = tlv(payload, inner)  # version
              _, _, _, pos = tlv(payload, pos)  # name; never print
              tag, auth_start, _, _ = tlv(payload, pos)
              names = {0x80: "simple", 0xA3: "sasl", 0x89: "sicily-discovery", 0x8A: "sicily-negotiate", 0x8B: "sicily-response"}
              auth = names.get(tag, f"tag-{tag:02x}")
              if tag == 0xA3:
                  mech_tag, mech_start, mech_end, _ = tlv(payload, auth_start)
                  if mech_tag == 0x04:
                      mechanism = payload[mech_start:mech_end]
                      allowed = {b"GSS-SPNEGO", b"GSSAPI", b"NTLM", b"DIGEST-MD5", b"EXTERNAL"}
                      auth += ":" + (mechanism.decode("ascii") if mechanism in allowed else "other")
              return auth
          
          
          def ipv4_tcp_payload(frame, linktype):
              if linktype == 276:  # Linux cooked v2
                  offset = 20
              elif linktype == 113:  # Linux cooked v1
                  offset = 16
              elif linktype == 1:  # Ethernet
                  offset = 14
              else:
                  return None
              if len(frame) < offset + 20 or frame[offset] >> 4 != 4:
                  return None
              ihl = (frame[offset] & 15) * 4
              if frame[offset + 9] != 6 or ihl < 20:
                  return None
              ip_end = offset + int.from_bytes(frame[offset + 2 : offset + 4], "big")
              tcp = offset + ihl
              if ip_end > len(frame) or tcp + 20 > ip_end:
                  return None
              destination = int.from_bytes(frame[tcp + 2 : tcp + 4], "big")
              header = ((frame[tcp + 12] >> 4) & 15) * 4
              if header < 20 or tcp + header > ip_end:
                  return None
              return destination, frame[tcp + header : ip_end]
          
          
          def summarize(path):
              data = Path(path).read_bytes()
              print(f"LDAP_CAPTURE_BYTES={len(data)}")
              if len(data) < 24:
                  print("LDAP_PCAP_STATUS=SHORT")
                  return
              magic = data[:4]
              if magic in (b"\xd4\xc3\xb2\xa1", b"\x4d\x3c\xb2\xa1"):
                  order = "<"
              elif magic in (b"\xa1\xb2\xc3\xd4", b"\xa1\xb2\x3c\x4d"):
                  order = ">"
              else:
                  print("LDAP_PCAP_STATUS=UNKNOWN_FORMAT")
                  return
              linktype = struct.unpack_from(order + "I", data, 20)[0]
              pos = 24
              packets = 0
              client_payloads = 0
              parse_errors = 0
              auth = Counter()
              while pos + 16 <= len(data):
                  included = struct.unpack_from(order + "I", data, pos + 8)[0]
                  pos += 16
                  if included > len(data) - pos:
                      parse_errors += 1
                      break
                  frame = data[pos : pos + included]
                  pos += included
                  packets += 1
                  result = ipv4_tcp_payload(frame, linktype)
                  if result is None or result[0] != 389 or not result[1]:
                      continue
                  client_payloads += 1
                  try:
                      choice = ldap_bind_auth(result[1])
                      if choice:
                          auth[choice] += 1
                  except ValueError:
                      parse_errors += 1
              print(f"LDAP_PCAP_LINKTYPE={linktype}")
              print(f"LDAP_PCAP_PACKETS={packets}")
              print(f"LDAP_CLIENT_PAYLOADS={client_payloads}")
              print(f"LDAP_BER_PARSE_ERRORS={parse_errors}")
              print("LDAP_BIND_AUTH=" + (",".join(f"{key}:{auth[key]}" for key in sorted(auth)) or "none"))
          
          
          if __name__ == "__main__":
              summarize("/tmp/rank03-ldap.pcap")
          '@
            wsl.exe --distribution Ubuntu-24.04 --user root --exec python3 -c $capReport
            if ($saved.Count -gt 0) { Set-DnsClientServerAddress -InterfaceIndex $client.InterfaceIndex -ServerAddresses $saved }
            else { Set-DnsClientServerAddress -InterfaceIndex $client.InterfaceIndex -ResetServerAddresses }
            Remove-Item Env:PA30_BIND_PASS -ErrorAction SilentlyContinue
            logman stop eop090-kerb -ets | Out-Null
            Remove-Item -Path $traceKey -Force -ErrorAction SilentlyContinue
          }
          netsh trace convert "input=$etl" "output=$txt" | Out-Null
          if (Test-Path $txt) {
            $matches = Select-String -Path $txt -Pattern 'make spn|servicename for bind|SSPI|InitializeSecurity|AcquireCredential|Bind failed|ldap_bind|error code|SASL' | Select-Object -First 80
            foreach ($match in $matches) {
              $safe = $match.Line -replace '[A-Fa-f0-9]{32,}', '[redacted]'
              Write-Host "WINDOWS_LDAP_TRACE=$safe"
            }
            Write-Host "WINDOWS_LDAP_TRACE_MATCH_COUNT=$($matches.Count)"
          }
          $kdcEvidence = & wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc 'grep -Eic "AS-REQ|TGS-REQ|KDC|kerberos" /tmp/rank03-samba-start.log || true'
          Write-Host "GUEST_KDC_LOG_MATCHES=$kdcEvidence"
