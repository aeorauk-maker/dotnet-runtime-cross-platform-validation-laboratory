name: Rank03 Windows WSL boot
on:
  push:
    branches: [pa30-rank03-winwsl-20261128]
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Install and start official Ubuntu WSL distro
        shell: pwsh
        run: |
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch --web-download
          Write-Host "INSTALL_EXIT=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl.exe --list --verbose
          Write-Host "LIST_EXIT=$LASTEXITCODE"
          wsl.exe --distribution Ubuntu-24.04 --user root --exec sh -lc 'printf "WSL_BOOTED=1\n"; uname -r; id -u; head -3 /etc/os-release'
          Write-Host "BOOT_EXIT=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
