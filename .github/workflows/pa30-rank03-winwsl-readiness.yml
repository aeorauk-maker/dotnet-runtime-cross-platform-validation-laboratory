name: Rank03 Windows WSL Samba readiness
on:
  push:
    branches: [pa30-rank03-winwsl-20261128]
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Install official Ubuntu WSL distro
        shell: pwsh
        run: |
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch --web-download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec sh -lc 'printf "WSL_BOOTED=1\n"; uname -r; id -u'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and provision disposable Samba domain
        shell: pwsh
        run: |
          $install = 'export DEBIAN_FRONTEND=noninteractive; apt-get update -qq >/tmp/rank03-apt-update.log 2>&1 && apt-get install -y -qq samba krb5-user dnsutils >/tmp/rank03-apt-install.log 2>&1; rc=$?; echo "APT_EXIT=$rc"; test $rc -eq 0; command -v samba-tool'
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc $install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $provision = 'set -eu; rm -f /etc/samba/smb.conf; pass="Aa1!$(openssl rand -hex 20)"; printf "%s" "$pass" >/root/.rank03-admin-pass; chmod 600 /root/.rank03-admin-pass; if samba-tool domain provision --realm=LAB.EXAMPLE --domain=LAB --server-role=dc --dns-backend=SAMBA_INTERNAL --adminpass="$pass" >/tmp/rank03-provision.log 2>&1; then echo PROVISION=OK; else echo PROVISION=FAILED; grep -Ei "error|exception|failed|traceback" /tmp/rank03-provision.log | tail -8 | sed -E "s/[[:xdigit:]]{32,}/[redacted]/g"; exit 19; fi; echo POST_PROVISION=YES'
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc $provision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose Samba startup separately
        shell: pwsh
        run: |
          $start = 'timeout 8s samba -i -d 2 >/tmp/rank03-samba-start.log 2>&1; rc=$?; echo "START_RC=$rc"; grep -Ei "error|failed|unable|bind|listen" /tmp/rank03-samba-start.log | tail -12 | sed -E "s/[[:xdigit:]]{32,}/[redacted]/g" || true'
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc $start
      - name: Measure Windows to WSL service reachability
        shell: pwsh
        run: |
          foreach ($port in @(88,389)) {
            $ok = Test-NetConnection -ComputerName 127.0.0.1 -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
            Write-Host "LOOPBACK_PORT_${port}=$ok"
          }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec bash -lc 'pass=$(cat /root/.rank03-admin-pass); printf "%s\n" "$pass" | KRB5_CONFIG=/var/lib/samba/private/krb5.conf kinit Administrator@LAB.EXAMPLE >/tmp/rank03-kinit.log 2>&1; rc=$?; echo "ADMIN_KINIT_EXIT=$rc"; exit $rc'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
