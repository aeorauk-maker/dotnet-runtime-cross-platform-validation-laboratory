name: Rank 14 EOP062 Windows natural idle pipe window

on:
  push:
    branches:
      - rank-14-eop062-pa30-20261128
    paths:
      - eop062-idle-roslyn-preclaim-net10.ps1
      - .github/workflows/rank-14-eop062-idle-roslyn-preclaim-net10.yml

permissions:
  contents: read

jobs:
  windows-idle-roslyn-preclaim-net10:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Test default Roslyn pipe after natural idle exit
        shell: pwsh
        run: |
          '{"sdk":{"version":"10.0.404","rollForward":"disable"}}' | Set-Content global.json
          .\eop062-idle-roslyn-preclaim-net10.ps1
