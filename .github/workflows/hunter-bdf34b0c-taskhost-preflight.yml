name: Hunter bdf34b0c Windows token control
on:
  push:
    branches:
      - hunter-20261127-bdf34b0c-taskhost-preflight
permissions:
  contents: read
jobs:
  preflight:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check explicit medium token
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File ./medium-token-v1.ps1
