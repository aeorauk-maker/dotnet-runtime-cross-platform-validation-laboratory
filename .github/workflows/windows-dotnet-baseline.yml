name: Windows .NET baseline
on:
  workflow_dispatch:
    inputs:
      lab_payload:
        description: Optional base64 PowerShell payload for owned inert validation
        required: false
        type: string
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Record runner and installed .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output "Runner=$env:RUNNER_OS ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          dotnet --info
      - name: Build and execute clean .NET 10 console baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:RUNNER_TEMP 'dotnet-baseline'
          dotnet new console --framework net10.0 --output $project --no-restore
          dotnet restore $project
          dotnet run --project $project --no-restore
      - name: Run owned inert validation payload
        if: ${{ inputs.lab_payload != '' }}
        shell: pwsh
        env:
          LAB_PAYLOAD: ${{ inputs.lab_payload }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $source = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:LAB_PAYLOAD))
            & ([ScriptBlock]::Create($source))
          } catch {
            Write-Output ("Validation failed: " + $_.Exception.GetType().Name)
            exit 1
          }
