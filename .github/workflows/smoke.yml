name: Runner smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          uname -a
          python3 --version
          gcc --version
      - name: Run Python smoke tests
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import struct
          import unittest

          class RunnerSmokeTests(unittest.TestCase):
              def test_repository_checkout(self):
                  self.assertTrue(Path('README.md').is_file())

              def test_json_roundtrip(self):
                  value = {'message': 'hello', 'values': [0, 1, 255]}
                  self.assertEqual(json.loads(json.dumps(value)), value)

              def test_binary_roundtrip(self):
                  value = 0x12345678
                  self.assertEqual(struct.unpack('<I', struct.pack('<I', value))[0], value)
                  with self.assertRaises(struct.error):
                      struct.unpack('<I', b'\x00')

              def test_sha256_known_vector(self):
                  self.assertEqual(hashlib.sha256(b'abc').hexdigest(),
                      'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad')

          unittest.main(verbosity=2)
          PY
      - name: Compile and run C smoke test
        run: |
          cat > /tmp/runner-smoke.c <<'C'
          #include <assert.h>
          #include <stdint.h>
          #include <stdio.h>
          int main(void) {
              const uint8_t bytes[] = {0x78, 0x56, 0x34, 0x12};
              const uint32_t value = (uint32_t)bytes[0]
                  | ((uint32_t)bytes[1] << 8)
                  | ((uint32_t)bytes[2] << 16)
                  | ((uint32_t)bytes[3] << 24);
              assert(value == UINT32_C(0x12345678));
              puts("C smoke test passed");
              return 0;
          }
          C
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g /tmp/runner-smoke.c -o /tmp/runner-smoke
          /tmp/runner-smoke
      - name: Write job summary
        run: |
          echo '### Runner smoke tests passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Four Python tests and one C test with AddressSanitizer/UBSan completed successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo 'These are infrastructure checks, not exploit PoC validation.' >> "$GITHUB_STEP_SUMMARY"
