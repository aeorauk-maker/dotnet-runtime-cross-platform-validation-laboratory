name: L16 inert PR workflow variant

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Emit inert artifact
        run: |
          mkdir -p probe
          printf '202\n' > probe/pr-number.txt
          echo 'L16_BRANCH_WORKFLOW_EXECUTED=1' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload inert artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: l16-inert-pr-number
          path: probe/pr-number.txt
          if-no-files-found: error
