name: net10-maintained-consumer-build
on:
  push:
    branches:
      - validation-net10-consumer-build-20261128-r21
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Fetch pinned public source
        run: |
          git clone --depth 1 https://github.com/Aguafrommars/TheIdServer.git consumer
          test "$(git -C consumer rev-parse HEAD)" = c33395d5f0354b7efed9d664c8c62de27312306d
      - name: Build maintained net10 host
        run: |
          set +e
          dotnet build consumer/src/Aguacongas.TheIdServer.Duende/Aguacongas.TheIdServer.Duende.csproj -c Release --nologo > consumer-build.log 2>&1
          result=$?
          tail -n 70 consumer-build.log
          exit "$result"
      - name: Boot maintained file-store host
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5860
          DisableHttps: 'true'
          RedisConfigurationOptions__ConnectionString: ''
          DynamicConfigurationOptions__ProviderType: ''
          DataProtectionOptions__StorageKind: FileSystem
          DataProtectionOptions__StorageConnectionString: /tmp/r21-keys
          IdentityServerOptions__MutualTls__Enabled: 'false'
        run: |
          set -u
          mkdir -p /tmp/r21-keys
          (cd consumer/src/Aguacongas.TheIdServer.Duende && dotnet bin/Release/net10.0/Aguacongas.TheIdServer.Duende.dll) > host-startup.log 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          code=000
          for i in $(seq 1 30); do
            if ! kill -0 "$host_pid" 2>/dev/null; then break; fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:5860/healthz || true)
            if [ "$code" != 000 ]; then break; fi
            sleep 1
          done
          echo "health_http=$code"
          dotnet --list-runtimes | grep 'Microsoft.AspNetCore.App 10.0.15'
          if [ "$code" = 000 ]; then exit 1; fi
          python3 - <<'PY'
          import json
          import urllib.request, urllib.parse, urllib.error
          from http.cookiejar import CookieJar
          from html.parser import HTMLParser
          
          class LoginParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.action = None
                  self.token = None
              def handle_starttag(self, tag, attrs):
                  item = dict(attrs)
                  if tag == 'form' and self.action is None:
                      self.action = item.get('action')
                  if tag == 'input' and item.get('name') == '__RequestVerificationToken':
                      self.token = item.get('value')
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          base = 'http://127.0.0.1:5860'
          jar = CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          with client.open(base + '/Account/Login', timeout=8) as response:
              page = response.read().decode('utf-8', 'replace')
          parser = LoginParser()
          parser.feed(page)
          print('mvc_login_form', bool(parser.token))
          assert parser.token, 'real MVC login form and antiforgery token absent'
          with open('consumer/src/Aguacongas.TheIdServer.Duende/appsettings.json', encoding='utf-8-sig') as stream:
              settings = json.load(stream)
          user = next(item for item in settings['InitialData']['Users'] if item['UserName'] == 'alice')
          form = urllib.parse.urlencode({'Username': user['UserName'], 'Password': user['Password'], 'ReturnUrl': '', 'button': 'login', '__RequestVerificationToken': parser.token}).encode()
          post = urllib.request.Request(urllib.parse.urljoin(base + '/', parser.action or '/Account/Login'), data=form, method='POST')
          with client.open(post, timeout=8) as response:
              response.read()
          identity_cookie = any('Identity.Application' in cookie.name for cookie in jar)
          print('identity_cookie_present', identity_cookie)
          with client.open(base + '/Identity/Account/Manage/Email', timeout=8) as response:
              protected = response.read().decode('utf-8', 'replace')
              protected_status = response.status
          protected_form = protected_status == 200 and 'id="email-form"' in protected
          print('authenticated_email_form', protected_form)
          anonymous = urllib.request.build_opener(NoRedirect())
          try:
              with anonymous.open(base + '/Identity/Account/Manage/Email', timeout=8) as response:
                  denied_status = response.status
          except urllib.error.HTTPError as failure:
              denied_status = failure.code
          print('anonymous_email_status', denied_status)
          assert identity_cookie and protected_form and denied_status in (302, 303, 307, 401, 403)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net10-maintained-consumer-boot-log
          path: |
            consumer-build.log
            host-startup.log
          if-no-files-found: ignore
          retention-days: 1
