name: Rank 20 EOP062 released Roslyn Windows join

on:
  push:
    branches:
      - rank-20-eop062-windows-20261127
    paths:
      - eop062-roslyn-join.ps1
      - .github/workflows/rank-20-eop062-roslyn-join.yml

permissions:
  contents: read

jobs:
  roslyn-join:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Test released Roslyn default pipe across integrity levels
        shell: pwsh
        run: .\eop062-roslyn-join.ps1

