name: Hunter 74be38f3 isolated Linux fixture
on:
  push:
    branches: [hunter-74be38f3-linux-fixture-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Run private inert fixture and seal output
        shell: bash
        env:
          PRIVATE_FIXTURE_B64: ${{ secrets.HUNTER_74BE38F3_LINUX_FIXTURE_B64 }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/h74"
