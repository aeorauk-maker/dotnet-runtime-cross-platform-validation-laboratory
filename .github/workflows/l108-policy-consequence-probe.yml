                      len(events) != before + 1 or
                      events[-1]["token_sha256"] != hashlib.sha256(protected_bytes).hexdigest() or
                      events[-1]["uid"] != 65534 or
                      events[-1]["gitlab_write_http"] != 201 or
                      events[-1].get("project_token_create_http") != 201 or
                      not events[-1].get("project_token_sha256")):
                  raise RuntimeError("One-shot signed-tool policy consequence failed: " +
                                     output.replace(tokens["reader"], "[masked]")[-700:])

