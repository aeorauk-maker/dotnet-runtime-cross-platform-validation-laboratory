                  after_revoke["path"] + "/raw?ref=main", token=root_token)
              summary["controls"].append({
                  "case": "revoked_token_write_absent_from_a", "http": absent_code})
              if absent_code != 404:
                  raise RuntimeError("Revoked project token file unexpectedly exists")
          except Exception as error:
              redacted = str(error)
              for secret in [root_token, *tokens.values()]:
                  redacted = redacted.replace(secret, "[masked]")
              summary["error"] = redacted[:800]
              raise
          finally:
              lower_process.terminate()
              lower_process.wait(timeout=10)
              out = pathlib.Path("l108-result.json")
              out.write_text(json.dumps(summary, indent=2) + "\n")
              print("RESULT_SUMMARY=" + json.dumps(summary, separators=(",", ":")))
          PY

      - name: Upload redacted registry result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-nuget-downstream-write-result
          path: l108-result.json
          if-no-files-found: ignore

      - name: Stop ephemeral GitLab
        if: always()
        shell: bash
        run: |
          docker rm --force l108-owned-gitlab >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/l108-root-token"
