              push("Impact", "B", a["id"], tokens["publisher"],
                   expect_success=False, lower_os=True)
              push("Impact", "B", b["id"], tokens["publisher"], lower_os=True)
              restore("Impact", "unsigned_b_restore_only", "B", "B",
                      strict=True, invoke=False)
              restore("Impact", "unsigned_b_protected_post", "B", "B",
                      strict=True, exfil=True)
              restore("Impact", "unsigned_b_protected_repeat", "B", "B",
