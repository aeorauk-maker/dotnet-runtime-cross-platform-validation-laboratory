              push("Primary", "B", a["id"], tokens["publisher"], expect_success=False)
              push("Primary", "B", b["id"], tokens["publisher"])
              restore("Primary", "primary_b_newer", "B", "B")
              restore("Primary", "primary_b_repeat", "B", "B")
              push("Reverse", "B", b["id"], tokens["publisher"])
              restore("Reverse", "reverse_b_only", "B", "B")
              push("Reverse", "A", a["id"], root_token)
              restore("Reverse", "reverse_a_newer", "A", "A")

              index_code, index = request(
                  "GET", f"/api/v4/groups/{gid}/-/packages/nuget/index.json",
                  token=tokens["reader"])
              summary["group_index_http"] = index_code
              if index_code == 200:
                  summary["index_resource_types"] = sorted(
                      str(x.get("@type")) for x in index.get("resources", []))
