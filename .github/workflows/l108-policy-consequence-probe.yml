              restore("ImpactReverse", "reverse_unsigned_b_restore_only", "B", "B",
                      strict=True, invoke=False)
              push("ImpactReverse", "A", a["id"], root_token)
              restore("ImpactReverse", "reverse_signed_a_selected", "A", "A",
                      strict=True)
              events = read_events()
              summary["downstream_events"] = events
              summary["protected_post_count"] = len(events)
              summary["all_protected_posts_match"] = all(
                  event["token_sha256"] == hashlib.sha256(protected_bytes).hexdigest()
                  for event in events)
              if len(events) != 3 or not summary["all_protected_posts_match"]:
                  raise RuntimeError("Unexpected final protected POST state")
              for number, event in enumerate(events, start=1):
