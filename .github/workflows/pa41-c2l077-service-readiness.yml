name: PA41 isolated service readiness

on:
  push:
    branches:
      - pa41-c2l077-pat-20261128
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: inert-lab
          POSTGRES_DB: inert_pat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d inert_pat" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify isolated services
        run: |
          set -euo pipefail
          dotnet --list-runtimes | grep '^Microsoft.AspNetCore.App 10\.0\.15 '
          python3 - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 6379), timeout=5) as redis:
              redis.sendall(b"*1\r\n$4\r\nPING\r\n")
              assert redis.recv(16) == b"+PONG\r\n"
          with socket.create_connection(("127.0.0.1", 5432), timeout=5):
              pass
          print("READY")
          PY
      - name: Build pinned public Contacts source
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mayafit/Contacts.git contacts
          git -C contacts checkout --quiet c33e77130cbfaff787abc25c50197b16303d55e6
          test "$(git -C contacts rev-parse HEAD)" = c33e77130cbfaff787abc25c50197b16303d55e6
          dotnet restore contacts/ContactsApi/src/ContactsApi.WebApi/ContactsApi.WebApi.csproj --verbosity quiet
          dotnet build contacts/ContactsApi/src/ContactsApi.WebApi/ContactsApi.WebApi.csproj -c Release --no-restore --verbosity quiet
          echo PINNED_BUILD_OK
      - name: Build and run same-process token lab
        run: |
          set -euo pipefail
          dotnet restore pat-lab/PatLab.csproj --verbosity quiet
          dotnet build pat-lab/PatLab.csproj -c Release --no-restore --verbosity quiet
          python3 pat-lab/drive.py
