name: General09 out-of-process IIS baseline
on:
  push:
    branches:
      - hunter-20261127-general09-fe1b1c-eventlog
    paths:
      - .github/workflows/hunter-general09-iis-baseline.yml
permissions:
  contents: read
jobs:
  iis-baseline:
    runs-on: windows-2025
    steps:
      - name: Configure signed hosting module and inert IIS site
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          foreach ($featureName in @('IIS-URLAuthorization','IIS-WindowsAuthentication')) {
            $feature = Get-WindowsOptionalFeature -Online -FeatureName $featureName
            if ($feature.State -ne 'Enabled') { Enable-WindowsOptionalFeature -Online -FeatureName $featureName -All -NoRestart | Out-Null }
          }
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-hosting-11.0.0-win.exe'
          Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/11.0.0/dotnet-hosting-11.0.0-win.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Hosting bundle signature invalid' }
          Write-Output "HostingBundleSHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"
          $install = Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "Hosting bundle exited $($install.ExitCode)" }
          net stop was /y | Out-Null
          net start w3svc | Out-Null
          $module = Join-Path $env:ProgramFiles 'IIS/Asp.Net Core Module/V2/aspnetcorev2.dll'
          if (-not (Test-Path $module)) { throw 'ANCM missing' }
          Write-Output "ANCMVersion=$((Get-Item $module).VersionInfo.FileVersion) ANCMSHA256=$((Get-FileHash $module -Algorithm SHA256).Hash)"
          $project = Join-Path $env:RUNNER_TEMP 'H09App'
          dotnet new web -n H09App -f net11.0 -o $project --no-restore | Out-Null
          @'
          var builder = WebApplication.CreateBuilder(args);
          var app = builder.Build();
          app.MapGet("/open", () => "H09-OPEN");
          app.MapGet("/restricted", () => "H09-INERT-PROTECTED");
          app.Run();
          '@ | Set-Content -Path (Join-Path $project 'Program.cs') -Encoding utf8
          $published = Join-Path $env:RUNNER_TEMP 'H09Published'
          dotnet publish (Join-Path $project 'H09App.csproj') -c Release -p:AspNetCoreHostingModel=OutOfProcess -o $published | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed' }
          if (-not (Select-String -Path (Join-Path $published 'web.config') -Pattern 'hostingModel="outofprocess"' -Quiet)) { throw 'Hosting model is not out-of-process' }
          $appcmd = Join-Path $env:windir 'System32/inetsrv/appcmd.exe'
          & $appcmd add apppool /name:H09Pool | Out-Null
          & $appcmd add site /name:H09Site /bindings:http/127.0.0.1:8927: "/physicalPath:$published" | Out-Null
          & $appcmd set app 'H09Site/' /applicationPool:H09Pool | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'App pool assignment failed' }
          $root = $null
          for ($attempt=0; $attempt -lt 15; $attempt++) {
            try { $root=Invoke-WebRequest 'http://127.0.0.1:8927/open' -SkipHttpErrorCheck; if ($root.StatusCode -eq 200) { break } }
            catch { Start-Sleep -Seconds 1 }
          }
          if ($null -eq $root -or $root.StatusCode -ne 200 -or $root.Content -ne 'H09-OPEN') { throw 'Clean IIS baseline failed' }
          Write-Output 'CleanIIS=200'
          & $appcmd set config 'H09Site/restricted' /section:system.webServer/security/authentication/anonymousAuthentication /enabled:false /commit:apphost | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Anonymous restriction failed' }
          & $appcmd set config 'H09Site/restricted' /section:system.webServer/security/authentication/windowsAuthentication /enabled:true /commit:apphost | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Windows Authentication setup failed' }
          [xml]$config = Get-Content (Join-Path $published 'web.config')
          $location=$config.CreateElement('location'); $location.SetAttribute('path','restricted')
          $webServer=$config.CreateElement('system.webServer'); $security=$config.CreateElement('security'); $authorization=$config.CreateElement('authorization')
          $authorization.AppendChild($config.CreateElement('clear')) | Out-Null
          $allow=$config.CreateElement('add'); $allow.SetAttribute('accessType','Allow'); $allow.SetAttribute('roles','Administrators')
          $authorization.AppendChild($allow) | Out-Null; $security.AppendChild($authorization) | Out-Null; $webServer.AppendChild($security) | Out-Null; $location.AppendChild($webServer) | Out-Null
          $config.DocumentElement.AppendChild($location) | Out-Null; $config.Save((Join-Path $published 'web.config'))
          $denied=Invoke-WebRequest 'http://127.0.0.1:8927/restricted' -SkipHttpErrorCheck
          $valid=Invoke-WebRequest 'http://127.0.0.1:8927/restricted' -UseDefaultCredentials -AllowUnencryptedAuthentication -SkipHttpErrorCheck
          Write-Output "IISAnonymous=$($denied.StatusCode) IISAdmin=$($valid.StatusCode)"
          if ($denied.StatusCode -notin @(401,403) -or $valid.StatusCode -ne 200 -or $valid.Content -ne 'H09-INERT-PROTECTED') { throw 'Native IIS authorization baselines failed' }
