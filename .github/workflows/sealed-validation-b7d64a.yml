name: Isolated validation b7d64a
on:
  push:
    branches: [lab-20261128-b7d64a]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - name: Run isolated validation
        env:
          LAB_KEY: ${{ secrets.PA30_B7D64A_KEY }}
          SEALED_B64: ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/isolated-lab/out
          printf '%s' "$SEALED_B64" | base64 -d | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:LAB_KEY > /tmp/isolated-lab/payload.tgz
          tar -xzf /tmp/isolated-lab/payload.tgz -C /tmp/isolated-lab
          set +e
          bash /tmp/isolated-lab/run.sh > /tmp/isolated-lab/out/runner.log 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > /tmp/isolated-lab/out/exit-code.txt
          tar -czf /tmp/isolated-lab/result.tgz -C /tmp/isolated-lab/out .
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/isolated-lab/result.tgz -out "$RUNNER_TEMP/isolated-result.enc" -pass env:LAB_KEY
          printf 'Sealed result ready\n'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-result-b7d64a
          path: ${{ runner.temp }}/isolated-result.enc
          if-no-files-found: warn
          retention-days: 7
      - name: Check validation status
        if: always()
        run: |
          test -f /tmp/isolated-lab/out/exit-code.txt
          test "$(cat /tmp/isolated-lab/out/exit-code.txt)" = '0'
