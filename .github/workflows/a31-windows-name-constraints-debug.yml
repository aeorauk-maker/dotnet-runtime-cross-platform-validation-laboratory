name: A31 isolated Windows TLS name matrix debug
on:
  push:
    branches: [pa30-rank10-a31-windows-20261128]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Run owned loopback certificate matrix
        shell: pwsh
        run: |
          dotnet --info
          New-Item -ItemType Directory -Force A31Matrix | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net11.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Path A31Matrix/A31Windows.csproj -Encoding utf8
          @'
          using System.Net;
          using System.Net.Http.Headers;
          using System.Net.Security;
          using System.Net.Sockets;
          using System.Security.Authentication;
          using System.Security.Cryptography;
          using System.Security.Cryptography.X509Certificates;
          using System.Text;
          using System.Text.Json;
          
          var now = DateTimeOffset.UtcNow;
          using var rootKey = ECDsa.Create(ECCurve.NamedCurves.nistP256);
          var rootReq = new CertificateRequest("CN=A31 owned root", rootKey, HashAlgorithmName.SHA256);
          rootReq.CertificateExtensions.Add(new X509BasicConstraintsExtension(true, false, 0, true));
          rootReq.CertificateExtensions.Add(new X509KeyUsageExtension(X509KeyUsageFlags.KeyCertSign | X509KeyUsageFlags.CrlSign, true));
          using var root = rootReq.CreateSelfSigned(now.AddHours(-1), now.AddHours(8));
          
          using var issuerKey = ECDsa.Create(ECCurve.NamedCurves.nistP256);
          var issuerReq = new CertificateRequest("CN=A31 constrained issuer", issuerKey, HashAlgorithmName.SHA256);
          issuerReq.CertificateExtensions.Add(new X509BasicConstraintsExtension(true, true, 0, true));
          issuerReq.CertificateExtensions.Add(new X509KeyUsageExtension(X509KeyUsageFlags.KeyCertSign | X509KeyUsageFlags.CrlSign, true));
          issuerReq.CertificateExtensions.Add(new X509Extension(new Oid("2.5.29.30"),
              Convert.FromHexString("3012a010300e820c616c6c6f7765642e74657374"), true));
          using var issuerUnsigned = issuerReq.Create(root, now.AddMinutes(-30), now.AddHours(6), new byte[] { 2, 1, 1 });
          using var issuer = issuerUnsigned.CopyWithPrivateKey(issuerKey);
          
          using var leafKey = ECDsa.Create(ECCurve.NamedCurves.nistP256);
          X509Certificate2 MakeLeaf(X509Certificate2 parent, bool dnsSan, byte serial)
          {
              var req = new CertificateRequest("CN=forbidden.test", leafKey, HashAlgorithmName.SHA256);
              req.CertificateExtensions.Add(new X509BasicConstraintsExtension(false, false, 0, true));
              req.CertificateExtensions.Add(new X509KeyUsageExtension(X509KeyUsageFlags.DigitalSignature, true));
              req.CertificateExtensions.Add(new X509EnhancedKeyUsageExtension(
                  new OidCollection { new Oid("1.3.6.1.5.5.7.3.1") }, false));
              if (dnsSan)
              {
                  var san = new SubjectAlternativeNameBuilder();
                  san.AddDnsName("forbidden.test");
                  req.CertificateExtensions.Add(san.Build());
              }
              using var unsigned = req.Create(parent, now.AddMinutes(-15), now.AddHours(4), new byte[] { 3, 1, serial });
              return unsigned.CopyWithPrivateKey(leafKey);
          }
          
          using var attack = MakeLeaf(issuer, false, 1);
          using var denied = MakeLeaf(issuer, true, 2);
          using var valid = MakeLeaf(root, true, 3);
          var token = Convert.ToHexString(RandomNumberGenerator.GetBytes(16));
          foreach (var (label, cert, intermediate) in new[] {
              ("attack_first", attack, issuer),
              ("denied_san", denied, issuer),
              ("valid_direct_root", valid, (X509Certificate2?)null),
              ("attack_repeat", attack, issuer),
          })
          {
              using var chain = new X509Chain();
              chain.ChainPolicy.TrustMode = X509ChainTrustMode.CustomRootTrust;
              chain.ChainPolicy.CustomTrustStore.Add(root);
              chain.ChainPolicy.RevocationMode = X509RevocationMode.NoCheck;
              if (intermediate is not null) chain.ChainPolicy.ExtraStore.Add(intermediate);
              bool chainBuilt = chain.Build(cert);
              string[] statuses = chain.ChainStatus.Select(x => x.Status.ToString()).ToArray();
              bool hostname = cert.MatchesHostname("forbidden.test");
          
              using var listener = new TcpListener(IPAddress.Loopback, 0);
              listener.Start();
              int port = ((IPEndPoint)listener.LocalEndpoint).Port;
              string? serverError = null;
              var server = Task.Run(async () => {
                  try {
                      using var tcp = await listener.AcceptTcpClientAsync();
                      using var tls = new SslStream(tcp.GetStream(), leaveInnerStreamOpen: false);
                      const string testPassword = "A31-owned-inert-key";
                      using var serverCert = X509CertificateLoader.LoadPkcs12(
                          cert.Export(X509ContentType.Pkcs12, testPassword), testPassword,
                          X509KeyStorageFlags.UserKeySet | X509KeyStorageFlags.PersistKeySet);
                      var certContext = SslStreamCertificateContext.Create(serverCert,
                          intermediate is null ? null : new X509Certificate2Collection { intermediate });
                      await tls.AuthenticateAsServerAsync(new SslServerAuthenticationOptions {
                          ServerCertificateContext = certContext,
                          ClientCertificateRequired = false,
                          EnabledSslProtocols = SslProtocols.Tls12 | SslProtocols.Tls13
                      });
                      var request = new byte[8192];
                      int length = await tls.ReadAsync(request);
                      string head = Encoding.ASCII.GetString(request, 0, length);
                      bool received = head.Contains("Authorization: Bearer " + token, StringComparison.Ordinal);
                      byte[] reply = Encoding.ASCII.GetBytes("HTTP/1.1 200 OK\r\nContent-Length: 5\r\nConnection: close\r\n\r\nowned");
                      await tls.WriteAsync(reply);
                      return received;
                  } catch (Exception e) {
                      serverError = e.GetType().Name + ": " + e.Message;
                      return false;
                  }
              });
          
              var policy = new X509ChainPolicy {
                  TrustMode = X509ChainTrustMode.CustomRootTrust,
                  RevocationMode = X509RevocationMode.NoCheck
              };
              policy.CustomTrustStore.Add(root);
              if (intermediate is not null) policy.ExtraStore.Add(intermediate);
              string? tlsPolicyErrors = null;
              string[]? tlsChainStatuses = null;
              string[]? tlsChainSubjects = null;
              using var handler = new SocketsHttpHandler();
              handler.SslOptions.CertificateChainPolicy = policy;
              handler.SslOptions.RemoteCertificateValidationCallback = (_, _, actualChain, errors) => {
                  tlsPolicyErrors = errors.ToString();
                  tlsChainStatuses = actualChain?.ChainStatus.Select(x => x.Status.ToString()).ToArray();
                  tlsChainSubjects = actualChain?.ChainElements.Cast<X509ChainElement>()
                      .Select(x => x.Certificate.Subject).ToArray();
                  return errors == SslPolicyErrors.None;
              };
              handler.ConnectCallback = async (context, cancellation) => {
                  var socket = new Socket(AddressFamily.InterNetwork, SocketType.Stream, ProtocolType.Tcp);
                  try {
                      await socket.ConnectAsync(IPAddress.Loopback, context.DnsEndPoint.Port, cancellation);
                      return new NetworkStream(socket, ownsSocket: true);
                  } catch {
                      socket.Dispose();
                      throw;
                  }
              };
              using var client = new HttpClient(handler) { Timeout = TimeSpan.FromSeconds(10) };
              client.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", token);
              int? status = null;
              string? error = null;
              try {
                  using var response = await client.GetAsync("https://forbidden.test:" + port + "/private");
                  status = (int)response.StatusCode;
              } catch (Exception e) {
                  error = e.InnerException?.Message ?? e.Message;
              }
              listener.Stop();
              bool received = await server.WaitAsync(TimeSpan.FromSeconds(12));
              Console.WriteLine(JsonSerializer.Serialize(new {
                  label, chainBuilt, statuses, hostname, httpStatus = status, credentialReceived = received,
                  error, serverError, tlsPolicyErrors, tlsChainStatuses, tlsChainSubjects
              }));
          }
          '@ | Set-Content -Path A31Matrix/Program.cs -Encoding utf8
          dotnet run --project A31Matrix/A31Windows.csproj -c Release
