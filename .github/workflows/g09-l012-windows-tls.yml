name: G09-L012 Windows stock TLS duplicate SAN
on:
  push:
    branches: [g09-l012-rank30-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tls-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Write inert fixture and stock TLS probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path lab -Force | Out-Null
          [IO.File]::WriteAllBytes('lab/root.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/intermediate.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/allowed.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/forbidden.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/allowed-then-forbidden.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/forbidden-then-allowed.der', [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('lab/leaf-key.pem', [Convert]::FromBase64String(''))
          @'
          using System.Net;
          using System.Net.Security;
          using System.Net.Sockets;
          using System.Security.Authentication;
          using System.Security.Cryptography;
          using System.Security.Cryptography.X509Certificates;
          using System.Text;
          using System.Text.Json;
          
          using var root = X509CertificateLoader.LoadCertificateFromFile("root.der");
          using var issuer = X509CertificateLoader.LoadCertificateFromFile("intermediate.der");
          using ECDsa key = ECDsa.Create();
          key.ImportFromPem(File.ReadAllText("leaf-key.pem"));
          
          var cases = new (string file, string host)[] {
              ("allowed.der", "allowed.test"),
              ("allowed.der", "forbidden.test"),
              ("forbidden.der", "forbidden.test"),
              ("allowed-then-forbidden.der", "forbidden.test"),
              ("allowed-then-forbidden.der", "allowed.test"),
              ("forbidden-then-allowed.der", "forbidden.test"),
          };
          var results = new List<object>();
          foreach (var (file, host) in cases)
          {
              using var publicCert = X509CertificateLoader.LoadCertificateFromFile(file);
              using var serverCert = publicCert.CopyWithPrivateKey(key);
              var listener = new TcpListener(IPAddress.Loopback, 0);
              listener.Start();
              int port = ((IPEndPoint)listener.LocalEndpoint).Port;
              using var timeout = new CancellationTokenSource(TimeSpan.FromSeconds(20));
              var serverTask = Task.Run(async () => {
                  try
                  {
                      using TcpClient socket = await listener.AcceptTcpClientAsync(timeout.Token);
                      using var ssl = new SslStream(socket.GetStream(), leaveInnerStreamOpen: false);
                      await ssl.AuthenticateAsServerAsync(new SslServerAuthenticationOptions {
                          ServerCertificate = serverCert,
                          ClientCertificateRequired = false,
                          EnabledSslProtocols = SslProtocols.Tls12,
                      }, timeout.Token);
                      byte[] buffer = new byte[128];
                      int count = await ssl.ReadAsync(buffer, timeout.Token);
                      return (handshake: true, received: Encoding.ASCII.GetString(buffer, 0, count), error: (string?)null);
                  }
                  catch (Exception error)
                  {
                      return (handshake: false, received: "", error: error.GetType().Name + ":" + error.Message);
                  }
              });
          
              bool clientHandshake = false;
              string? clientError = null;
              try
              {
                  using var socket = new TcpClient();
                  await socket.ConnectAsync(IPAddress.Loopback, port, timeout.Token);
                  using var ssl = new SslStream(socket.GetStream(), leaveInnerStreamOpen: false);
                  var policy = new X509ChainPolicy {
                      TrustMode = X509ChainTrustMode.CustomRootTrust,
                      RevocationMode = X509RevocationMode.NoCheck,
                      VerificationFlags = X509VerificationFlags.NoFlag,
                  };
                  policy.CustomTrustStore.Add(root);
                  policy.ExtraStore.Add(issuer);
                  policy.ApplicationPolicy.Add(new Oid("1.3.6.1.5.5.7.3.1"));
                  await ssl.AuthenticateAsClientAsync(new SslClientAuthenticationOptions {
                      TargetHost = host,
                      CertificateChainPolicy = policy,
                      EnabledSslProtocols = SslProtocols.Tls12,
                  }, timeout.Token);
                  clientHandshake = true;
                  await ssl.WriteAsync(Encoding.ASCII.GetBytes("Authorization: Bearer INERT-G09-L012\r\n"), timeout.Token);
                  await ssl.FlushAsync(timeout.Token);
              }
              catch (Exception error)
              {
                  clientError = error.GetType().Name + ":" + error.Message;
              }
              var server = await serverTask;
              listener.Stop();
              results.Add(new {
                  file, host,
                  certificateSha256 = Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(file))),
                  clientHandshake,
                  clientError,
                  serverHandshake = server.handshake,
                  serverReceivedInertCredential = server.received.Contains("INERT-G09-L012", StringComparison.Ordinal),
                  serverError = server.error,
              });
          }
          Console.WriteLine(JsonSerializer.Serialize(new {
              runtime = System.Runtime.InteropServices.RuntimeInformation.FrameworkDescription,
              os = System.Runtime.InteropServices.RuntimeInformation.OSDescription,
              results,
          }, new JsonSerializerOptions { WriteIndented = true }));
          '@ | Set-Content -LiteralPath lab/TlsProbe.cs -Encoding utf8
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFrameworks>net10.0;net11.0</TargetFrameworks>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup><Compile Include="TlsProbe.cs" /></ItemGroup>
          </Project>
          '@ | Set-Content -LiteralPath lab/TlsProbe.csproj -Encoding utf8
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content -LiteralPath lab/NuGet.Config -Encoding utf8
      - name: Run released Windows TLS matrix
        shell: pwsh
        env:
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location lab
          Write-Output "Runner=$env:RUNNER_OS ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          dotnet --list-sdks
          dotnet --list-runtimes
          dotnet restore TlsProbe.csproj --configfile NuGet.Config
          dotnet build TlsProbe.csproj --no-restore -f net11.0
          dotnet build TlsProbe.csproj --no-restore -f net10.0
          dotnet bin/Debug/net11.0/TlsProbe.dll | Tee-Object -FilePath tls11.json
          dotnet bin/Debug/net10.0/TlsProbe.dll | Tee-Object -FilePath tls10.json
          foreach ($file in @('tls11.json', 'tls10.json')) {
            $matrix = Get-Content $file -Raw | ConvertFrom-Json
            $positive = $matrix.results | Where-Object { $_.file -eq 'allowed.der' -and $_.host -eq 'allowed.test' }
            $nameDenied = $matrix.results | Where-Object { $_.file -eq 'allowed.der' -and $_.host -eq 'forbidden.test' }
            $constraintDenied = $matrix.results | Where-Object { $_.file -eq 'forbidden.der' -and $_.host -eq 'forbidden.test' }
            if (-not $positive.clientHandshake -or -not $positive.serverReceivedInertCredential -or $nameDenied.clientHandshake -or $constraintDenied.clientHandshake) { throw "Baseline failed in $file" }
          }
      - name: Retain exact TLS matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g09-l012-rank30-windows-tls
          path: lab/tls*.json
          if-no-files-found: warn
