      - name: Install official 11.0.2xx daily SDK and verify archive
        shell: bash
        run: |
          set -euo pipefail
          url=https://aka.ms/dotnet/11.0.2xx/daily/dotnet-sdk-linux-x64.tar.gz
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/eop046-daily-sdk.tar.gz"
          curl -fsSL --retry 3 "$url.sha512" -o "$RUNNER_TEMP/eop046-daily-sdk.sha512"
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          base=pathlib.Path(os.environ['RUNNER_TEMP'])
          archive=base/'eop046-daily-sdk.tar.gz'
          want=(base/'eop046-daily-sdk.sha512').read_text().strip().split()[0].lower()
          actual=hashlib.sha512(archive.read_bytes()).hexdigest()
          print('daily_sdk_archive_bytes=',archive.stat().st_size)
          print('daily_sdk_sha512_match=',want==actual)
          assert re.fullmatch('[0-9a-f]{128}',want) and want==actual
          PY
          mkdir -p "$RUNNER_TEMP/eop046-daily-sdk"
          tar -xzf "$RUNNER_TEMP/eop046-daily-sdk.tar.gz" -C "$RUNNER_TEMP/eop046-daily-sdk"
          echo "$RUNNER_TEMP/eop046-daily-sdk" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$RUNNER_TEMP/eop046-daily-sdk" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record toolchain and install Android workload
        shell: bash
        working-directory: labs/eop046
        run: |
          dotnet --info
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sudo -H env -u XDG_RUNTIME_DIR ANDROID_HOME="$ANDROID_HOME" DOTNET_ROOT="$DOTNET_ROOT" DOTNET_CLI_HOME="$RUNNER_TEMP/eop046-root-dotnet" "$DOTNET_ROOT/dotnet" workload install android --source https://api.nuget.org/v3/index.json --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json
          dotnet workload list
      - name: Install emulator image and build controlled app
        shell: bash
        working-directory: labs/eop046
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --install 'system-images;android-35;google_apis;x86_64' 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'
          set -o pipefail
          test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          dotnet build actor/Actor.csproj -c Debug --nologo
          dotnet build android/android046.csproj -c Debug --nologo
          AVD_HOME="$RUNNER_TEMP/eop046-avds"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          echo no | ANDROID_AVD_HOME="$AVD_HOME" "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n eop046_android35 -k 'system-images;android-35;google_apis;x86_64' -p "$AVD_HOME/eop046_android35.avd" --force
          test -f "$AVD_HOME/eop046_android35.ini"
      - name: Boot owned Android 35 emulator
        shell: bash
        run: |
          test -e /dev/kvm
          test -f "$ANDROID_AVD_HOME/eop046_android35.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          sudo chown "$USER" /dev/kvm
          nohup "$ANDROID_HOME/emulator/emulator" -avd eop046_android35 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/eop046-emulator.log" 2>&1 &
          timeout 300 adb wait-for-device
          for attempt in $(seq 1 150); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && adb -s emulator-5554 shell cmd package list packages -3 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5554 shell cmd package list packages -3
      - name: Test hot reload after forged peer closes
        shell: bash
        env:
          EOP046_POST_CLOSE: "1"
        run: |
          python3 labs/eop046/check_daily_first_peer.py
      - name: Preserve controlled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eop046-daily-postclose-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            labs/eop046/daily-first-peer.json
            ${{ runner.temp }}/eop046-emulator.log
