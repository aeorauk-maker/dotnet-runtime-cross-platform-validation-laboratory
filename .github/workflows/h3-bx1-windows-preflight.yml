name: H3 Windows workload state consistency
on:
  push:
    branches:
      - h3-bx1-20261127-7f83
permissions:
  contents: read
jobs:
  windows-preflight:
    name: H3 disposable Windows fixture
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install official SDK 11.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Check repeated workload maintenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'h3-workload-state'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $globalJsonPath = Join-Path $root 'global.json'
          Set-Content -LiteralPath $globalJsonPath -Value '{"sdk":{"version":"11.0.100","workloadVersion":"11.0.100"}}' -Encoding utf8
          Push-Location $root
          try {
            $installText = (& dotnet workload install aspire --verbosity quiet 2>&1 | Out-String).Trim()
            $installExit = $LASTEXITCODE
          }
          finally { Pop-Location }
          Write-Host "SDK_VERSION=$((dotnet --version).Trim())"
          Write-Host "INSTALL_EXIT=$installExit"
          $recordRoot = Join-Path $env:ProgramData 'dotnet/workloads'
          $record = Get-ChildItem -LiteralPath $recordRoot -Filter 'globaljsonworkloadsets.json' -Recurse | Where-Object { $_.FullName -like '*11.0.100*' } | Select-Object -First 1
          Write-Host "RECORD_FOUND=$($null -ne $record)"
          if ($null -ne $record) {
            $state = Get-Content -LiteralPath $record.FullName -Raw | ConvertFrom-Json -AsHashtable
            Write-Host "RECORDED_PATH_MATCH=$($state.ContainsKey($globalJsonPath))"
            Push-Location $root
            try {
              $validText = (& dotnet workload clean 2>&1 | Out-String).Trim()
              $validExit = $LASTEXITCODE
            }
            finally { Pop-Location }
            Write-Host "VALID_CLEAN_EXIT=$validExit"
            $validState = Get-Content -LiteralPath $record.FullName -Raw | ConvertFrom-Json -AsHashtable
            Write-Host "VALID_ROOT_RETAINED=$($validState.ContainsKey($globalJsonPath))"
            $beforeLength = (Get-Item -LiteralPath $record.FullName).Length
            Set-Content -LiteralPath $globalJsonPath -Value '{"sdk":{"version":"11.0.100","workloadVersion":"11.0.101"}}' -Encoding utf8
            Push-Location $root
            try {
              $changedText = (& dotnet workload clean 2>&1 | Out-String).Trim()
              $changedExit = $LASTEXITCODE
            }
            finally { Pop-Location }
            $afterLength = (Get-Item -LiteralPath $record.FullName).Length
            $afterHash = (Get-FileHash -LiteralPath $record.FullName -Algorithm SHA256).Hash
            Write-Host "CHANGED_CLEAN_EXIT=$changedExit"
            Write-Host "STATE_LENGTH_BEFORE=$beforeLength"
            Write-Host "STATE_LENGTH_AFTER=$afterLength"
            Write-Host "STATE_SHA256_AFTER=$afterHash"
            try { $null = Get-Content -LiteralPath $record.FullName -Raw | ConvertFrom-Json -AsHashtable; $parseOk = $true }
            catch { $parseOk = $false }
            Write-Host "STATE_PARSE_OK=$parseOk"
            Push-Location $root
            try {
              $freshText = (& dotnet workload clean 2>&1 | Out-String).Trim()
              $freshExit = $LASTEXITCODE
            }
            finally { Pop-Location }
            Write-Host "FRESH_CLEAN_EXIT=$freshExit"
            Write-Host "FRESH_CLEAN_JSON_ERROR=$($freshText.Contains('JsonException') -or $freshText.Contains('JSON content'))"
            Remove-Item -LiteralPath $record.FullName -Force
            Push-Location $root
            try {
              $recoveryText = (& dotnet workload clean 2>&1 | Out-String).Trim()
              $recoveryExit = $LASTEXITCODE
            }
            finally { Pop-Location }
            Write-Host "RECOVERY_CLEAN_EXIT=$recoveryExit"
          }
          exit 0
