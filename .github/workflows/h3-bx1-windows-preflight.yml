name: H3 BX1 Windows workload state control
on:
  push:
    branches:
      - h3-bx1-20261127-7f83
permissions:
  contents: read
jobs:
  windows-preflight:
    name: H3 BX1 disposable Windows fixture
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install official SDK 11.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Compare valid and changed workload roots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'h3bx1-workload-state'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $globalJsonPath = Join-Path $root 'global.json'
          Set-Content -LiteralPath $globalJsonPath -Value '{"sdk":{"version":"11.0.100","workloadVersion":"11.0.100"}}' -Encoding utf8
          Push-Location $root
          try {
            $installText = (& dotnet workload install aspire --verbosity quiet 2>&1 | Out-String).Trim()
            $installExit = $LASTEXITCODE
          }
          finally { Pop-Location }
          Write-Host "SDK_VERSION=$((dotnet --version).Trim())"
          Write-Host "INSTALL_EXIT=$installExit"
          Write-Host "INSTALL_TEXT=$(($installText -replace '\r?\n',' | ').Substring(0,[Math]::Min(300,$installText.Length)))"
          $recordRoot = Join-Path $env:ProgramData 'dotnet/workloads'
          $record = if (Test-Path -LiteralPath $recordRoot) { Get-ChildItem -LiteralPath $recordRoot -Filter 'globaljsonworkloadsets.json' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*11.0.100*' } | Select-Object -First 1 }
          Write-Host "RECORD_FOUND=$($null -ne $record)"
          if ($null -ne $record) {
            $state = Get-Content -LiteralPath $record.FullName -Raw | ConvertFrom-Json -AsHashtable
            Write-Host "RECORDED_PATH_MATCH=$($state.ContainsKey($globalJsonPath))"
            Write-Host "RECORDED_VERSION_MATCH=$($state[$globalJsonPath] -eq '11.0.100')"
            Push-Location $root
            try {
              $validText = (& dotnet workload clean 2>&1 | Out-String).Trim()
              $validExit = $LASTEXITCODE
            }
            finally { Pop-Location }
            $validState = Get-Content -LiteralPath $record.FullName -Raw | ConvertFrom-Json -AsHashtable
            Write-Host "VALID_CLEAN_EXIT=$validExit"
            Write-Host "VALID_ROOT_RETAINED=$($validState.ContainsKey($globalJsonPath))"
            Set-Content -LiteralPath $globalJsonPath -Value '{"sdk":{"version":"11.0.100","workloadVersion":"11.0.101"}}' -Encoding utf8
            Push-Location $root
            try {
              $changedText = (& dotnet workload clean 2>&1 | Out-String).Trim()
              $changedExit = $LASTEXITCODE
            }
            finally { Pop-Location }
            $changedState = Get-Content -LiteralPath $record.FullName -Raw | ConvertFrom-Json -AsHashtable
            Write-Host "CHANGED_CLEAN_EXIT=$changedExit"
            Write-Host "CHANGED_ROOT_RETAINED=$($changedState.ContainsKey($globalJsonPath))"
            Write-Host "VALID_CLEAN_TEXT=$(($validText -replace '\r?\n',' | ').Substring(0,[Math]::Min(250,$validText.Length)))"
            Write-Host "CHANGED_CLEAN_TEXT=$(($changedText -replace '\r?\n',' | ').Substring(0,[Math]::Min(250,$changedText.Length)))"
          }
          exit 0
