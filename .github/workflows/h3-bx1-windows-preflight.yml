name: H3 BX1 Windows local share preflight
on:
  push:
    branches:
      - h3-bx1-20261127-7f83
permissions:
  contents: read
jobs:
  windows-preflight:
    name: H3 BX1 disposable Windows fixture
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install official SDK 11.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Check SDK and owned local SMB fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (dotnet --version).Trim()
          Write-Host "SDK_VERSION=$version"
          if ($version -ne '11.0.100') { throw 'Unexpected SDK version' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "RUNNER_ADMIN=$isAdmin"
          $shareName = 'h3bx1-7f83'
          $root = Join-Path $env:RUNNER_TEMP $shareName
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'global.json') -Value '{"sdk":{"workloadVersion":"not-a-version"}}' -Encoding utf8
          try {
            New-SmbShare -Name $shareName -Path $root -FullAccess $env:USERNAME | Out-Null
            $uncDir = "\\localhost\$shareName"
            Write-Host "OWNED_UNC_READ=$([IO.File]::ReadAllText((Join-Path $uncDir 'global.json')).Contains('not-a-version'))"
            $empty = Join-Path $env:RUNNER_TEMP 'h3bx1-empty'
            New-Item -ItemType Directory -Path $empty -Force | Out-Null
            Push-Location $empty
            try { $denied = (& dotnet workload install h3bx1-nonexistent --skip-manifest-update 2>&1 | Out-String); $deniedExit = $LASTEXITCODE }
            finally { Pop-Location }
            Push-Location $uncDir
            try { $mutated = (& dotnet workload install h3bx1-nonexistent --skip-manifest-update 2>&1 | Out-String); $mutatedExit = $LASTEXITCODE }
            finally { Pop-Location }
            Write-Host "NO_GLOBAL_JSON_EXIT=$deniedExit"
            Write-Host "UNC_GLOBAL_JSON_EXIT=$mutatedExit"
            Write-Host "NO_GLOBAL_JSON_INVALID_VERSION=$($denied.Contains('not-a-version'))"
            Write-Host "UNC_GLOBAL_JSON_INVALID_VERSION=$($mutated.Contains('not-a-version'))"
            Write-Host "UNC_GLOBAL_JSON_NAMED=$($mutated.Contains('global.json'))"
          }
          finally {
            if (Get-SmbShare -Name $shareName -ErrorAction SilentlyContinue) {
              Remove-SmbShare -Name $shareName -Force | Out-Null
            }
          }
