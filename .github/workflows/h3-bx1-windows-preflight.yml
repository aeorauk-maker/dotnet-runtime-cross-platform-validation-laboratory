name: H3 BX1 Windows SDK workload state
on:
  push:
    branches:
      - h3-bx1-20261127-7f83
permissions:
  contents: read
jobs:
  windows-preflight:
    name: H3 BX1 disposable Windows fixture
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install official SDK 11.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100
      - name: Inspect workload installer selection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $command = Get-Command dotnet
          $dotnetRoot = Split-Path $command.Source -Parent
          $marker = Join-Path $dotnetRoot 'metadata/workloads/11.0.100/installertype/msi'
          $programFilesRoot = Join-Path $env:ProgramFiles 'dotnet'
          $programFilesMarker = Join-Path $programFilesRoot 'metadata/workloads/11.0.100/installertype/msi'
          Write-Host "SDK_VERSION=$((dotnet --version).Trim())"
          Write-Host "DOTNET_ROOT=$dotnetRoot"
          Write-Host "SETUP_DOTNET_MSI_MARKER=$(Test-Path -LiteralPath $marker)"
          Write-Host "PROGRAMFILES_DOTNET_EXISTS=$(Test-Path -LiteralPath $programFilesRoot)"
          Write-Host "PROGRAMFILES_MSI_MARKER=$(Test-Path -LiteralPath $programFilesMarker)"
          Write-Host "SDK_LIST=$((dotnet --list-sdks) -join '; ')"
          if (Test-Path -LiteralPath $marker) { Write-Host "MARKER_TEXT=$([IO.File]::ReadAllText($marker).Trim())" }
          if (Test-Path -LiteralPath $programFilesMarker) { Write-Host "PROGRAMFILES_MARKER_TEXT=$([IO.File]::ReadAllText($programFilesMarker).Trim())" }
