name: Windows IPv6 route survey
on:
  push:
    branches: [rank-19-a34-winroute-20261128]
permissions:
  contents: read
jobs:
  survey:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Probe native link-local routing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $links = @(Get-NetIPAddress -AddressFamily IPv6 | Where-Object { $_.IPAddress -match '^fe80:' -and $_.AddressState -eq 'Preferred' })
          Write-Output ('LINK_LOCAL_COUNT=' + $links.Count)
          Write-Output ('UP_NIC_COUNT=' + @(Get-NetAdapter | Where-Object Status -eq 'Up').Count)
          $interfaces = @($links | Select-Object -ExpandProperty InterfaceIndex -Unique)
          Write-Output ('LINK_LOCAL_INTERFACE_COUNT=' + $interfaces.Count)
          foreach ($i in $interfaces) { $a = Get-NetAdapter -InterfaceIndex $i -ErrorAction SilentlyContinue; Write-Output ('LINK_IFACE=' + $i + ':' + $a.Name + ':' + $a.InterfaceDescription) }
          if ($links.Count -eq 0) { Write-Output 'UNSCOPED_LOCAL_PROBE=NO_LINK_LOCAL'; exit 0 }
          $entry = $links[0]
          $raw = ($entry.IPAddress -split '%')[0]
          $scoped = [System.Net.IPAddress]::Parse($raw + '%' + $entry.InterfaceIndex)
          $listener = [System.Net.Sockets.TcpListener]::new($scoped, 0)
          try {
            $listener.Start()
            $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
            $client = [System.Net.Sockets.TcpClient]::new([System.Net.Sockets.AddressFamily]::InterNetworkV6)
            try {
              $task = $client.ConnectAsync([System.Net.IPAddress]::Parse($raw), $port)
              if (-not $task.Wait(3000)) { Write-Output 'UNSCOPED_LOCAL_PROBE=TIMEOUT' }
              else { $task.GetAwaiter().GetResult(); Write-Output 'UNSCOPED_LOCAL_PROBE=CONNECTED' }
            } catch { Write-Output ('UNSCOPED_LOCAL_PROBE=ERROR_' + $_.Exception.GetType().Name) }
            finally { $client.Dispose() }
          } catch { Write-Output ('LISTEN_PROBE=ERROR_' + $_.Exception.GetType().Name) }
          finally { $listener.Stop() }
      - name: Probe two scoped listeners
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ids = @(Get-NetIPAddress -AddressFamily IPv6 | Where-Object { $_.IPAddress -match '^fe80:' -and $_.AddressState -eq 'Preferred' } | Select-Object -ExpandProperty InterfaceIndex -Unique)
          if ($ids.Count -lt 2) { Write-Output 'DUAL_PROBE=ONE_INTERFACE'; exit 0 }
          $ip = 'fe80::c0de:34'
          $added = @()
          $stage = 'add-address'
          $la = $null; $lb = $null
          try {
            foreach ($id in @($ids[0], $ids[1])) {
              New-NetIPAddress -InterfaceIndex $id -IPAddress $ip -PrefixLength 64 -SkipAsSource $true -ErrorAction Stop | Out-Null
              $added += $id
            }
            $stage = 'wait-address'
            foreach ($id in @($ids[0], $ids[1])) {
              $state = 'Missing'
              for ($n = 0; $n -lt 12; $n++) {
                $found = Get-NetIPAddress -InterfaceIndex $id -IPAddress $ip -ErrorAction SilentlyContinue
                if ($found) { $state = [string]$found.AddressState }
                if ($state -eq 'Preferred') { break }
                Start-Sleep -Milliseconds 500
              }
              Write-Output ('ADDRESS_STATE_' + $id + '=' + $state)
            }
            $stage = 'parse-address'
            $a = [System.Net.IPAddress]::Parse($ip + '%' + $ids[0])
            $b = [System.Net.IPAddress]::Parse($ip + '%' + $ids[1])
            $stage = 'listen-A'
            $la = [System.Net.Sockets.TcpListener]::new($a, 0)
            $la.Start()
            $port = ([System.Net.IPEndPoint]$la.LocalEndpoint).Port
            $stage = 'listen-B'
            $lb = [System.Net.Sockets.TcpListener]::new($b, $port)
            $lb.Start()
            function Probe($target, $label) {
              $c = [System.Net.Sockets.TcpClient]::new([System.Net.Sockets.AddressFamily]::InterNetworkV6)
              try {
                $t = $c.ConnectAsync($target, $port)
                if (-not $t.Wait(3000)) { Write-Output ($label + '=TIMEOUT'); return }
                $t.GetAwaiter().GetResult() | Out-Null
                if ($la.Pending()) { $peer = $la.AcceptTcpClient(); $peer.Dispose(); Write-Output ($label + '=A') }
                elseif ($lb.Pending()) { $peer = $lb.AcceptTcpClient(); $peer.Dispose(); Write-Output ($label + '=B') }
                else { Write-Output ($label + '=NO_LISTENER') }
              } catch { Write-Output ($label + '=ERROR_' + $_.Exception.GetType().Name) }
              finally { $c.Dispose() }
            }
            $stage = 'probe'
            Probe $a 'EXPLICIT_A'
            Probe $b 'EXPLICIT_B'
            Probe ([System.Net.IPAddress]::Parse($ip)) 'UNSCOPED'
          } catch { $cause = $_.Exception; if ($cause.InnerException) { $cause = $cause.InnerException }; Write-Output ('DUAL_PROBE=SETUP_ERROR_' + $stage + '_' + $cause.GetType().Name); Write-Output ('DUAL_REASON=' + $cause.Message) }
          finally {
            if ($la) { $la.Stop() }
            if ($lb) { $lb.Stop() }
            foreach ($id in $added) { Remove-NetIPAddress -InterfaceIndex $id -IPAddress $ip -Confirm:$false -ErrorAction SilentlyContinue }
          }
