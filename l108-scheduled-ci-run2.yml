              lower_process.terminate()
              lower_process.wait(timeout=10)
              out = pathlib.Path("l108-result.json")
              out.write_text(json.dumps(summary, indent=2) + "\n")
              print("RESULT_SUMMARY=" + json.dumps(summary, separators=(",", ":")))
          PY

      - name: Upload redacted registry result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-nuget-protected-ci-result
          path: l108-result.json
          if-no-files-found: ignore

      - name: Stop ephemeral GitLab
        if: always()
        shell: bash
        run: |
          docker rm --force l108-owned-ci-runner >/dev/null 2>&1 || true
          docker rm --force l108-owned-gitlab >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/l108-root-token"
